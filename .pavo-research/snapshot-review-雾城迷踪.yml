                    - textbox "输入剧集内容" [disabled] [ref=f3e478]: 【场景】夜，地下实验室核心。 △ 应急电源切入，刺眼的红光取代了之前令人作呕的蓝光，警报声在巨大的球形空间内凄厉地回荡。空气中弥漫的“记忆重置”雾气因系统过载而变得不稳定，像沸腾的水面。银面具站在操作台后，双手死死按在主控旋钮上，试图维持那毁灭性的功率。林远和苏青在剧烈的爆炸冲击中被掀飞，重重撞在冰冷的金属舱体上，七窍流血却未失去意识。 【场景】夜，地下实验室走廊。 △ 沉重的防爆门被液压钳强行撕裂，火花四溅。陈局长手持特制的电磁脉冲步枪，身后跟着全副武装的警员，他们身上的战术装备上闪烁着“市政特警”的标识。他逆着刺眼的强光走进核心大厅，步伐稳健，眼神中没有丝毫畏惧。 陈局长（举起枪，对准银面具，声音通过扩音器传遍大厅）：净室，结束了。陈局长的突击队已封锁所有出口，你无路可逃。 银面具（冷笑，并未回头，继续操作控制台）：陈局长，你以为你抓的是谁？我抓的是整座城市。这雾气一旦扩散，外面的人只会变成没有思想的提线木偶。你抓得住我，但抓不住已经启动的倒计时。 △ 林远挣扎着爬起来，咳出一口血沫。他看着陈局长，又看向银面具，大脑飞速运转。雾气浓度还在增加，警员们的眼神开始变得涣散，动作也变得迟缓。 林远（大声喊道）：陈局长，听我说！雾气不是用来杀人的，是用来“格式化”大脑皮层的。一旦浓度达到临界点，所有接触到的人——包括你，包括我，包括那群受害者——全都会变成行尸走肉！ 陈局长（眉头紧锁，枪口微颤）：我知道。所以我们要摧毁它。银面具，放下控制台！ 银面具（转过身，摘下了银色面具，露出那张苍白且充满狂热神情的脸，正是当年失踪的“零号实验体”导师）：你不懂，林远。混乱是城市最大的毒药，而遗忘，是唯一的解药。我要把这解药，注射给每一颗肮脏的大脑。 △ 银面具猛地拍下了控制台的另一个红色按钮。整个实验室剧烈震动，墙壁上的舱体开始发出刺耳的蜂鸣，舱门自动弹开，里面沉睡的“实验体”们睁开了空洞的眼睛。 【场景】夜，地下实验室核心。 △ 混乱爆发。苏青从阴影中冲出，不知何时手中多了一把高频震荡刀。她身形矫健，如鬼魅般掠向操作台，意图切断主控线路。 苏青（眼神冰冷，动作却带着决绝）：林远，我骗了你，但我没骗我自己。我不希望任何人失去记忆，包括你。 △ 银面具侧身闪开苏青的刀锋，反手一掌将她击飞。苏青撞破玻璃墙，落入下方的数据深渊。银面具看着林远，眼中闪过一丝复杂的情绪。 银面具：你恨我，因为是你当年的误判，才让我被关进这该死的实验室，才有了“净室”。你毁了我，林远。现在，我要毁掉这座城市，包括你那引以为傲的正义。 △ 银面具启动了一个便携式记忆消除装置，一道强光射向林远。林远没有躲避，他死死盯着银面具，脑海中闪过一个疯狂的念头。 林远（突然大笑，笑声在空旷的实验室里显得格外凄凉）：你错了。记忆不是毒药，林远。是你选择把它变成了毒药。但今天，我要把这毒药吐出来。 △ 林远猛地扑向操作台，双手死死抓住那个正在过载的主控核心。那不是普通的设备，而是一个巨大的、散发着蓝光的神经连接接口。他感觉到一股庞大的数据洪流顺着手臂涌入脑海，那是整座城市、成千上万人的记忆碎片。 银面具（惊恐地大喊）：你在干什么！你会烧毁自己的记忆中枢！你会变成白痴！ 林远（咬牙，双眼布满血丝，声音从喉咙深处挤出）：如果忘记这一切，能换来大家清醒……那这笔交易，我林远，干了。 △ 林远用力一拧，将核心接口强行插入自己的后颈。瞬间，他的身体剧烈抽搐，周围的雾气开始以他为中心逆向消散。他看到了苏青在深渊中的挣扎，看到了陈局长在枪口下的无助，看到了三年前挚友倒在血泊中的那一刻。 △ 陈局长扣动扳机，子弹擦过林远的肩膀，击中银面具的面板。银面具惨叫着倒地，控制台冒出黑烟，但蓝光并未熄灭，反而越来越亮。 陈局长（冲着林远嘶吼）：林远！快拔掉！你会死的！ 林远（意识开始模糊，嘴角流下血，却死死护住接口）：不……还有时间。苏青……出来…… △ 苏青从数据深渊中爬起，浑身是血，她不顾一切地扑向林远，双手死死抓住林远的手臂，试图将他从接口上拽下来。两人的身影在刺眼的蓝光中拉扯、撕扯。周围的警员和“实验体”们在雾气的退去中逐渐恢复意识，迷茫地看着中央的这一幕。 苏青（泪水与血水混合，声嘶力竭）：林远！不要！你不能丢下我！你不能丢下你自己！ △ 就在苏青即将把林远拉开的瞬间，控制台发出一声巨响，核心过载达到峰值。林远和苏青两人，连同那团耀眼的蓝光，被一股无形的力量猛然吸入设备内部。画面瞬间被蓝白两色充斥，刺目的光芒中，林远的眼睛睁得极大，瞳孔中倒映着苏青绝望的脸。 △ 实验室陷入死一般的寂静。控制台黑屏。林远和苏青消失得无影无踪，只有林远的手，还无力地垂在操作台边缘，手指僵硬地指向那枚早已停止跳动的银白色信号发射器。 陈局长（颤抖着走近，捡起地上的发射器，按下了开关，只听到一阵嘈杂的电流声，没有回音）：……失联了。林远，苏青，全部失联。
