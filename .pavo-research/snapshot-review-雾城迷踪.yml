                    - textbox "输入剧集内容" [disabled] [ref=f3e446]: 【场景】日，警局接待室。 △ 窗外阴沉的天空压得极低，空气里弥漫着潮湿的霉味与劣质咖啡的气息。林远将那块沾着雨水污渍的记忆数据盘放在陈局长办公桌上，手指在金属表面停顿了片刻，指尖微微颤抖。陈局长推了推眼镜，并没有伸手去拿，只是那双浑浊的眼睛里闪过一丝不易察觉的恐惧，随即又被官僚式的冷静掩盖。 陈局长（身体向后靠在椅背上，双手交叉）：小林，你这次提交的证据链太完整了。完整到，不像是一个外人能拿到的。这盘子里的东西，会动摇这座城市的根基。你确定要把它交给我？ 林远（向前探身，目光灼灼）：陈局，三起失踪案，加上我手里的这份“净室”内部数据，已经足够立案了。那些被抹去记忆的人，他们的痛苦是被刻意制造的。这不是普通案件，这是犯罪。 陈局长（轻笑一声，手指有一搭没一搭地敲击着桌面）：犯罪？小林，你以前是个天才，但现在你太天真了。你以为这个城市只有你和我在看着吗？你以为警局是干净的？ △ 林远皱起眉头，感到一股寒意顺着脊背爬上来。陈局长的语气里带着一种劝诱般的残忍，仿佛他早就知道结果。 陈局长（压低声音，身体前倾，直视林远）：我查过你提交的每一个指纹、每一帧影像。你知道为什么警方一直没动静吗？因为“净室”在高层有人。甚至就在隔壁那栋楼里。如果我收下这份证据，明天早上，你我都会成为失踪者。你懂吗？我不是在拒绝你，我是在警告你。 林远（死死盯着陈局长，声音冷硬）：那你让我怎么办？看着他们继续清除人们的记忆？看着我的老友…… 陈局长（猛地拍了一下桌子，茶杯剧烈晃动，茶水溢出染湿了文件）：别提他！小林，我求你，退出去。别查了。拿着你的报酬，离开这座城市。这是我能给你的最后建议。 【场景】日，警局外老旧街区。 △ 林远推开警局厚重的玻璃门，冷冽的风瞬间灌入衣领。街道上空无一人，只有几片枯黄的落叶在积水里打转。他点燃一支烟，深深吸了一口，烟雾缭绕中，他的眼神从迷茫转为决绝。他明白，指望体制已经毫无意义。陈局长的恐惧不是伪装，而是真实的压迫。他必须靠自己。 △ 林远掐灭烟头，整理了一下大衣，转身准备离开。他的脚步很稳，但目光警惕地扫视着四周。就在他转过街角的一瞬间，余光瞥见马路对面一辆黑色轿车的车窗反光。那里有两个模糊的人影，正死死盯着他的方向。更远处，巷口阴影里，另一个穿着黑色战术服的持枪身影缓缓现身，枪口稳稳地对准了他的后背。 林远（停下脚步，背对着镜头，声音在风雪中显得异常清晰）：看来，想让我退出的人，不止警察一个。
