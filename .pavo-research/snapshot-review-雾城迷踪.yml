                  - generic [ref=f3e304]: 林远曾是天才侦探，因三年前的一场误判导致挚友死亡，从此酗酒落魄，在出租屋里借酒消愁。直到城中接连发生离奇的失踪案，警方束手无策，一名与当年案件有隐秘关联的女子找到他，提供巨额酬金请求协助。林远本想拒绝，但女子留下的证据中出现了挚友当年的身影，这让他不得不重新入局。随着调查深入，林远发现失踪者均与一个名为“净室”的地下组织有关，该组织试图通过消除特定记忆来重塑城市秩序。林远利用自身对旧案的熟悉，逐步破译线索，却发现自己也是该组织曾经的成员。当真相揭开，他必须面对当年误判的根源，并阻止组织首领利用记忆技术控制整个城市。故事在终极对决中达到高潮，林远选择牺牲自己的记忆以保全他人，最终在迷雾散去时，留下开放式的结局。
