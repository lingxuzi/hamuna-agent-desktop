                    - textbox "输入剧集内容" [disabled] [ref=f3e350]: 【场景】夜，老旧出租屋。 雨点密集地砸在破旧的玻璃窗上，水痕蜿蜒而下，模糊了窗外灰暗的老旧街区。屋内弥漫着陈年威士忌与霉变纸张混合的刺鼻气味，昏暗的台灯投下一圈摇摇欲坠的光晕。 △ 林远蜷缩在沙发一角，衬衫领口敞开着，布满胡茬的下巴埋进手掌。他面前散落着几瓶空了的酒瓶，其中一只被捏在手中，指节因用力而泛白。 林远（低沉，断续）：陈默…… △ 他猛地灌下一口酒，呛咳声在逼仄的空间里回荡。灯光似乎在这一刻剧烈闪烁了一下，林远眼底的痛色随光晕一同碎裂。 【场景】夜，老旧出租屋（回忆：三年前）。 画面色调骤然转冷，冷白色的警灯红光交替闪烁，刺破了死寂的夜空。湿冷的雨滴打在黑色雨伞上，形成急促的鼓点。林远穿着笔挺的旧风衣，死死攥着那份泛黄的证词，站在警戒线外，瞳孔急剧收缩。 △ 他面前，挚友陈默瘫软在冰冷的积水中，雨水冲刷着陈默胸口的血迹，那张曾经充满朝气的脸此刻却呈现出毫无生气的灰败。林远的喉结剧烈滚动，视线死死锁在陈默逐渐失去焦距的眼眸上，仿佛要在那双眼睛里寻找一个根本不存在的、能够推翻他所有推理的缝隙。他颤抖着嘴唇，试图说些什么，却只挤出一串破碎的、被雨水吞没的音节。 林远（绝望，嘶哑）：你看着我……看着我！ 【场景】夜，老旧出租屋。 台灯猛地熄灭，世界彻底陷入黑暗。林远猛地大口喘息，仿佛刚从窒息的深水中被扔回陆面，冷汗瞬间浸透了他的脊背。 △ 他在黑暗中摸索着，骨节碰撞在木质茶几上发出沉闷的响声。手指颤抖着探向墙壁的开关，却误打误撞地摸到了一枚布满灰尘的金属徽章——那是林远曾经作为顶尖侦探的骄傲，如今却成了他最不愿触碰的耻辱。他死死攥住它，仿佛抓着最后一根救命稻草，指骨发出危险的咯吱声。 △ 窗外，连绵的雨幕中，一阵刺耳的警笛声骤然撕裂了夜空，由远及近，尖锐得仿佛要划破林远脆弱不堪的神经。 △ 林远浑身一僵，死死盯着窗户。雨幕中，楼下老旧街区的巷口，刺目的红蓝警灯疯狂闪烁，几辆警车急刹停在积水中，警员们撑着伞焦急地跑向街角，大声呼喊着什么。模糊的喊话声顺着潮湿的风飘进屋里——“第七起失踪案，现场没有留下任何搏斗痕迹……” △ 林远缓缓放下那枚冰冷的徽章，眼神从空洞逐渐凝聚，透出一丝极其危险与冷厉的光。他猛地站起身，椅子在地毯上发出刺耳的摩擦声，他大步走向窗户，推开那扇漏风的玻璃，冰冷的雨丝瞬间扑打在他满是泪痕的脸颊上。
