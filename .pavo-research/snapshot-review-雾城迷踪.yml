                    - textbox "输入剧集内容" [disabled] [ref=f3e366]: 【场景】夜，老旧出租屋。 △ 林远推开窗户，雨水扑打在他的脸上。他低头看了一眼自己沾满泥渍的鞋底，又抬头看向楼下那几辆还在闪烁的警车。巷口被警戒线封锁，雨水在湿漉漉的柏油路面上积聚成一片浑浊的浅水洼。他沉默了片刻，拉上窗帘，让屋内的光线重新昏暗下来，仿佛要把那个混乱的世界隔绝在外。 【场景】夜，老旧出租屋。 △ 门铃声毫无预兆地响起，尖锐且急促。林远没有动，只是靠在墙边，手慢慢摸向茶几上的酒壶。门铃再次响起，这次伴随着有人拍打防盗门的沉闷声响。他眯起眼睛，走到门边，没有开灯，只是透过猫眼往外看去。走廊里的感应灯坏了一半，昏暗的光线下，一个身影静静地站在门外。 △ 那是一个女人，穿着一件深灰色的长款风衣，帽檐压得很低，雨水顺着帽檐滴落在地面上。她站得笔直，没有丝毫挪动位置的迹象，仿佛已经站了很久。林远盯着她看了几秒，转身走向门边。他并没有拉开门，而是将钥匙在锁孔里捅了一下，发出清脆的咔哒声。 林远（冷淡，声音低沉）：我不接活儿。 门外沉默了几秒。随后，一只修长的手伸进门缝，将一张黑色的名片和一本黑色的文件夹塞了进来。林远侧身避开，看着那个身影在门外的阴影中停留片刻，然后转身离开。雨幕瞬间将那个深灰色的背影吞没，只剩下一串湿漉漉的脚印延伸到走廊尽头。 △ 林远叹了口气，弯腰捡起地上的东西。他撕开文件夹，里面是一张打印出来的照片，还有一张支票。他的手指在支票金额上停留了一瞬，随即目光移向照片。照片上的地点，是三年前陈默出事的那条巷子，背景模糊，但前景中有几个清晰的身影。林远的瞳孔猛地收缩，胸口一阵剧烈的绞痛。 【场景】夜，老旧出租屋。 △ 林远将照片放大，台灯的光线照在那些细节上。照片是偷拍的视角，画面中，一个戴面具的男人正被几个黑衣人押着，而在画面边缘，有一张脸正对着镜头，嘴角勾起一抹诡异的、毫无生气的微笑。林远认出了那张脸——那是陈默。不，那只是陈默的脸。 △ 他的手开始颤抖，照片在桌面上发出轻微的拍打声。他猛地拉开抽屉，拿出一瓶还没喝完的威士忌，仰头灌下一大口。烈酒顺着喉咙流下，却无法浇灭胸腔里那股翻涌的寒意。他再次看向照片，那个诡异的笑容仿佛在对他挑衅。这张脸，不可能出现在这里。除非，当年的死亡根本不是意外。除非，那个组织还在运作，甚至，还活着。 △ 林远猛地站起身，椅子向后倒去，发出巨大的声响。他抓起那张黑色的名片，上面只印着一个名字：苏青。他走到窗边，看着楼下依旧封锁的现场，眼神中的犹豫与痛苦逐渐褪去，取而代之的是一种决绝。他拿起电话，拨通了那个名字。 △ 电话响了三声，被接起。 苏青（声音平静，带着电流的微响）：我猜你会打给我，林远。既然你看到了一张不该出现在那里的照片，那么，你该知道我们为什么需要彼此。 △ 林远握着电话的手指青筋暴起，他盯着窗外那一闪而过的警灯，声音沙哑却异常清晰。 林远：地点。时间。我想知道，陈默到底还活着没。
