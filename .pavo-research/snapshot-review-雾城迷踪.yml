                    - textbox "输入剧集内容" [disabled] [ref=f3e494]: 【场景】日，警局走廊。 △ 雨声渐息，灰蓝色的晨光透过百叶窗在地板上切出条纹。走廊里弥漫着淡淡的咖啡味和消毒水味。林远坐在长椅上，身上换了一件干净的白衬衫，头发整齐，眼神中带着一种久违的、近乎天真的清澈。他看起来不像一个刚经历过生死搏杀的侦探，更像是一个初次误入此地的陌生人。 苏青抱着一个深褐色的旧皮箱坐在对面，箱子里隐约露出那枚银白色信号发射器的一角。她低着头，手指轻轻摩挲着箱子的锁扣，指尖因为用力而泛白。陈局长站在不远处，整理着警服袖口，目光在两人之间游移，最后落在林远身上，停留了整整五秒。 陈局长（声音平稳，公事公办）：林先生，根据上级指示，该案件已正式结案。所有涉案人员已被清除，设备已销毁。这是结案通知书，请签字。 △ 陈局长将一份文件推到林远面前。林远接过文件，眉头微皱，似乎在努力辨认上面的字迹。他抬起头，看向陈局长，那眼神中没有恐惧，也没有感激，只有一种纯粹的、毫无防备的疑惑。 林远（轻声）：陈局长？我不记得我们见过面。我也……不记得我为什么要坐在这里。 △ 苏青猛地抬头，瞳孔剧烈收缩。陈局长的嘴角抽动了一下，随即恢复了镇定，但握着文件的手微微僵硬。 陈局长（掩饰性地轻咳一声）：你受了伤，记忆有些混乱是正常的。签完字，就回去吧。苏小姐会送你。 林远（转向苏青，眼神柔和而陌生）：苏小姐，谢谢你来送我。但我总觉得……我应该认识你。我的直觉告诉我，我们之间有某种联系，很深的联系。 苏青（避开林远的目光，站起身，将皮箱紧紧抱在胸前）：没什么，林远。你只是累了。走吧，车在楼下。 【场景】夜，老旧街区雨巷。 △ 雨又下起来了。细密的雨丝像是一层灰色的纱，笼罩着破旧的街区。霓虹灯在积水中晕染开，红的、蓝的、绿的，光影斑驳。林远走在苏青身后，步伐略显踉跄。他似乎对周围的一切充满好奇，却又小心翼翼地保持着距离。 △ 苏青走在前面，背影单薄而决绝。她回头看了一眼，林远正停在一家已经打烊的小面馆门口，盯着橱窗里那碗空荡荡的汤面发呆。 △ 林远转身继续往前走。就在经过一个狭窄的拐角时，他的口袋微微晃动。一张被雨水浸湿、揉得皱巴巴的照片，从口袋里滑落到泥泞的路面上。苏青的脚步顿住了。她没有回头，但手中的皮箱握得更紧了。 △ 照片躺在积水里，雨水冲刷着上面的污渍。照片边缘已经泛黄，那是三年前那张著名的、被林远自己亲手撕碎又拼合的照片。照片上，年轻的林远和挚友并肩站在街头，挚友的笑容灿烂得有些刺眼，而林远的眼神，即便在黑白灰的雨雾中，也透着一种令人战栗的清明。 △ 苏青停下脚步，背对着林远，深深吸了一口气，仿佛在吸入了最后一口自由的空气，又像是在将所有的过去彻底咽下。
