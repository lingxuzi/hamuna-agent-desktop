                    - textbox "输入剧集内容" [disabled] [ref=f3e430]: 【场景】夜，地下实验室。 △ 警报声尖锐地撕裂了死寂，红光在金属墙壁上疯狂跳动。林远握紧工牌，指节因用力而泛白，他猛地推开苏青，低吼道：“走！他们要锁门了！”苏青踉跄了一步，随即稳住身形，反手将控制台上的数据流强行切断了三个主节点。冰冷的机械臂从天花板垂下，试图封锁出口，但苏青已经冲向了那条仅容一人通过的排水管道。林远紧随其后，在管道合拢的最后一瞬，他瞥见了那些培养舱中灰白色的生物组织，它们在红光下仿佛活物般扭动，无声地控诉着这个组织带来的恐怖。 【场景】夜，潮湿的小巷。 △ 两人跌跌撞撞地冲进小巷，雨水瞬间打湿了他们狼狈的身躯。林远靠在积水的墙根处，大口喘息着，眼神却依旧锋利。他从口袋里摸出那块泛黄的工牌，借着闪电的微光，再次确认上面的名字。雨水顺着他的脸颊滑落，分不清是冷汗还是泪水。 苏青（蹲下身，从随身背包里取出一块黑色的金属矩形，雨水滴落在表面发出轻微的“滋滋”声）：刚才在控制台前，我顺走了一块核心数据盘。这是他们的“记忆备份库”，里面记录着所有被提取者的原始数据。 林远（盯着那块数据盘，声音沙哑）：你想用它做什么？ 苏青（将数据盘塞进林远手中，眼神坚定）：解码它。林远，你不是普通侦探，你是当年的首席研究员。只有你的生物密钥，才能解开这层加密。我们需要知道，他们到底抹去了什么。 △ 林远紧紧攥着数据盘，金属的冰凉触感让他一阵战栗。他想起苏青刚才的话——陈默的死不是意外。这个念头像毒蛇一样钻入他的脑海，让他浑身发冷。 【场景】夜，出租屋。 △ 狭小的出租屋内，林远将数据盘插入一台老旧的解码器。屏幕闪烁了几下，幽蓝色的光芒照亮了他布满血丝的双眼。苏青坐在对面，双臂抱胸，沉默地注视着。解码进度条缓慢爬升，周围安静得只能听见雨敲窗棂的声音和电流的嗡嗡声。 △ 屏幕突然跳动，一段模糊的记忆影像浮现出来。画面中是三年前的地下实验室，年轻的林远穿着白大褂，正与挚友陈默激烈争论。画面中的林远眼神狂热，手里拿着一份文件，上面赫然写着“重塑计划”的代号。他指着屏幕上的数据，语气傲慢：“只要切断他们的痛苦神经回路，这座城市就会变得完美！” 林远（身体僵硬，喃喃自语）：不……这不是我做的判断…… △ 影像继续播放，林远看到自己亲手按下了启动键，而陈默在最后一刻伸手阻拦，却被林远身后的助手——一个穿着黑衣、面容模糊的身影——推倒。陈默跌落在地，头部撞击了金属边缘，鲜血染红了白色地板。 苏青（站起身，声音颤抖）：林远，你当年的误判，不是能力问题，是被设计好的。那个黑衣人…… 林远（死死盯着屏幕，瞳孔收缩）：那个黑衣人，是谁？ 【道具】记忆数据盘 △ 解码进入最后阶段，屏幕上的画面开始扭曲，那个黑衣人缓缓转过身，在闪回的光影中露出了清晰的侧脸。林远的心脏猛地一缩，那张脸让他感到一种深入骨髓的熟悉与恐惧。 △ 画面定格，黑衣人嘴角勾起一抹诡异的微笑，而屏幕下方跳出一行红色的警告文字：“警告：检测到最高权限访问，正在清除……” 林远（猛地站起来，椅子向后滑出，撞在墙上发出巨响）：该死！他们在远程格式化！ 苏青（迅速扑向电脑，双手在键盘上飞舞）：快！在清除前看清他的脸！ △ 就在屏幕彻底黑下去的最后一瞬，那张清晰的脸庞定格在林远的视网膜上。那不是陌生人，那是如今隐藏在幕后、掌握着“净室”命脉的组织首领——陈局长的亲弟弟，陈默。 林远（声音在颤抖，带着难以置信的绝望）：陈默……他还活着？不，那个凶手……是陈默？ 苏青（停下动作，回头看着林远，眼神中充满了震惊与怀疑）：林远，陈默是陈局长的弟弟？这件事，警方从未公开过。 △ 窗外一道闪电劈下，惨白的光照亮了林远惨白的脸。他手中的记忆数据盘，仿佛变成了烫手的烙铁，而真相，才刚刚开始撕裂他的灵魂。
