                    - textbox "输入剧集内容" [disabled] [ref=f4e216]: 【场景】白天，女生宿舍。 阳光有些刺眼，宿舍里堆放着几只未开封的快递箱。靠近门边的地上，放着一大桶未拆封的饮用水。 △ 柔弱矮小的周妍正用纤细的双手试图搬起那桶水，她咬着牙，脸涨得通红，身体摇摇晃晃，水桶却几乎没离开地面。 周妍（带着哭腔，气喘吁吁）：好重啊……怎么这么沉…… △ 正准备出门的林夏见状，立刻快步走过去，轻松地一把拎起水桶，稳稳地放在了饮水机旁，并熟练地撕开封口，将水桶抬起，利落地倒扣在饮水机上。水花咕嘟咕嘟地冒着泡。 林夏（拍了拍手，笑着）：妍妍，放着我来就行。你这小身板，哪搬得动这么重的水。 周妍（立刻揉着手腕，一脸感激地凑上来）：小夏，你真好！要不是有你，我今天肯定要渴死了。你简直就是我的救命恩人！ 林夏（宠溺地笑，从兜里掏出一张精美的门票）：好啦，别贫了。给，拿着。 【道具】演唱会门票 △ 周妍接过门票，看清上面的字后，眼中闪过一丝亮光。 林夏（有些小得意）：下周偶像的演唱会，我熬夜抢了好久才抢到两张，这张送给你，到时候我们一起去！ 周妍（捧着门票，欢呼雀跃）：哇！小夏，你太厉害了吧！我都不知道该怎么谢你了，你对我最好了！ 林夏（看了看手表，急匆匆地拿起包）：不跟你说了，陈屿在楼下等我，我先走啦。 △ 林夏拉开宿舍门，快步走了出去，随手带上了门。 △ 门关上的瞬间，周妍脸上的笑容瞬间消失。她嫌弃地看着手中那张普通看台区的门票，撇了撇嘴，随手把门票扔在了杂乱的书桌上。 周妍（小声嘀咕）：切，折腾半天就抢张看台票，真寒酸。 △ 周妍转了转眼睛，拿起桌上的手机，嘴角勾起一抹意味深长的笑。 【道具】手机 △ 周妍修长的手指在屏幕上快速滑动，熟练地输入了一串微信号——那是林夏男友陈屿的账号。她点击了添加好友，并在验证信息里打下一行字：“陈屿哥哥，我是周妍，今天谢谢你帮我们宿舍拿快递，小夏不知道我加你，千万别告诉她哦。” △ 手机屏幕亮着，倒映出周妍那张看似清纯却满是心机的脸。
