                    - textbox "输入剧集内容" [disabled] [ref=f4e232]: 【场景】白天，校园林荫道。 阳光透过斑驳的树叶洒在水泥路上，风吹得树叶沙沙作响。林夏与陈屿并肩走着，两人的气氛显得有些沉闷。 △ 林夏手里紧紧攥着手机，眉头微蹙，转头看向陈屿，神色中带着一丝委屈和急躁。 林夏：陈屿，今天我们明明约好了一起去图书馆，你为什么迟到那么久，甚至连个微信都不回？ 陈屿（有些不耐烦地抓了抓头发）：我都说了我临时有事，不就是迟到了一会儿，你至于这么不依不饶吗？ △ 这时，周妍不知道从哪里走了出来，快步走到两人身旁，脸上带着一抹恰到好处的无辜与担忧。 周妍（小心翼翼地扯了扯林夏的衣袖）：小夏，你别生气了。陈屿哥哥肯定不是故意的，今天太阳这么大，陈屿哥哥过来一定很辛苦，你就别怪他了。 陈屿（听到周妍的话，脸色缓和了些）：你看，周妍都比你懂事。林夏，你能不能别总是这么任性？ 周妍（连忙摆手，有些慌乱和委屈）：陈屿哥哥，你别这么说小夏。都是我不好，是我不好，如果不是我平时太笨总是需要小夏帮忙，小夏也不会因为累了而心情不好……都是我的错，你们别因为我吵架了。 林夏（看着周妍，眉头皱得更深）：周妍，这跟你有什么关系？你少说两句。 △ 陈屿见林夏语气生硬，立刻将周妍护在身后，对林夏怒目而视。 陈屿：林夏！周妍也是为了我们好，你这是什么态度？她平时那么依赖你，你对她就不能温柔点？行了，我现在不想跟你吵，我先走了。 △ 陈屿转过身，气冲冲地朝林荫道尽头走去。周妍转过头，背对着林夏，脸上柔弱的表情瞬间消失，取而代之的是一抹得逞的冷笑。但当她再次看向林夏时，又恢复了那副无辜的模样。 周妍：小夏，对不起啊，都是我不会说话，我先去劝劝陈屿哥哥，你别生我的气。 △ 周妍小跑着朝陈屿的方向追了过去。林夏站在原地，看着两人的背影，眼眶微微泛红。 【场景】白天，冷饮店。 冷饮店内开着冷气，空调风口发出轻微的嗡嗡声。林夏独自坐在一张靠窗的桌子旁，面前摆着一杯没怎么动过的冰柠檬水。 △ 玻璃窗外，阳光刺眼。林夏正失神地看着窗外，肩膀微微塌着，显得有些孤单。 △ 穿着简单T恤的许然拿着两杯冷饮走了过来，在林夏对面坐下，将一杯满杯芒果冰推到林夏面前，温和地看着她。 许然：林夏，怎么一个人在这发呆？刚才在林荫道那边，我看到你跟陈屿，还有那个……周妍了。 林夏（叹了口气，有些疲惫地揉了揉太阳穴）：别提了，跟陈屿吵了一架，周妍在中间劝架，反而越劝越说不清了。 许然（神色变得严肃起来，压低了声音）：林夏，作为你多年的高中同学，我得和你说句大实话。那个周妍，你以后还是留个心眼，离她远点吧。 林夏（有些诧异地抬起头）：为什么？周妍虽然娇气了点，但她人挺单纯的，平时也很依赖我。 许然（冷笑了一声）：单纯？林夏，旁观者清。刚才在林荫道上，你没注意到她说话时的眼神。她字字句句看似在帮你说话、在自责，实际上每一句都在把陈屿的怒火往你身上引，顺便还把自己塑造成了受害者。这种‘茶里茶气’的手段，也就陈屿那种一根筋的看不出来。 △ 林夏愣住了，许然的话像一记重锤，砸在她一直以来对周妍的信任上。她开始回想起刚才的场景，周妍那委屈的表情、恰到好处的自责，确实让陈屿对自己的误会更深了。 林夏（声音有些发颤）：她……她为什么要这么做？我对她不够好吗？ 许然：有些人就是习惯了索取，甚至见不得别人好。总之，你别太傻了，多观察观察吧。 △ 许然拍了拍林夏的肩膀，站起身离开。林夏呆坐在椅子上，从包里拿出了手机。 【道具】手机微信界面 △ 手机屏幕亮起，微信界面上，陈屿的头像安安静静。林夏发过去的解释信息，只得到了陈屿冷冰冰的几个字回复：“我很累，先各自冷静一下吧。” △ 林夏看着那条冷淡的回复，手指微微颤抖。她划着屏幕，翻看着之前周妍和陈屿的一些互动痕迹，回想起周妍背着自己加陈屿微信、以及每次争吵时周妍那恰到好处的“柔弱”和“调解”…… △ 阳光透过冷饮店的玻璃，将林夏的脸映得忽明忽暗。她的眼神逐渐从迷茫变得冰冷，心中第一次对这个朝夕相处的舍友周妍，产生了无法抹去的怀疑与寒意。
