                    - textbox "输入剧集内容" [disabled] [ref=f4e280]: 【场景】日，教学楼走廊。 走廊里围满了下课的学生，人群将通道围得水泄不通，窃窃私语声此起彼伏。周妍站在走廊中央，眼眶通红，身体微微颤抖，显得格外无助。陈屿站在她身侧，眉头紧锁。 △ 周妍看到林夏和许然并肩走来，立刻入戏，上前两步，声音带着哭腔，故意拔高音调，好让围观的同学们都能听清。 周妍：林夏，我今天当着大家的面，只想向你讨一个公道！我平时拿你当最好的朋友，你为什么要这么造谣、排挤我，甚至在群里引导大家网暴我？ 陈屿（有些急躁，看着林夏）：林夏，你差不多得了。周妍平时身体那么弱，你有什么气冲我来，别这样当众为难她！ 围观学生A（指指点点）：就是啊，平时看着林夏挺好相处的，没想到背地里这么霸凌舍友，太虚伪了吧。 林夏（气极反笑，面无表情地走到人群中心）：周妍，你说我霸凌你？那今天大家都在，我们就把账一笔笔算清楚。 【道具】录音笔 △ 林夏从口袋里拿出一支录音笔，修长的手指按下播放键。录音笔里顿时传出周妍尖锐且充满嫉妒的声音：“陈屿，你别看林夏平时大方，其实她私下里脾气可坏了，还经常说你家境不好、配不上她。要不是我一直劝着，她早就跟你提分手了……” △ 走廊里瞬间安静下来，只剩下录音里周妍那熟悉又恶毒的声线。陈屿的脸色刷地一下变得煞白，不可置信地盯着周妍。 周妍（面色惨白，慌乱地想要上前抢夺）：这不是我！这是合成的！林夏你竟然伪造录音陷害我！ 林夏（冷笑，躲开周妍的手，拿出手机展示微信界面）：伪造？那这些微信聊天记录也是我伪造的吗？ 【道具】聊天记录截图 △ 林夏将手机屏幕展示给围观的所有同学。屏幕上清晰地显示着周妍给陈屿发的信息：“陈屿，林夏今天又背着你和别的男生出去吃饭了，我都替你觉得不值……”而另一张截图上，则是周妍嫌弃林夏送她免费演出票、并转手在二手平台高价倒卖的聊天记录和交易记录。 围观学生B（惊呼）：我的天，这变脸速度也太快了吧！亏我昨天还在宿舍群里帮她说话，原来她才是那个绿茶啊！ 陈屿（愤怒浑身发抖，猛地推开周妍拉着他衣袖的手）：周妍！你一直在骗我？你口口声声为了我和林夏好，结果天天在背后挑拨离间？你太可怕了！ 舍友A（从人群中挤出来，满脸厌恶）：周妍，你之前在宿舍里哭哭啼啼，说林夏抢你奖学金，原来全是编的！亏我们还把你当弱者保护，以后别说你是我们宿舍的，真让人恶心！ △ 周妍见事情败露，原本柔弱可怜的表情瞬间变得扭曲和慌乱，口中语无伦次地辩解着，可周围全是不齿、鄙夷和指责的目光。 林夏（居高临下地看着瘫坐在地上的周妍，眼神中只有冰冷，毫无同情）：周妍，我照顾你、大方分享，不是因为我傻，是因为我重视这段友情。但你不配。从今天起，我们彻底划清界限。 △ 林夏收起手机，微笑着转过身。许然默契地拉起林夏的手，两人并肩穿过人群。周妍在众人鄙夷的指责声中狼狈地瘫坐在地上哭泣，彻底沦为笑柄。而林夏牵着朋友的手，迎着走廊尽头洒进来的阳光，头也不回地走向阳光洒满的校园深处。
