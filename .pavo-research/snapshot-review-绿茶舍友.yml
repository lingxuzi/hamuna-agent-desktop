                    - textbox "输入剧集内容" [disabled] [ref=f4e248]: 【场景】夜，女生宿舍。 宿舍内灯光有些昏暗，只有林夏桌上的一盏台灯亮着。周妍的床位空着，她人不在宿舍。陈屿的手机正充着电放在林夏的书桌上，屏幕不时因收到消息而亮起。 △ 林夏坐在书桌前，目光紧紧盯着那部手机。她做了一番激烈的心理斗争，最终深吸一口气，伸手拿起了陈屿的手机。 【道具】陈屿的手机 △ 手机没有设密码，林夏直接滑开了界面，点进了微信。在聊天列表的第一栏，赫然是周妍的头像。林夏的手指有些颤抖，点开了两人的对话框。 △ 屏幕上，密密麻麻全是周妍发给陈屿的消息，时间跨度足足有好几个月。林夏咬着牙，快速向上翻动着聊天记录。 周妍（文字）：陈屿哥哥，小夏今天又在宿舍发脾气了。我知道她是嫌弃我笨，但我真的不是故意惹她生气的，你别怪她好不好？ 周妍（文字）：小夏给我的那张演出门票，其实只是最普通的赠票啦。不过只要是小夏给的，再便宜我也喜欢。陈屿哥哥，你千万别告诉小夏我知道这件事，我怕她会难堪。 周妍（文字）：小夏今天好像又因为买裙子的事跟你闹别扭了？其实女孩子嘛，虚荣一点也正常，陈屿哥哥你多担待点，不像我，有几件普通的衣服穿就很满足了。 △ 看着这一条条字里行间充满了挑拨、拉踩和自我标榜的“绿茶”言论，林夏气得浑身发抖，眼眶瞬间红了，指甲深深地掐进了掌心里。 林夏（低声自语，声音带着极度的愤怒与失望）：周妍……这就是你所谓的单纯？我对你掏心掏肺，你居然在背后这样作践我！ △ 门外传来走廊里的脚步声。林夏强迫自己冷静下来，她迅速拿出自己的手机，对着陈屿的手机屏幕将这些聊天记录一条条清晰地拍了下来。 【道具】聊天记录截图 △ 刚把陈屿的手机放回原处，宿舍门就被推开了，周妍哼着歌走了进来，手里还抱着几本书。 周妍（看到林夏，瞬间收起轻松的表情，露出一副怯生生的模样）：小夏，你回啦？今天陈屿哥哥是不是还在生气呀？要不要我去帮解释一下？ △ 林夏死死盯着周妍那张伪善的面孔，胸口剧烈起伏。她拼命压制住当场扇周妍一巴掌的冲动，缓缓转过头，声音冷得像冰块。 林夏（冷淡地）：不用了，我的事，以后不用你操心。 △ 周妍一愣，显然没想到一向对自己百依百顺、温柔体贴的林夏会用这种态度和自己说话。她脸上的委屈表情滞了滞，眼中闪过一丝慌乱。 周妍（咬了咬嘴唇，小心翼翼地凑过来）：小夏，你是不是在怪我今天在林荫道多嘴了？我真的只是想帮你们…… △ 林夏没有理会她，径直站起身，收拾起自己的洗漱用品，甚至连一个多余的眼神都没给周妍，转头走出了宿舍，重重地关上了门。 △ 宿舍内，周妍看着那扇紧闭的门，脸上柔弱无辜的神情在瞬间荡然无存。取而代之的是一抹阴狠与不甘的冷笑。她死死攥着衣角，低声冷哼了一声，似乎在脑海中酝酿着什么更加恶毒的计划。
