                    - textbox "输入剧集内容" [disabled] [ref=f4e264]: 【场景】日，学校食堂。 下课后的食堂熙熙攘攘，端着餐盘的学生们穿梭其间。许然和林夏坐在靠窗的位置，桌上的饭菜基本没动。 △ 许然忧心地看着林夏，林夏则盯着手机，屏幕上显示的正是她昨晚拍下的周妍与陈屿的聊天记录截图。 许然：林夏，你打算怎么办？陈屿那边你解释清楚了吗？ 林夏（深吸一口气，收起手机）：陈屿算什么？他信不信已经不重要了。重要的是周妍，我把她当最好的朋友，她却在背后这么捅我刀子。我不会就这么算了。 【场景】夜，女生宿舍。 林夏刚推开宿舍门，就敏锐地察觉到气氛不对。隔壁宿舍的几个女生正站在门口，探头探脑地往里看，一见到林夏出现，立刻缩回了头，交头接耳地窃窃私语。 △ 林夏面无表情地走进宿舍，只见周妍正坐在自己的床铺上，低着头，肩膀一耸一耸地抽泣。舍友们围在她身边安慰她，看向林夏的眼神里充满了嫌恶与谴责。 舍友A（义愤填膺地）：林夏，你平时看着挺大方的，没想到私底下心思这么毒！周妍平时那么弱，你怎么下得去手排挤她？ 林夏（冷笑一声，放下书包）：我排挤她？我倒想听听，我又怎么欺负她了？ 周妍（抬起哭得红肿的眼睛，怯生生地拉住舍友的衣角，声音颤抖）：大家……大家别说了，都是我的错。是我不该总麻烦小夏，我不该笨手笨脚惹她不高兴……小夏，你别生气了，我以后再也不敢乱说话了，求你别让大家孤立我…… △ 周妍这副楚楚可怜、委曲求全的模样，瞬间激起了围观同学的“正义感”。 舍友B：周妍你别怕她！她不就是仗着自己家境好，平时把人当免费劳动力使唤吗？居然还抢别人的奖学金名额，太不要脸了！ △ 林夏看着演得入戏的周妍，简直要为她的演技鼓掌。突然，林夏的手机疯狂地震动起来，微信提示音此起彼伏。 【道具】宿舍群聊界面 △ 林夏点开手机，只见百人年级专业大群里，周妍发了一大段长小作文，字里行间全是“控诉”林夏长期对其精神霸凌、指使她搬水拿快递、并威胁不准她向辅导员告状的伪造事实。群里此时已经炸开了锅，不明真相的同学们纷纷开始对林夏指名道姓地敲键盘进行言语声讨。 林夏（握着手机的手微微发紧，但眼神却异常冷静）：周妍，小作文写得不错。既然你这么会编，那敢不敢当着大家的面，把这些事一桩桩一件件对质清楚？ 周妍（眼神深处闪过一丝慌乱，但很快被更加汹涌的眼泪掩盖，咬着嘴唇）：对质就对质……小夏，如果你觉得当众羞辱我能让你开心，那我明天就在教学楼等你……呜呜…… △ 宿舍群里，周妍立刻又发了一条消息：“大家明天上午课后，来一号教学楼走廊帮我评评理，我真的走投无路了，希望大家能给我一个公道。” △ 林夏看着手机屏幕上周妍发出的那条得意洋洋、自以为胜券在握的群消息，嘴角缓缓勾起一抹冰冷而讽刺的弧度。她伸手轻轻抚摸着手机相册里保存的那张聊天记录截图，眼神里毫无惧色，只有猎人收网前的绝对冷酷。 林夏（冷笑，低声自语）：周妍，既然你想把事情闹大，那明天，我就成全你。
