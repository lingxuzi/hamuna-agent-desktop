[project]
name = "agnes-video-25-mcp"
version = "0.1.5"
description = "MCP server wrapping Agnes Video 2.5 / 2.5 Flash with reference-mode support (mode=text|keyframe|reference, images/audio/video references)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "HamunaAgent Desktop", email = "noreply@hamuna.app" },
]
keywords = ["mcp", "agnes", "video", "image", "ai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0,<2",  # 2.x renames FastMCP → MCPServer; pin to keep v1 API.
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
agnes-video-25-mcp = "agnes_video_25.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnes_video_25"]
