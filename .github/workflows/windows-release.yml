name: Windows Release

# 手动触发：编译 Windows x64 版本 → 上传 Cloudflare R2 → 自动 bump 版本号并回写仓库。
# 不自动写 CHANGELOG（与本地 pre_release.ps1 的人工流程分开），发版后人工补。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号提升类型（bump 后会自动 commit + tag + push）'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 → R2
    runs-on: windows-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # R2 默认值；可用 secrets.R2_BUCKET 覆盖（真实 bucket 是 hamuna-agent）
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'hamuna-agent' }}
      DOWNLOAD_BASE_URL: ${{ secrets.DOWNLOAD_BASE_URL || 'https://download.hamuna.io' }}

    steps:
      # Windows runner 无开发者模式 → 无法创建 symlink（仓库根有 AGENTS.md -> CLAUDE.md），
      # 且默认关闭 longpaths（长路径报 "Filename too long"）。
      # 前置开启 longpaths；symlink 用 core.symlinks=false 检出为普通文件（内容为指向路径），
      # 对构建无影响（构建不需要 AGENTS.md 的 symlink 语义）。
      - name: Enable git longpaths (Windows)
        run: |
          git config --global core.longpaths true
          # 无开发者模式的 Windows 不能创建 symlink；core.symlinks=false 让 git 把
          # AGENTS.md（-> CLAUDE.md）当作普通文本文件检出（内容为链接目标字符串）。
          # 构建/测试都不需要 AGENTS.md 的 symlink 语义，检出为普通文件安全。
          git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Cache npm to skip the ~2m51s `npm ci` cold-run on subsequent releases.
          # Key is auto-derived from package-lock.json hash; cache misses once on
          # first run, hits on every release that doesn't touch package-lock.
          # Independent of the existing Swatinem/rust-cache step (separate store).
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # 1. Bump 版本号（package.json 单一数据源；version 钩子同步
      #    tauri.conf.json + Cargo.toml）。.npmrc 已设 git-tag-version=false，
      #    此步只改文件、不 commit/tag。
      # ============================================================
      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Bumped to $ver"

      # ============================================================
      # 2. 下载 gitignored 构建资源（复用仓库内无交互脚本）
      # ============================================================
      - name: Download Node.js runtime (bundled)
        shell: bash
        run: bash scripts/download_nodejs.sh --windows x64

      - name: Download cuse binary
        shell: pwsh
        run: |
          & ./scripts/download_cuse.ps1
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) { throw "download_cuse.ps1 failed" }

      - name: Download Python installer
        shell: pwsh
        run: |
          & ./scripts/download_python.ps1
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) { throw "download_python.ps1 failed" }

      - name: Download Git installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src-tauri/nsis -Force | Out-Null
          $url = "https://github.com/git-for-windows/git/releases/download/v2.52.0.windows.1/Git-2.52.0-64-bit.exe"
          Invoke-WebRequest -Uri $url -OutFile "src-tauri/nsis/Git-Installer.exe" -UseBasicParsing
          if (-not (Test-Path "src-tauri/nsis/Git-Installer.exe")) { throw "Git installer download failed" }

      - name: Stage VC++ Runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src-tauri/resources -Force | Out-Null
          # Join-Path + single-quoted path: PowerShell 7.4+ strict escape
          # validation rejects unknown backslash escapes inside double-quoted
          # strings (e.g. `\S`, `\v` in `\System32\`), so the path literal
          # must NOT live inside a double-quoted expandable string.
          Copy-Item (Join-Path $env:SystemRoot 'System32\vcruntime140.dll') "src-tauri/resources/" -Force
          Copy-Item (Join-Path $env:SystemRoot 'System32\vcruntime140_1.dll') "src-tauri/resources/" -Force

      # ============================================================
      # 3. 构建前端 / 后端产物
      # ============================================================
      - name: Build server / bridge / cli
        run: |
          npm run build:server
          npm run build:bridge
          npm run build:cli

      - name: Build tsx-runtime (win32-x64)
        run: npm run build:tsx-runtime -- win32 x64

      - name: Stage Claude SDK native binary
        shell: pwsh
        run: |
          & ./scripts/ensure_claude_sdk_package.ps1 -Arch x64
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) { throw "ensure_claude_sdk_package.ps1 failed" }
          $src = "node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/claude.exe"
          if (-not (Test-Path $src)) { throw "claude.exe not found: $src" }
          $dest = "src-tauri/resources/claude-agent-sdk"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item $src "$dest/claude.exe" -Force

      - name: Pre-install sharp (win32-x64)
        shell: pwsh
        run: |
          $sharpDir = "src-tauri/resources/sharp-runtime"
          if (Test-Path $sharpDir) { Remove-Item -Recurse -Force $sharpDir }
          New-Item -ItemType Directory -Path $sharpDir -Force | Out-Null
          Set-Content -Path "$sharpDir/package.json" -Value '{"name":"sharp-runtime","private":true,"version":"1.0.0","dependencies":{"sharp":"0.34.5"}}' -Encoding utf8
          Push-Location $sharpDir
          npm install --no-audit --no-fund --no-save --ignore-scripts
          npm install --no-save --force --no-audit --no-fund --ignore-scripts "@img/sharp-win32-x64@0.34.5"
          if ($LASTEXITCODE -ne 0) { throw "sharp install failed" }
          Pop-Location

      - name: Build frontend
        run: npm run build:web

      # Sync the pinned agnes-video-25-mcp version from its pyproject.toml
      # into the NSIS installer's `!define` placeholder (snapshot TODO #135).
      # Single source of truth = hosted_mcps/agnes-video-25/pyproject.toml::
      # version — the install-time wheel prefetch
      # (Section HostedMcpPrefetch + hosted-mcp-prefetch.ps1) must match the
      # pin in extended_buildin_mcp/mcp.json's `uvx --from` so the prefetched
      # wheel is exactly what MCP spawns later resolve to. Drift is gated by
      # the install-time smoke test (next step, assert 6/3).
      - name: Sync agnes-video-25-mcp pin to installer.nsi
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toml = Get-Content "hosted_mcps/agnes-video-25/pyproject.toml" -Raw
          $ver = ($toml | Select-String -Pattern '(?m)^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $ver) { throw "could not parse version from pyproject.toml" }
          Write-Host ">>> Pinned agnes-video-25-mcp version: $ver"
          $path = "src-tauri/nsis/installer.nsi"
          $content = Get-Content $path -Raw
          $updated = $content -replace '(?m)^!define\s+AGNES_VIDEO_25_MCP_VERSION\s+"[^"]*"', "!define AGNES_VIDEO_25_MCP_VERSION `"$ver`""
          if ($updated -eq $content) {
            throw "no !define AGNES_VIDEO_25_MCP_VERSION placeholder found in $path — placeholder syntax may have drifted; check installer.nsi header"
          }
          Set-Content -Path $path -Value $updated -NoNewline
          Write-Host ">>> Sed-injected AGNES_VIDEO_25_MCP_VERSION=$ver into installer.nsi"

      # ============================================================
      # 4. Tauri release build
      # ============================================================
      - name: Build Tauri app (NSIS)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 关键：GH runner 的 CI=1 会被 clap 当成 --ci 的值（只接受 true/false）→ 构建崩。必须移除。
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          npx tauri build --target x86_64-pc-windows-msvc --config src-tauri\tauri.windows.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $targetDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $nsisDir = "$targetDir/bundle/nsis"
          $exePath = "$targetDir/hamuna.exe"
          if (-not (Test-Path $exePath)) { Write-Host "hamuna.exe not found, skipping portable"; exit 0 }
          $portableDir = Join-Path $targetDir "portable"
          if (Test-Path $portableDir) { Remove-Item -Recurse -Force $portableDir }
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $exePath $portableDir -Force
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll")) {
            $dllSrc = Join-Path "src-tauri/resources" $dll
            if (Test-Path $dllSrc) { Copy-Item $dllSrc $portableDir -Force }
          }
          $resourcesSource = Join-Path $targetDir "resources"
          if (Test-Path $resourcesSource) { Copy-Item $resourcesSource $portableDir -Recurse -Force }
          $zipName = "HamunaAgent_${env:VERSION}_x86_64-portable.zip"
          $zipPath = Join-Path $nsisDir $zipName
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Created $zipName"

      # ============================================================
      # 4b. Install-time smoke test (gates the upload)
      #
      # Why: TODO #126 (commit a906d2b) and the rationale chain in 197837b /
      # 4812fbe / 37a7f21 / 9732280 all assume that the pip-only install path
      # in NSIS Section UvxFallback lands `uv==0.11.33` on a fresh Windows
      # machine — but until now nothing actually exercised that section in CI.
      # The build only produced the .exe; install-time regressions (a typo in
      # the pin, Tsinghua mirror blocking the runner IP, PEP 370 path probe
      # drift, or — most importantly — the unverified "0.12.x tightens
      # `uvx --from`" rationale) would only surface when a real user
      # double-clicked the installer. This step installs the freshly built
      # NSIS bundle to a scratch dir and asserts the full chain, so a broken
      # pipeline fails the release BEFORE anything is uploaded to R2.
      #
      # Scope: lives only in windows-release.yml (workflow_dispatch). test.yml
      # runs ubuntu-latest and never builds Windows, so duplicating there would
      # buy nothing; the ~5min install cost would also be wasted on every PR.
      # ============================================================
      - name: "Smoke-test install — verify UvxFallback lands uv==0.11.33 end-to-end"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nsisDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $nsisExe = Get-ChildItem -Path $nsisDir -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "portable" } | Select-Object -First 1
          if (-not $nsisExe) { throw "NSIS installer not found — build failed" }

          # single-quoted: PS 7.4+ strict escape rejects `\H` in a
          # double-quoted literal; no variable expansion needed here.
          $testDir = 'C:\HamunaAgent-Test'
          if (Test-Path $testDir) {
            $prevUninst = Join-Path $testDir "Uninstall.exe"
            if (Test-Path $prevUninst) { Start-Process -FilePath $prevUninst -ArgumentList "/S" -Wait | Out-Null }
            Remove-Item -Recurse -Force $testDir
          }

          # NSIS /S = silent, /D=<path> = install dir (must be absolute, no spaces).
          Write-Host ">>> Silent-install $($nsisExe.Name) → $testDir"
          $proc = Start-Process -FilePath $nsisExe.FullName -ArgumentList "/S","/D=$testDir" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "NSIS install failed (exit $($proc.ExitCode))" }

          # PythonInstall (NSIS §PythonInstall, 689-729): per-user 3.12.7 lands at
          # %LOCALAPPDATA%\Programs\Python\Python312\python.exe with PrependPath=1.
          # Join-Path + single-quoted path: the trailing `Programs\Python\...`
          # segment contains `\P` which PS 7.4+ strict escape rejects inside
          # double-quoted strings. Expand `$env:LOCALAPPDATA` as the parent
          # (outside any literal), then concatenate the literal segment via
          # Join-Path so backslashes stay literal.
          $python = Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\python.exe'
          if (-not (Test-Path $python)) { throw "Python not installed at $python — Section PythonInstall didn't run" }

          # UvxFallback (NSIS §UvxFallback, 750-798): pip-only path.
          # Assert 1/3: `uv` is installed and pinned to 0.11.33 (the value from
          # TODO #122 / #125 / #126; if this drifts the next --from test below
          # exercises the actual compatibility surface).
          $pipShow = & $python -m pip show uv 2>&1
          if ($LASTEXITCODE -ne 0) { throw "`pip show uv` failed: $pipShow" }
          $uvVersion = ($pipShow | Select-String -Pattern '^Version:\s*(.+)$').Matches[0].Groups[1].Value
          if ($uvVersion -ne "0.11.33") { throw "uv version pin failed: expected 0.11.33, got $uvVersion" }
          Write-Host ">>> pip-installed uv = $uvVersion"

          # Assert 2/3: uvx.exe landed in one of the two PEP 370 paths that
          # `findPipInstalledUvxScriptsDir` (src/server/utils/runtime.ts:276)
          # probes — if it lands elsewhere, sidecar resolution silently fails.
          $uvxPaths = @(
            (Join-Path $env:APPDATA 'Roaming\Python\Python312\Scripts\uvx.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\Scripts\uvx.exe')
          )
          $uvxExe = $uvxPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $uvxExe) { throw "uvx.exe not found in PEP 370 candidate paths: $($uvxPaths -join '; ')" }
          Write-Host ">>> uvx.exe at: $uvxExe"

          # Assert 3/3: HKCU\Environment\Path was registered by
          # uvx-path-setup.ps1 (paired with Section UvxFallback) so a fresh
          # shell can find uvx without the AppLayer env-wrangling the sidecar
          # also does. Missing → next-run user gets a different PATH than the
          # installer just produced, classic "works on first launch, broken
          # after restart" trap.
          $regPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name 'Path' -ErrorAction SilentlyContinue).Path
          if (-not $regPath -or $regPath -notlike '*Python312\Scripts*') {
            throw 'HKCU\Environment\Path not updated by uvx-path-setup.ps1 (got: ''' + $regPath + ''')'
          }
          Write-Host '>>> HKCU\Environment\Path contains Scripts dir'

          # Assert 4/3 (the one that actually validates the 0.12.x --from
          # rationale): invoke `uvx --from <pkg> <cmd>` exactly as
          # extended_buildin_mcp/mcp.json does for the multimedia-creator MCP.
          # If uv 0.12.x (without the 0.11.33 pin) ever reaches an end user,
          # THIS is the call that breaks. We stage AGNES_API_KEY to a dummy
          # value so server start prints `--help` cleanly without hitting the
          # real API — `uvx --from ... <cmd> --help` is the canonical smoke
          # for "uvx can resolve and bootstrap the wheel" without needing
          # credentials or network egress.
          $env:Path = (Split-Path $uvxExe -Parent) + ";" + $env:Path
          $env:UV_INDEX_URL = "https://pypi.org/simple"
          $env:AGNES_API_KEY = "smoke-test-dummy"
          $smokeOut = & uvx --from agnes-video-25-mcp==0.2.0 agnes-video-25-mcp --help 2>&1
          $smokeCode = $LASTEXITCODE
          if ($smokeCode -ne 0) {
            Write-Host "--- uvx --from smoke output ---"
            Write-Host $smokeOut
            throw '`uvx --from agnes-video-25-mcp==0.2.0 agnes-video-25-mcp --help` exited ' + $smokeCode + ' — pin 0.11.33 may no longer be sufficient, or the 0.12.x --from rationale was never real'
          }
          Write-Host ">>> uvx --from multimedia-creator MCP smoke OK"

          # Assert 5/3 (TODO #135 — hosted-mcp-prefetch.ps1 ran and cached
          # the wheel into per-user site-packages). If the install-time
          # prefetch regressed (mirror chain drift, soft-fail swallowed a
          # real install-time failure, version pin drifted from
          # pyproject.toml), `pip show agnes-video-25-mcp` will not see the
          # wheel, and the first user video request will fall through to
          # the live PyPI fetch — exactly the slow path we're trying to
          # avoid.
          $pipShowAgnes = & $python -m pip show agnes-video-25-mcp 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw '`pip show agnes-video-25-mcp` failed (exit ' + $LASTEXITCODE + '): ' + $pipShowAgnes + ' — install-time Section HostedMcpPrefetch did not cache the wheel'
          }
          $agnesVer = ($pipShowAgnes | Select-String -Pattern '^Version:\s*(.+)$').Matches[0].Groups[1].Value
          # Re-read pyproject.toml here so the smoke test stays correct if
          # the version drifts in a future release — no literal pin in
          # the workflow file.
          $expectedVer = (Get-Content "hosted_mcps/agnes-video-25/pyproject.toml" -Raw |
            Select-String -Pattern '(?m)^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($agnesVer -ne $expectedVer) {
            throw 'agnes-video-25-mcp version pin mismatch: expected ' + $expectedVer + ' (from pyproject.toml), got ' + $agnesVer + ' — sync step or installer.nsi Section HostedMcpPrefetch are misaligned'
          }
          Write-Host ">>> pip-installed agnes-video-25-mcp = $agnesVer"

          # Cleanup so a follow-up local run on this runner finds nothing
          # leaked. Use the bundled uninstaller; NSIS /S is silent.
          $uninst = Join-Path $testDir "Uninstall.exe"
          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList "/S" -Wait | Out-Null
            Write-Host ">>> Cleanup uninstall OK"
          }

      # ============================================================
      # 5. 上传到 Cloudflare R2（rclone；复用 publish_windows.ps1 模式）
      # ============================================================
      - name: Install rclone
        shell: pwsh
        run: |
          # Join-Path + single-quoted literal: PS 7.4+ strict escape rejects
          # `\r` in a double-quoted expandable string.
          $zip = Join-Path $env:TEMP 'rclone.zip'
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile $zip -UseBasicParsing
          $dir = Join-Path $env:TEMP 'rclone'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter "rclone.exe" | Select-Object -First 1
          if (-not $exe) { throw "rclone.exe not found" }
          New-Item -ItemType Directory -Path .ci -Force | Out-Null
          Copy-Item $exe.FullName ".ci/rclone.exe" -Force
          # 写入 rclone 配置：无 BOM（rclone 拒收 BOM），凭证走 env var 不落盘。
          # 不用 PowerShell here-string（结束符 "@ 必须顶格，与 YAML 块缩进冲突），改用逐行写。
          $cfg = ".ci/rclone.conf"
          $lines = @(
            '[r2]',
            'type = s3',
            'provider = Cloudflare',
            'env_auth = true',
            "endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com",
            'acl = private'
          )
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) $cfg), $lines, [System.Text.UTF8Encoding]::new($false))
          Write-Host "rclone ready"

      - name: Upload to R2
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = "Continue"
          $rclone = ".ci/rclone.exe"
          $cfg = ".ci/rclone.conf"
          $nsisDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $version = $env:VERSION
          $bucket = $env:R2_BUCKET
          $baseUrl = $env:DOWNLOAD_BASE_URL

          $nsisExe = Get-ChildItem -Path $nsisDir -Filter "*.exe" | Where-Object { $_.Name -notmatch "portable" } | Select-Object -First 1
          $portableZip = Get-ChildItem -Path $nsisDir -Filter "*portable*.zip" | Select-Object -First 1
          $updateZip = Get-ChildItem -Path $nsisDir -Filter "*.nsis.zip" | Select-Object -First 1
          $sigFile = Get-ChildItem -Path $nsisDir -Filter "*.nsis.zip.sig" | Select-Object -First 1

          if (-not $nsisExe) { throw "NSIS installer not found — build failed" }
          if (-not $updateZip) { throw "updater .nsis.zip not found" }

          & $rclone --config=$cfg copy $nsisExe.FullName "r2:$bucket/releases/v$version/" --s3-no-check-bucket
          if ($LASTEXITCODE -ne 0) { throw "upload NSIS failed" }

          if ($portableZip) {
            & $rclone --config=$cfg copy $portableZip.FullName "r2:$bucket/releases/v$version/" --s3-no-check-bucket
            if ($LASTEXITCODE -ne 0) { throw "upload portable failed" }
          }

          $updateUploadName = "HamunaAgent_${version}_x86_64.nsis.zip"
          & $rclone --config=$cfg copyto $updateZip.FullName "r2:$bucket/releases/v$version/$updateUploadName" --s3-no-check-bucket
          if ($LASTEXITCODE -ne 0) { throw "upload updater zip failed" }

          $signature = ""
          if ($sigFile) {
            & $rclone --config=$cfg copyto $sigFile.FullName "r2:$bucket/releases/v$version/$updateUploadName.sig" --s3-no-check-bucket
            if ($LASTEXITCODE -ne 0) { throw "upload sig failed" }
            $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          } else {
            Write-Host "WARNING: no .sig file — TAURI_SIGNING_PRIVATE_KEY likely unset, auto-update will fail"
          }

          # ---- 生成更新清单（无 BOM UTF-8）----
          $manifestDir = Join-Path $env:TEMP "hamuna-manifest"
          if (Test-Path $manifestDir) { Remove-Item -Recurse -Force $manifestDir }
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          $manifest = [ordered]@{
            version   = $version
            notes     = "HamunaAgent v$version"
            pub_date  = $pubDate
            signature = $signature
            url       = "$baseUrl/releases/v$version/$updateUploadName"
            downloads = @{
              installer = "$baseUrl/releases/v$version/$($nsisExe.Name)"
            }
          }
          if ($portableZip) {
            $manifest.downloads["portable"] = "$baseUrl/releases/v$version/$($portableZip.Name)"
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("$manifestDir/windows-x86_64.json", $manifestJson, [System.Text.UTF8Encoding]::new($false))

          $latestWin = [ordered]@{
            version       = $version
            pub_date      = $pubDate
            release_notes = "HamunaAgent v$version"
            downloads     = @{
              win_x64 = @{
                name = "Windows x64"
                url  = "$baseUrl/releases/v$version/$($nsisExe.Name)"
              }
            }
          }
          $latestWinJson = $latestWin | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("$manifestDir/latest_win.json", $latestWinJson, [System.Text.UTF8Encoding]::new($false))

          & $rclone --config=$cfg copy "$manifestDir/" "r2:$bucket/update/" --s3-no-check-bucket
          if ($LASTEXITCODE -ne 0) { throw "upload manifests failed" }

          Write-Host "R2 upload complete: v$version"
          Write-Host "  updater: $baseUrl/update/windows-x86_64.json"
          Write-Host "  website: $baseUrl/update/latest_win.json"

      # ============================================================
      # 6. 回写仓库：commit + tag + push（workflow_dispatch 不会循环触发）
      # ============================================================
      - name: Commit and push version bump
        shell: bash
        run: |
          set -euxo pipefail
          echo "Pushing v$VERSION tag + version-bump commit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          # 若构建意外改了其他文件（如 bundled dist），一并纳入避免污染
          git status --short
          if git diff --cached --quiet; then
            echo "No version changes to commit — version bump may have already been committed"
          else
            git commit -m "v${VERSION}" -m "chore(release): bump to v${VERSION} via windows-release workflow"
            git tag "v${VERSION}"
            git push origin HEAD --tags
          fi
