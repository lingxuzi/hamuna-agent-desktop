.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

 --red: #f05050;\n  --red-bg: rgb(240 80 80 / 0.15);\n\n  --dot: rgb(228 220 212 / 0.05);\n  --inset-hi: rgb(255 255 255 / 0.05);\n  --card-shadow: 0 6px 18px -14px rgb(0 0 0 / 0.55);\n\n  --deep: #443e36;\n  --deep-2: #564e44;\n  --deep-text: #e4dcd4;\n\n  --wash-strong: oklch(45% 0.05 52 / 0.42);\n\n  --bar-muted: rgb(228 220 212 / 0.20);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font: 400 14px/1.5 var(--sans);\n  color: var(--ink);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ============ 面板外壳 ============ */\n.shell {\n  width: 600px;\n  height: 780px;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  background: var(--bg);\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(78% 0.04 45 / 0.3) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n  background-size: 100% 100%, 18px 18px;\n  position: relative;\n}\nhtml[data-scheme='dark'] .shell {\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(30% 0.03 45 / 0.25) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n}\n.shell > * { position: relative; }\n\n/* ============ 顶部条（面板 tab 条） ============\n   抄 app 右栏真实结构（src/renderer/pages/Chat.tsx）：\n   h-9 + border-b --line + bg paper-elevated；激活项 = 深墨字 + 2px 陶土下划线。 */\n.tabbar {\n  flex: 0 0 auto;\n  height: 36px;\n  display: flex;\n  align-items: center;\n  gap: 2px;\n  padding: 0 8px;\n  background: var(--panel);\n  border-bottom: 1px solid var(--line);\n}\n.tabbtn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  height: 26px;\n  padding: 0 10px;\n  border: 0;\n  background: none;\n  border-radius: 10px;\n  font: 500 14px/1 var(--sans);\n  color: var(--mute);\n  cursor: default;\n  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);\n}\n.tabbtn:hover { color: var(--ink); }\n.tabbtn[aria-selected='true'] { color: var(--ink); }\n.tabbtn[aria-selected='true']::after {\n  content: '';\n  position: absolute;\n  left: 4px; right: 4px; bottom: -5px;\n  height: 2px;\n  border-radius: 999px;\n  background: var(--accent);\n}\n.tabbtn .x {\n  width: 20px; height: 20px;\n  display: inline-flex; align-items: center; justify-content: center;\n  border-radius: 6px;\n  font: 400 14px/1 var(--sans);\n  color: var(--mute);\n  opacity: 0;\n  transition: opacity var(--dur) var(--ease);\n}\n.tabbtn:hover .x { opacity: 1; }\n.tabbtn:hover .x:hover { background: var(--faint); }\n.tabbar .sp { flex: 1; }\n.tabbar .mono-note { font: 700 12px/1 var(--mono); letter-spacing: .08em; color: var(--mute); }\n\n/* ============ 通用：卡片 / 标题 / 徽标 ============ */\n.card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  box-shadow: inset 0 1px 0 var(--inset-hi), var(--card-shadow);\n  padding: 14px 16px;\n}\n.card.tight { padding: 10px 12px; }\n\n.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.ph h2 { font: 700 16px/1.2 var(--mono); letter-spacing: .06em; color: var(--ink); }\n.ph .r { font: 700 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); text-align: right; }\n.phs { font: 400 12px/1.5 var(--mono); letter-spacing: .04em; color: var(--mute); margin-top: 5px; }\n\n.tag {\n  font: 700 12px/1 var(--mono);\n  letter-spacing: .06em;\n  padding: 4px 8px;\n  border-radius: 999px;\n  white-space: nowrap;\n  color: var(--accent-text);\n  background: var(--accent-soft);\n}\n.tag.gray { color: var(--mute); background: var(--faint); }\n.tag.green { color: var(--green); background: var(--green-bg); }\n.tag.amber { color: var(--amber); background: var(--amber-bg); }\n.tag.red { color: var(--red); background: var(--red-bg); }\n.tag.data { color: var(--data); background: var(--data-soft); }\n.tag.solid { color: var(--on-primary); background: var(--ink); }\n.tag.outline { color: var(--accent-text); background: none; box-shadow: inset 0 0 0 1px var(--accent-text); }\n\n.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: none; display: inline-block; }\n\n/* ============ 控件 ============ */\n.btn {\n  display: inline-flex; align-items: center; gap: 6px;\n  font: 700 12px/1 var(--mono); letter-spacing: .06em;\n  color: var(--ink);\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 11px;\n  cursor: default;\n  white-space: nowrap;\n  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);\n}\n.btn:hover { border-color: var(--accent-text); color: var(--accent-text); }\n.btn:active { transform: scale(.97); }\n.btn.pri { background: var(--primary-bg); color: var(--on-primary); border-color: var(--primary-bg); }\n.btn.pri:hover { background: var(--primary-bg-hover); border-color: var(--primary-bg-hover); color: var(--on-primary); }\n.btn.mini { font-size: 12px; padding: 5px 9px; border-radius: 6px; }\n.btn.data { color: var(--data); background: var(--data-soft); border-color: var(--data-soft); }\n\n.seg { display: inline-flex; }\n.seg .btn { border-radius: 0; margin-left: -1px; }\n.seg .btn:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }\n.seg .btn:last-child { border-radius: 0 10px 10px 0; }\n.seg .btn.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-text); font-weight: 700; }\n\n/* ============ 数据行 / 键值 / 表格 ============ */\n.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }\n.kv > div { min-width: 0; }\n.kv label { display: block; font: 400 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); }\n.kv b { display: block; font: 700 20px/1.2 var(--sans); margin-top: 3px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }\n.kv b small { font: 400 ); font: 400 12px/1.4 var(--mono); letter-spacing: .05em; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--line); }\n.pf b { color: var(--accent-text); font-weight: 700; }\n\n/* ============ 状态条（Agent 在做什么） ============ */\n.stageline {\n  display: flex; align-items: center; gap: 9px;\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 10px;\n  font: 400 12px/1.3 var(--mono); letter-spacing: .03em;\n  color: var(--ink-2);\n}\n.stageline .dot { width: 7px; height: 7px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: ops-pulse 1.8s var(--ease) infinite; }\n.stageline b { color: var(--accent-text); letter-spacing: .06em; }\n.stageline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n@keyframes ops-pulse {\n  0% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0.5); }\n  70% { box-shadow: 0 0 0 7px rgb(194 109 58 / 0); }\n  100% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0); }\n}\n\n/* ============ 骨架 ============ */\n.body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }\n.scroll { flex: 1; min-height: 0; overflow: auto; }\n.pad { padding: 14px 16px; }\n.stack { display: grid; gap: 12px; }\n\n/* ============ 动效 ============ */\n@keyframes ops-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n.rise { animation: ops-rise var(--dur) var(--ease) both; }\n.rise-1 { animation-delay: 40ms; } .rise-2 { animation-delay: 80ms; }\n.rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 160ms; }\n\n/* 折线自绘：480ms，不用弹跳 */\n.spark path { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 340; stroke-dashoffset: 340; animation: ops-draw 480ms var(--ease) forwards; }\n.spark .fill { fill: rgb(194 109 58 / 0.10); stroke: none; opacity: 0; animation: ops-fade 300ms var(--ease) 260ms forwards; }\n@keyframes ops-draw { to { stroke-dashoffset: 0; } }\n@keyframes ops-fade { to { opacity: 1; } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .01ms !important;\n    /* delay 必须一起归零：递进靠 delay 做，只归零 duration 的话\n       reduced 下卡片仍会按 delay 逐个闪出来。 */\n    animation-delay: 0s !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .01ms !important;\n    transition-delay: 0s !important;\n  }\n}\n\u003c/style>\n\u003cstyle>\n  .preview { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }\n  .crumb { font: 400 12px/1 var(--mono); letter-spacing: .05em; color: var(--mute); display: flex; gap: 6px; align-items: center; }\n  .doc { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;\n         font: 400 14px/1.75 var(--mono); color: var(--ink); white-space: pre; }\n  .doc b { color: var(--accent-text); font-weight: 700; }\n  .doc i { color: var(--mute); font-style: normal; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n  \u003cdiv class=\"tabbar\">\n    \u003cbutton class=\"tabbtn\" aria-selected=\"true\">文件\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">终端\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">浏览器\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"body\">\n    \u003cdiv class=\"preview\" style=\"flex:1; min-height:0; display:flex; flex-direction:column;\">\n      \u003cdiv class=\"crumb\">workspace / ops / state.json\u003c/div>\n      \u003cdiv class=\"doc\">{\n  \u003cb>\"version\"\u003c/b>: 1,\n  \u003cb>\"topics\"\u003c/b>: [\n    { \"id\": \"t_8f21\", \"title\": \"老房子的夏季除味\",\n      \"platform\": \"xiaohongshu\",\n      \"status\": \"planned\" }\n  ],\n  \u003cb>\"assets\"\u003c/b>: [\n    { \"id\": \"a_4c07\", \"topicId\": \"t_8f21\",\n      \"title\": \"三种除味方案对比\",\n      \"scheduledAt\": \"2026-11-15T19:30:00+08:00\" }\n  ],\n  \u003cb>\"reviews\"\u003c/b>: [],\n  \u003cb>\"rules\"\u003c/b>: []\n}\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "z0-baseline.html", "baseline": true, "interactive": false}, {"id": "a-loop", "name": "方向 A · 回流环", "concept": "环就是导航：四域按生产顺序排在环上，左上那段虚线是复盘回到选题的「回流」。点环上节点或右侧图例换域。", "typography": "app 等宽字体做微标签与环心编号 + app 正文字体做大计数（28px）", "palette": ["#faf6ee", "#b05e2d", "#2e6f5e", "#6f6156"], "traits": ["环即导航", "回流边是主角", "每屏都带全局四域态", "段序 = 生产顺序"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\" />\n\u003ctitle>方向 A · 回流环 — 运营视图\u003c/title>\n\u003cstyle>/* 运营视图小样 · 共用底座\n *\n * 语法来源：/home/hmcz/Fin/SETS/dist/style.css\n *   点阵底 / 白卡片 / 发丝线 / 等宽微标签 / 大数字 / 连体分段控件 / 环图\n *   —— 这层是**结构语法**，跨主题成立，照搬。\n * 配色来源：app 当前主题 hamuna-default（src/renderer/theme/themes/hamuna-default.css）\n *   —— SETS 的冷蓝是它自己的主题选择，不是语法。落到 app 里一律走 token。\n *   两个色相分工：**陶土 = 交互 / 状态**，**冷青 = 数据 / 回流**。\n *   冷暖对位是这份配色唯一的\"炫\"点；全暖会闷，全青会冷，都不是 app 的样子。\n *\n * 适配 app 约束（docs/DESIGN-LANGUAGE.md）：\n *   字阶只用 12/14/16/18/20/22/28 —— SETS 的 8.5px 微标签上调到 12px\n *   圆角只用 6 / 10 / 14 / 9999（app 的 radius 档位）\n *   过渡 ≤200ms、cubic-bezier(.16,1,.3,1)、不用弹跳、只动 transform/opacity\n *   必须支持 prefers-reduced-motion\n */\n\n:root {\n  /* 纸面层 —— app --paper / --paper-elevated / --paper-inset */\n  --bg: #faf6ee;\n  --panel: #fffcf7;\n  --faint: #f2e9de;\n  --ink: #1c1612;\n  --ink-2: #2e2825;\n  --mute: #6f6156;\n  --line: rgb(28 22 18 / 0.10);\n  --line-2: rgb(28 22 18 / 0.06);\n\n  /* 主色 —— app --accent-warm（陶土） */\n  --accent: #c26d3a;          /* 图形 / 描边 / 填充 */\n  --accent-text: #9c5027;      /* 当小字用时加深（对 --accent-soft 4.8:1，过 AA） */\n  --accent-soft: #f6e8dc;\n  --wash: rgb(194 109 58 / 0.07);\n  --primary-bg: #b05e2d;       /* app --button-primary-bg */\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  /* 数据 / 回流色 —— app --accent-cool（深青） */\n  --data: #2e6f5e;\n  --data-soft: #e6ebe5;\n\n  /* 语义色 —— app --success / --warning / --error */\n  --green: #236d4a;\n  --green-bg: #e2f0e8;\n  --amber: #944f00;\n  --amber-bg: #fef3c7;\n  --red: #bd1e1e;\n  --red-bg: #fee2e2;\n\n  --dot: rgb(28 22 18 / 0.055);\n  --inset-hi: rgb(255 255 255 / 0.60);\n  --card-shadow: 0 6px 18px -14px rgb(28 22 18 / 0.28);\n\n  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', 'Microsoft YaHei UI', 'Hiragino Sans GB', monospace;\n  --sans: 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;\n  --serif: 'Playfair Display', 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'Times New Roman', serif;\n\n  /* 深墨主角卡 —— app --button-dark-bg / -hover / -text */\n  --deep: #1c1612;\n  --deep-2: #3a3532;\n  --deep-text: #ffffff;\n\n  /* 右上暖光晕（Hero 弥散）*/\n  --wash-strong: oklch(80% 0.05 52 / 0.50);\n\n  /* 条形对照组（同一张图里的基线）：弱一档，仍可读 */\n  --bar-muted: rgb(28 22 18 / 0.16);\n\n  --dur: 200ms;\n  --ease: cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n/* 深色 —— app 的 dark 方案同一套 token 换值 */\nhtml[data-scheme='dark'] {\n  --bg: #1a1614;\n  --panel: #242018;\n  --faint: #12100e;\n  --ink: #e4dcd4;\n  --ink-2: #cfc5ba;\n  --mute: #968a7e;\n  --line: rgb(228 220 212 / 0.10);\n  --line-2: rgb(228 220 212 / 0.06);\n\n  --accent: #d4803f;\n  --accent-text: #e89860;\n  --accent-soft: #473320;\n  --wash: rgb(212 128 63 / 0.10);\n  --primary-bg: #b05e2d;\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  --data: #4aad8a;          /* app --accent-cool 的深色值，不另造色 *//\n  --data-soft: #2b392d;\n\n  --green: #4aad7a;\n  --green-bg: rgb(74 173 122 / 0.15);\n  --amber: #f59e0b;\n  --amber-bg: rgb(245 158 11 / 0.15);\n  --red: #f05050;\n  --red-bg: rgb(240 80 80 / 0.15);\n\n  --dot: rgb(228 220 212 / 0.05);\n  --inset-hi: rgb(255 255 255 / 0.05);\n  --card-shadow: 0 6px 18px -14px rgb(0 0 0 / 0.55);\n\n  --deep: #443e36;\n  --deep-2: #564e44;\n  --deep-text: #e4dcd4;\n\n  --wash-strong: oklch(45% 0.05 52 / 0.42);\n\n  --bar-muted: rgb(228 220 212 / 0.20);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font: 400 14px/1.5 var(--sans);\n  color: var(--ink);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ============ 面板外壳 ============ */\n.shell {\n  width: 600px;\n  height: 780px;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  background: var(--bg);\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(78% 0.04 45 / 0.3) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n  background-size: 100% 100%, 18px 18px;\n  position: relative;\n}\nhtml[data-scheme='dark'] .shell {\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(30% 0.03 45 / 0.25) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n}\n.shell > * { position: relative; }\n\n/* ============ 顶部条（面板 tab 条） ============\n   抄 app 右栏真实结构（src/renderer/pages/Chat.tsx）：\n   h-9 + border-b --line + bg paper-elevated；激活项 = 深墨字 + 2px 陶土下划线。 */\n.tabbar {\n  flex: 0 0 auto;\n  height: 36px;\n  display: flex;\n  align-items: center;\n  gap: 2px;\n  padding: 0 8px;\n  background: var(--panel);\n  border-bottom: 1px solid var(--line);\n}\n.tabbtn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  height: 26px;\n  padding: 0 10px;\n  border: 0;\n  background: none;\n  border-radius: 10px;\n  font: 500 14px/1 var(--sans);\n  color: var(--mute);\n  cursor: default;\n  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);\n}\n.tabbtn:hover { color: var(--ink); }\n.tabbtn[aria-selected='true'] { color: var(--ink); }\n.tabbtn[aria-selected='true']::after {\n  content: '';\n  position: absolute;\n  left: 4px; right: 4px; bottom: -5px;\n  height: 2px;\n  border-radius: 999px;\n  background: var(--accent);\n}\n.tabbtn .x {\n  width: 20px; height: 20px;\n  display: inline-flex; align-items: center; justify-content: center;\n  border-radius: 6px;\n  font: 400 14px/1 var(--sans);\n  color: var(--mute);\n  opacity: 0;\n  transition: opacity var(--dur) var(--ease);\n}\n.tabbtn:hover .x { opacity: 1; }\n.tabbtn:hover .x:hover { background: var(--faint); }\n.tabbar .sp { flex: 1; }\n.tabbar .mono-note { font: 700 12px/1 var(--mono); letter-spacing: .08em; color: var(--mute); }\n\n/* ============ 通用：卡片 / 标题 / 徽标 ============ */\n.card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  box-shadow: inset 0 1px 0 var(--inset-hi), var(--card-shadow);\n  padding: 14px 16px;\n}\n.card.tight { padding: 10px 12px; }\n\n.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.ph h2 { font: 700 16px/1.2 var(--mono); letter-spacing: .06em; color: var(--ink); }\n.ph .r { font: 700 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); text-align: right; }\n.phs { font: 400 12px/1.5 var(--mono); letter-spacing: .04em; color: var(--mute); margin-top: 5px; }\n\n.tag {\n  font: 700 12px/1 var(--mono);\n  letter-spacing: .06em;\n  padding: 4px 8px;\n  border-radius: 999px;\n  white-space: nowrap;\n  color: var(--accent-text);\n  background: var(--accent-soft);\n}\n.tag.gray { color: var(--mute); background: var(--faint); }\n.tag.green { color: var(--green); background: var(--green-bg); }\n.tag.amber { color: var(--amber); background: var(--amber-bg); }\n.tag.red { color: var(--red); background: var(--red-bg); }\n.tag.data { color: var(--data); background: var(--data-soft); }\n.tag.solid { color: var(--on-primary); background: var(--ink); }\n.tag.outline { color: var(--accent-text); background: none; box-shadow: inset 0 0 0 1px var(--accent-text); }\n\n.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: none; display: inline-block; }\n\n/* ============ 控件 ============ */\n.btn {\n  display: inline-flex; align-items: center; gap: 6px;\n  font: 700 12px/1 var(--mono); letter-spacing: .06em;\n  color: var(--ink);\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 11px;\n  cursor: default;\n  white-space: nowrap;\n  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);\n}\n.btn:hover { border-color: var(--accent-text); color: var(--accent-text); }\n.btn:active { transform: scale(.97); }\n.btn.pri { background: var(--primary-bg); color: var(--on-primary); border-color: var(--primary-bg); }\n.btn.pri:hover { background: var(--primary-bg-hover); border-color: var(--primary-bg-hover); color: var(--on-primary); }\n.btn.mini { font-size: 12px; padding: 5px 9px; border-radius: 6px; }\n.btn.data { color: var(--data); background: var(--data-soft); border-color: var(--data-soft); }\n\n.seg { display: inline-flex; }\n.seg .btn { border-radius: 0; margin-left: -1px; }\n.seg .btn:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }\n.seg .btn:last-child { border-radius: 0 10px 10px 0; }\n.seg .btn.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-text); font-weight: 700; }\n\n/* ============ 数据行 / 键值 / 表格 ============ */\n.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }\n.kv > div { min-width: 0; }\n.kv label { display: block; font: 400 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); }\n.kv b { display: block; font: 700 20px/1.2 var(--sans); margin-top: 3px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }\n.kv b small { font: 400 12px/1 var(--sans); color: var(--mute); margin-left: 3px; letter-spacing: 0; }\n.kv b.acc { color: var(--accent-text); }\n\n.rows { display: grid; gap: 0; }\n.row {\n  display: grid;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 8px;\n  border-top: 1px solid var(--line-2);\n  transition: background var(--dur) var(--ease);\n}\n.row:first-child { border-top: 0; }\n.row:hover { background: var(--faint); }\n.row .ttl { font-size: 14px; line-height: 1.45; color: var(--ink); }\n.row .ttl small { display: block; font: 400 12px/1.5 var(--mono); letter-spacing: .02em; color: var(--mute); margin-top: 3px; }\n.row .r { text-align: right; font: 700 12px/1.3 var(--mono); letter-spacing: .04em; color: var(--mute); }\n.row .num { font: 700 16px/1.2 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }\n\n.gtable { width: 100%; border-collapse: collapse; }\n.gtable th {\n  font: 400 12px/1.2 var(--mono); letter-spacing: .08em; color: var(--mute);\n  text-align: left; padding: 0 8px 8px; font-weight: 400;\n}\n.gtable td { padding: 9px 8px; border-top: 1px solid var(--line-2); font-size: 14px; }\n.gtable th.num, .gtable td.num { text-align: right; font-variant-numeric: tabular-nums; }\n.gtable td.pk { font-weight: 700; color: var(--ink); }\n.gtable .mut { color: var(--mute); }\n.gtable tr.hot td { background: var(--accent-soft); }\n\n/* 段落量条（SETS .segs） */\n.segs { display: flex; gap: 2px; height: 9px; }\n.segs i { flex: 1; background: rgb(28 22 18 / 0.10); border-radius: 1.5px; }\n.segs i.on { background: var(--accent); }\n\n/* 漏斗条 */\n.bar { height: 8px; background: var(--faint); border-radius: 4px; position: relative; overflow: hidden; }\n.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }\n.bar i.c { background: linear-gradient(90deg, var(--ink), var(--accent)); }\n.bar i.p { background: rgb(28 22 18 / 0.12); }\n\n/* 底部说明行 */\n.pf { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; color: var(--mute); font: 400 12px/1.4 var(--mono); letter-spacing: .05em; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--line); }\n.pf b { color: var(--accent-text); font-weight: 700; }\n\n/* ============ 状态条（Agent 在做什么） ============ */\n.stageline {\n  display: flex; align-items: center; gap: 9px;\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 10px;\n  font: 400 12px/1.3 var(--mono); letter-spacing: .03em;\n  color: var(--ink-2);\n}\n.stageline .dot { width: 7px; height: 7px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: ops-pulse 1.8s var(--ease) infinite; }\n.stageline b { color: var(--accent-text); letter-spacing: .06em; }\n.stageline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n@keyframes ops-pulse {\n  0% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0.5); }\n  70% { box-shadow: 0 0 0 7px rgb(194 109 58 / 0); }\n  100% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0); }\n}\n\n/* ============ 骨架 ============ */\n.body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }\n.scroll { flex: 1; min-height: 0; overflow: auto; }\n.pad { padding: 14px 16px; }\n.stack { display: grid; gap: 12px; }\n\n/* ============ 动效 ============ */\n@keyframes ops-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n.rise { animation: ops-rise var(--dur) var(--ease) both; }\n.rise-1 { animation-delay: 40ms; } .rise-2 { animation-delay: 80ms; }\n.rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 160ms; }\n\n/* 折线自绘：480ms，不用弹跳 */\n.spark path { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 340; stroke-dashoffset: 340; animation: ops-draw 480ms var(--ease) forwards; }\n.spark .fill { fill: rgb(194 109 58 / 0.10); stroke: none; opacity: 0; animation: ops-fade 300ms var(--ease) 260ms forwards; }\n@keyframes ops-draw { to { stroke-dashoffset: 0; } }\n@keyframes ops-fade { to { opacity: 1; } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .01ms !important;\n    /* delay 必须一起归零：递进靠 delay 做，只归零 duration 的话\n       reduced 下卡片仍会按 delay 逐个闪出来。 */\n    animation-delay: 0s !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .01ms !important;\n    transition-delay: 0s !important;\n  }\n}\n\u003c/style>\n\u003cstyle>\n  .head { flex: 0 0 auto; display: flex; gap: 14px; padding: 12px 16px 10px; }\n  .ringcard { flex: none; width: 204px; padding: 10px; }\n  .ringcard svg { display: block; width: 184px; height: 184px; }\n  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }\n  .side .ttl { font: 700 22px/1.2 var(--sans); letter-spacing: -.01em; color: var(--ink); }\n  .side .ttl em { font: 700 12px/1 var(--mono); letter-spacing: .08em; color: var(--accent-text); font-style: normal; margin-right: 8px; }\n  .side .desc { font-size: 14px; line-height: 1.55; color: var(--mute); }\n  .side .acts { display: flex; gap: 8px; }\n  .legend { border-top: 1px solid var(--line); padding-top: 9px; display: grid; gap: 1px; }\n  .lrow { display: grid; grid-template-columns: 26px 1fr auto 62px; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }\n  .lrow.on { background: var(--accent-soft); }\n  .lrow .n { fon ht: 0; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n  \u003cdiv class=\"tabbar\">\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">文件\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">终端\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">浏览器\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"true\">运营\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cspan class=\"sp\">\u003c/span>\n    \u003cspan class=\"mono-note\">独占视图\u003c/span>\n  \u003c/div>\n\n  \u003c!-- ============ 01 选题 ============ -->\n  \u003csection class=\"view\" data-v=\"topics\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"card ringcard\" data-ring=\"0\">\u003c/div>\n      \u003cdiv class=\"side\">\n        \u003cdiv class=\"ttl\">\u003cem>01\u003c/em>选题\u003c/div>\n        \u003cdiv class=\"desc\">本周新增 3 条，其中 1 条由复盘规则反哺。Agent 正在把「老房子的夏季除味」做成小红书图文。\u003c/div>\n        \u003cdiv class=\"acts\">\u003cbutton class=\"btn pri\">新建选题\u003c/button>\u003cbutton class=\"btn\">让 Agent 找热点\u003c/button>\u003c/div>\n        \u003cdiv class=\"legend\" data-legend=\"0\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"body\">\n      \u003cdiv class=\"scroll\">\n        \u003cdiv class=\"list\">\n          \u003cdiv class=\"tcard busy rise rise-1\">\n            \u003ch3>老房子的夏季除味：三步走，不用香氛\u003c/h3>\n            \u003cdiv class=\"meta\">\u003cspan class=\"tag\">小红书\u003c/span>\u003cspan class=\"tag amber\">热点\u003c/span>\u003cspan class=\"tag outline\">制作中\u003c/span>\u003c/div>\n            \u003cdiv class=\"sub\">评论区反复提到「梅雨味」，切入无人提过的老房墙皮返潮\u003c/div>\n            \u003cdiv class=\"foot\">\u003cspan class=\"k\">完成度 \u003cb>62%\u003c/b>\u003c/span>\u003cspan class=\"segs\">\u003ci class=\"on\">\u003c/i>\u003ci class=\"on\">\u003c/i>\u003ci class=\"on\">\u003c/i>\u003ci \n  \u003c/section>\n\n  \u003c!-- ============ 04 复盘 ============ -->\n  \u003csection class=\"view\" data-v=\"reviews\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"card ringcard\" data-ring=\"3\">\u003c/div>\n      \u003cdiv class=\"side\">\n        \u003cdiv class=\"ttl\">\u003cem>04\u003c/em>复盘\u003c/div>\n        \u003cdiv class=\"desc\">近 30 天复盘 12 条，沉淀 2 条规则并反哺 5 条选题。规则是唯一会回到选题的东西。\u003c/div>\n        \u003cdiv class=\"acts\">\u003cbutton class=\"btn pri\">沉淀新规则\u003c/button>\u003cbutton class=\"btn\">拉取平台数据\u003c/button>\u003c/div>\n        \u003cdiv class=\"legend\" data-legend=\"3\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"body\">\n      \u003cdiv class=\"scroll\">\n        \u003cdiv class=\"list\">\n          \u003cdiv class=\"card rise rise-1\" style=\"padding:0; overflow:hidden;\">\n            \u003cdiv class=\"rows\">\n              \u003cdiv class=\"row\" style=\"grid-template-columns: 1fr auto 108px; padding:9px 14px;\">\n                \u003cspan class=\"ttl\">早八人的早餐\u003csmall>抖音 · 11 月 8 日\u003c/small>\u003c/span>\n                \u003cspan class=\"num\">12,847\u003csmall style=\"font:400 12px/1 var(--mono); color:var(--mute); margin-left:4px;\">播放\u003c/small>\u003c/span>\n                \u003csvg class=\"spark\" viewBox=\"0 0 108 30\" aria-label=\"近七日播放走势\">\n                  \u003cpath class=\"fill\" d=\"M0 26 L0 22 L14 18 L28 23 L42 14 L56 17 L70 8 L84 11 L96 5 L108 8 L108 30 L0 30 Z\"/>\n                  \u003cpath d=\"M0 22 L14 18 L28 23 L42 14 L56 17 L70 8 L84 11 L96 5 L108 8\"/>\n                \u003c/svg>\n              \u003c/div>\n              \u003cdiv class=\"row\" style=\"grid-template-columns: 1fr auto; padding:9px 14px;\">\n                \u003cspan class=\"ttl\">出租屋灯光改造\u003csmall>小红书 · 11 月 6 日\u003c/small>\u003c/span>\n                \u003cspan class=\"num\">8,412\u003csmall style=\"font:400 12px/1 var(--mono); color:var(--mute); margin-left:4px;\">播放\u003c/small>\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"row\" style=\"grid-template-columns: 1fr auto; padding:9px 14px;\">\n                \u003cspan class=\"ttl\">早睡挑战 2.0\u003csmall>小红书 · 11 月 2 日\u003c/small>\u003c/span>\n                \u003cspan class=\"num\">6,930\u003csmall style=\"font:400 12px/1 var(--mono); color:var(--mute); margin-left:4px;\">播放\u003c/small>\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"rule rise rise-2\">\n            \u003ch3>开头三秒先给结果，别铺垫\u003c/h3>\n            \u003cdiv class=\"rb\">铺垫式开头的 4 条笔记，平均完播比结果式开头低 41%。\u003c/div>\n            \u003cdiv class=\"back\">\u003cspan class=\"dot\" style=\"color:var(--data)\">\u003c/span>已反哺 \u003cb>2 条选题\u003c/b> · 置信度 0.72\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"rule rise rise-3\">\n            \u003ch3>清单型封面点击高 1.8 倍\u003c/h3>\n            \u003cdiv class=\"rb\">封面写清「3 件 / 6 个」这类数字的笔记，点击率是泛用封面的 1.8 倍。\u003c/div>\n            \u003cdiv class=\"back\">\u003cspan class=\"dot\" style=\"color:var(--data)\">\u003c/span>已反哺 \u003cb>3 条选题\u003c/b> · 置信度 0.68\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel);\">\n        \u003cdiv class=\"stageline\">\u003cspan class=\"dot\">\u003c/span>\u003cb>AGENT\u003c/b>\u003cspan>正在分析「早八人的早餐」评论区 · 预计 1 分钟\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cscript>\nconst DOMAINS = [\n  { id: 'topics',   no: '01', name: '选题', cnt: 7,  fill: 5 },\n  { id: 'assets',   no: '02', name: '素材', cnt: 4,  fill: 4 },\n  { id: 'schedule', no: '03', name: '排期', cnt: 4,  fill: 3 },\n  { id: 'reviews',  no: '04', name: '复盘', cnt: 12, fill: 7 },\n];\n\nconst RING = (a) => `\n\u003csvg viewBox=\"0 0 200 200\" aria-label=\"运营四域回流环\">\n  \u003cdefs>\u003cradialGradient id=\"halo${a}\">\u003cstop offset=\"0\" stop-color=\"#c26d3a\" stop-opacity=\".16\"/>\u003cstop offset=\"1\" stop-color=\"#c26d3a\" stop-opacity=\"0\"/>\u003c/radialGradient>\u003c/defs>\n  \u003ccircle cx=\"100\" cy=\"100\" r=\"92\" fill=\"url(#halo${a})\"/>\n  \u003ccircle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgb(28 22 18 / .18)\" stroke-width=\"1.5\" stroke-dasharray=\"2 6\"/>\n  \u003cpath d=\"M 34 100 A 66 66 0 0 1 100 34\" fill=\"none\" stroke=\"#2e6f5e\" stroke-width=\"2\" stroke-dasharray=\"3 4\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 88 34 L 81 30 L 81 38 Z\" fill=\"#2e6f5e\"/>\n  \u003cpath id=\"orbit${a}\" d=\"M 100 34 A 66 66 0 1 1 99.9 34\" fill=\"none\"/>\n  \u003ccircle r=\"4\" fill=\"#c26d3a\">\u003canimateMotion dur=\"16s\" repeatCount=\"indefinite\" rotate=\"auto\">\u003cmpath href=\"#orbit${a}\"/>\u003c/animateMotion>\u003c/circle>\n  ${[0,1,2,3].map(i => {\n    const p = [[100,34],[166,100],[100,166],[34,100]][i];\n    const on = i === a;\n    return `${on ? `\u003ccircle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"21\" fill=\"none\" stroke=\"#c26d3a\" stroke-width=\"2\" opacity=\".5\"/>` : ''}\n      \u003ccircle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"13\" fill=\"${on ? '#b05e2d' : '#4a423a'}\"/>\n      \u003ctext x=\"${p[0]}\" y=\"${p[1]}\" text-anchor=\"middle\" dy=\"4\" font-family=\"ui-monospace, 'SF Mono', Consolas, monospace\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">0${i+1}\u003c/text>`;\n  }).join('')}\n  \u003ctext x=\"100\" y=\"99\" text-anchor=\"middle\" font-family=\"'SF Pro Display', -apple-system, 'PingFang SC', sans-serif\" font-size=\"28\" font-weight=\"700\" fill=\"#1c1612\">${DOMAINS[a].cnt}\u003c/text>\n  \u003ctext x=\"100\" y=\"117\" text-anchor=\"middle\" font-family=\"ui-monospace, 'SF Mono', Consolas, monospace\" font-size=\"12\" letter-spacing=\"1.5\" fill=\"#6f6156\">${DOMAINS[a].name}\u003c/text>\n\u003c/svg>`;\n\nconst LEGEND = (a) => DOMAINS.map((d, i) => `\n  \u003cdiv class=\"lrow${i === a ? ' on' : ''}\" data-goto=\"${d.id}\">\n    \u003cspan class=\"n\">${d.no}\u003c/span>\u003cspan class=\"nm\">${d.name}\u003c/span>\u003cspan class=\"c\">${d.cnt}\u003c/span>\n    \u003cspan class=\"segs\">${Array.from({length:8}, (_, k) => `\u003ci class=\"${k \u003c d.fill ? 'on' : ''}\">\u003c/i>`).join('')}\u003c/span>\n  \u003c/div>`).join('');\n\ndocument.querySelectorAll('[data-ring]').forEach(el => { el.innerHTML = RING(+el.dataset.ring); });\ndocument.querySelectorAll('[data-legend]').forEach(el => { el.innerHTML = LEGEND(+el.dataset.legend); });\n\nfunction show(id) {\n  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.dataset.v === id));\n  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);\n}\ndocument.addEventListener('click', e => {\n  const g = e.target.closest('[data-goto]');\n  if (g) show(g.dataset.goto);\n});\nconst q = new URLSearchParams(location.search).get('view');\nshow(q || location.hash.slice(1) || 'topics');\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "a.html", "baseline": false, "interactive": true}, {"id": "b-calendar", "name": "方向 B · 月历主线", "concept": "时间轴是骨架，四域是同一条月历上的不同标记：排期用平台章、选题用点、素材用点、复盘用播放柱。下方列表按当前域换分组。", "typography": "app 等宽字体做日期与微标签 + app 正文字体做标题", "palette": ["#faf6ee", "#b05e2d", "#2e6f5e", "#236d4a"], "traits": ["月历恒在", "域只换标记与列表", "日历格高度一致", "柱高 = 播放量"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\" />\n\u003ctitle>方向 B · 月历主线 — 运营视图\u003c/title>\n\u003cstyle>/* 运营视图小样 · 共用底座\n *\n * 语法来源：/home/hmcz/Fin/SETS/dist/style.css\n *   点阵底 / 白卡片 / 发丝线 / 等宽微标签 / 大数字 / 连体分段控件 / 环图\n *   —— 这层是**结构语法**，跨主题成立，照搬。\n * 配色来源：app 当前主题 hamuna-default（src/renderer/theme/themes/hamuna-default.css）\n *   —— SETS 的冷蓝是它自己的主题选择，不是语法。落到 app 里一律走 token。\n *   两个色相分工：**陶土 = 交互 / 状态**，**冷青 = 数据 / 回流**。\n *   冷暖对位是这份配色唯一的\"炫\"点；全暖会闷，全青会冷，都不是 app 的样子。\n *\n * 适配 app 约束（docs/DESIGN-LANGUAGE.md）：\n *   字阶只用 12/14/16/18/20/22/28 —— SETS 的 8.5px 微标签上调到 12px\n *   圆角只用 6 / 10 / 14 / 9999（app 的 radius 档位）\n *   过渡 ≤200ms、cubic-bezier(.16,1,.3,1)、不用弹跳、只动 transform/opacity\n *   必须支持 prefers-reduced-motion\n */\n\n:root {\n  /* 纸面层 —— app --paper / --paper-elevated / --paper-inset */\n  --bg: #faf6ee;\n  --panel: #fffcf7;\n  --faint: #f2e9de;\n  --ink: #1c1612;\n  --ink-2: #2e2825;\n  --mute: #6f6156;\n  --line: rgb(28 22 18 / 0.10);\n  --line-2: rgb(28 22 18 / 0.06);\n\n  /* 主色 —— app --accent-warm（陶土） */\n  --accent: #c26d3a;          /* 图形 / 描边 / 填充 */\n  --accent-text: #9c5027;      /* 当小字用时加深（对 --accent-soft 4.8:1，过 AA） */\n  --accent-soft: #f6e8dc;\n  --wash: rgb(194 109 58 / 0.07);\n  --primary-bg: #b05e2d;       /* app --button-primary-bg */\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  /* 数据 / 回流色 —— app --accent-cool（深青） */\n  --data: #2e6f5e;\n  --data-soft: #e6ebe5;\n\n  /* 语义色 —— app --success / --warning / --error */\n  --green: #236d4a;\n  --green-bg: #e2f0e8;\n  --amber: #944f00;\n  --amber-bg: #fef3c7;\n  --red: #bd1e1e;\n  --red-bg: #fee2e2;\n\n  --dot: rgb(28 22 18 / 0.055);\n  --inset-hi: rgb(255 255 255 / 0.60);\n  --card-shadow: 0 6px 18px -14px rgb(28 22 18 / 0.28);\n\n  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', 'Microsoft YaHei UI', 'Hiragino Sans GB', monospace;\n  --sans: 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;\n  --serif: 'Playfair Display', 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'Times New Roman', serif;\n\n  /* 深墨主角卡 —— app --button-dark-bg / -hover / -text */\n  --deep: #1c1612;\n  --deep-2: #3a3532;\n  --deep-text: #ffffff;\n\n  /* 右上暖光晕（Hero 弥散）*/\n  --wash-strong: oklch(80% 0.05 52 / 0.50);\n\n  /* 条形对照组（同一张图里的基线）：弱一档，仍可读 */\n  --bar-muted: rgb(28 22 18 / 0.16);\n\n  --dur: 200ms;\n  --ease: cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n/* 深色 —— app 的 dark 方案同一套 token 换值 */\nhtml[data-scheme='dark'] {\n  --bg: #1a1614;\n  --panel: #242018;\n  --faint: #12100e;\n  --ink: #e4dcd4;\n  --ink-2: #cfc5ba;\n  --mute: #968a7e;\n  --line: rgb(228 220 212 / 0.10);\n  --line-2: rgb(228 220 212 / 0.06);\n\n  --accent: #d4803f;\n  --accent-text: #e89860;\n  --accent-soft: #473320;\n  --wash: rgb(212 128 63 / 0.10);\n  --primary-bg: #b05e2d;\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  --data: #4aad8a;          /* app --accent-cool 的深色值，不另造色 *//\n  --data-soft: #2b392d;\n\n  --green: #4aad7a;\n  --green-bg: rgb(74 173 122 / 0.15);\n  --amber: #f59e0b;\n  --amber-bg: rgb(245 158 11 / 0.15);\n  --red: #f05050;\n  --red-bg: rgb(240 80 80 / 0.15);\n\n  --dot: rgb(228 220 212 / 0.05);\n  --inset-hi: rgb(255 255 255 / 0.05);\n  --card-shadow: 0 6px 18px -14px rgb(0 0 0 / 0.55);\n\n  --deep: #443e36;\n  --deep-2: #564e44;\n  --deep-text: #e4dcd4;\n\n  --wash-strong: oklch(45% 0.05 52 / 0.42);\n\n  --bar-muted: rgb(228 220 212 / 0.20);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font: 400 14px/1.5 var(--sans);\n  color: var(--ink);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ============ 面板外壳 ============ */\n.shell {\n  width: 600px;\n  height: 780px;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  background: var(--bg);\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(78% 0.04 45 / 0.3) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n  background-size: 100% 100%, 18px 18px;\n  position: relative;\n}\nhtml[data-scheme='dark'] .shell {\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(30% 0.03 45 / 0.25) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n}\n.shell > * { position: relative; }\n\n/* ============ 顶部条（面板 tab 条） ============\n   抄 app 右栏真实结构（src/renderer/pages/Chat.tsx）：\n   h-9 + border-b --line + bg paper-elevated；激活项 = 深墨字 + 2px 陶土下划线。 */\n.tabbar {\n  flex: 0 0 auto;\n  height: 36px;\n  display: flex;\n  align-items: center;\n  gap: 2px;\n  padding: 0 8px;\n  background: var(--panel);\n  border-bottom: 1px solid var(--line);\n}\n.tabbtn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  height: 26px;\n  padding: 0 10px;\n  border: 0;\n  background: none;\n  border-radius: 10px;\n  font: 500 14px/1 var(--sans);\n  color: var(--mute);\n  cursor: default;\n  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);\n}\n.tabbtn:hover { color: var(--ink); }\n.tabbtn[aria-selected='true'] { color: var(--ink); }\n.tabbtn[aria-selected='true']::after {\n  content: '';\n  position: absolute;\n  left: 4px; right: 4px; bottom: -5px;\n  height: 2px;\n  border-radius: 999px;\n  background: var(--accent);\n}\n.tabbtn .x {\n  width: 20px; height: 20px;\n  display: inline-flex; align-items: center; justify-content: center;\n  border-radius: 6px;\n  font: 400 14px/1 var(--sans);\n  color: var(--mute);\n  opacity: 0;\n  transition: opacity var(--dur) var(--ease);\n}\n.tabbtn:hover .x { opacity: 1; }\n.tabbtn:hover .x:hover { background: var(--faint); }\n.tabbar .sp { flex: 1; }\n.tabbar .mono-note { font: 700 12px/1 var(--mono); letter-spacing: .08em; color: var(--mute); }\n\n/* ============ 通用：卡片 / 标题 / 徽标 ============ */\n.card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  box-shadow: inset 0 1px 0 var(--inset-hi), var(--card-shadow);\n  padding: 14px 16px;\n}\n.card.tight { padding: 10px 12px; }\n\n.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.ph h2 { font: 700 16px/1.2 var(--mono); letter-spacing: .06em; color: var(--ink); }\n.ph .r { font: 700 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); text-align: right; }\n.phs { font: 400 12px/1.5 var(--mono); letter-spacing: .04em; color: var(--mute); margin-top: 5px; }\n\n.tag {\n  font: 700 12px/1 var(--mono);\n  letter-spacing: .06em;\n  padding: 4px 8px;\n  border-radius: 999px;\n  white-space: nowrap;\n  color: var(--accent-text);\n  background: var(--accent-soft);\n}\n.tag.gray { color: var(--mute); background: var(--faint); }\n.tag.green { color: var(--green); background: var(--green-bg); }\n.tag.amber { color: var(--amber); background: var(--amber-bg); }\n.tag.red { color: var(--red); background: var(--red-bg); }\n.tag.data { color: var(--data); background: var(--data-soft); }\n.tag.solid { color: var(--on-primary); background: var(--ink); }\n.tag.outline { color: var(--accent-text); background: none; box-shadow: inset 0 0 0 1px var(--accent-text); }\n\n.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: none; display: inline-block; }\n\n/* ============ 控件 ============ */\n.btn {\n  display: inline-flex; align-items: center; gap: 6px;\n  font: 700 12px/1 var(--mono); letter-spacing: .06em;\n  color: var(--ink);\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 11px;\n  cursor: default;\n  white-space: nowrap;\n  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);\n}\n.btn:hover { border-color: var(--accent-text); color: var(--accent-text); }\n.btn:active { transform: scale(.97); }\n.btn.pri { background: var(--primary-bg); color: var(--on-primary); border-color: var(--primary-bg); }\n.btn.pri:hover { background: var(--primary-bg-hover); border-color: var(--primary-bg-hover); color: var(--on-primary); }\n.btn.mini { font-size: 12px; padding: 5px 9px; border-radius: 6px; }\n.btn.data { color: var(--data); background: var(--data-soft); border-color: var(--data-soft); }\n\n.seg { display: inline-flex; }\n.seg .btn { border-radius: 0; margin-left: -1px; }\n.seg .btn:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }\n.seg .btn:last-child { border-radius: 0 10px 10px 0; }\n.seg .btn.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-text); font-weight: 700; }\n\n/* ============ 数据行 / 键值 / 表格 ============ */\n.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }\n.kv > div { min-width: 0; }\n.kv label { display: block; font: 400 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); }\n.kv b { display: block; font: 700 20px/1.2 var(--sans); margin-top: 3px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }\n.kv b small { font: 400 12px/1 var(--sans); color: var(--mute); margin-left: 3px; letter-spacing: 0; }\n.kv b.acc { color: var(--accent-text); }\n\n.rows { display: grid; gap: 0; }\n.row {\n  display: grid;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 8px;\n  border-top: 1px solid var(--line-2);\n  transition: background var(--dur) var(--ease);\n}\n.row:first-child { border-top: 0; }\n.row:hover { background: var(--faint); }\n.row .ttl { font-size: 14px; line-height: 1.45; color: var(--ink); }\n.row .ttl small { display: block; font: 400 12px/1.5 var(--mono); letter-spacing: .02em; color: var(--mute); margin-top: 3px; }\n.row .r { text-align: right; font: 700 12px/1.3 var(--mono); letter-spacing: .04em; color: var(--mute); }\n.row .num { font: 700 16px/1.2 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }\n\n.gtable { width: 100%; border-collapse: collapse; }\n.gtable th {\n  font: 400 12px/1.2 var(--mono); letter-spacing: .08em; color: var(--mute);\n  text-align: left; padding: 0 8px 8px; font-weight: 400;\n}\n.gtable td { padding: 9px 8px; border-top: 1px solid var(--line-2); font-size: 14px; }\n.gtable th.num, .gtable td.num { text-align: right; font-variant-numeric: tabular-nums; }\n.gtable td.pk { font-weight: 700; color: var(--ink); }\n.gtable .mut { color: var(--mute); }\n.gtable tr.hot td { background: var(--accent-soft); }\n\n/* 段落量条（SETS .segs） */\n.segs { display: flex; gap: 2px; height: 9px; }\n.segs i { flex: 1; background: rgb(28 22 18 / 0.10); border-radius: 1.5px; }\n.segs i.on { background: var(--accent); }\n\n/* 漏斗条 */\n.bar { height: 8px; background: var(--faint); border-radius: 4px; position: relative; overflow: hidden; }\n.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }\n.bar i.c { background: linear-gradient(90deg, var(--ink), var(--accent)); }\n.bar i.p { background: rgb(28 22 18 / 0.12); }\n\n/* 底部说明行 */\n.pf { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; color: var(--mute); font: 400 12px/1.4 var(--mono); letter-spacing: .05em; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--line); }\n.pf b { color: var(--accent-text); font-weight: 700; }\n\n/* ============ 状态条（Agent 在做什么） ============ */\n.stageline {\n  display: flex; align-items: center; gap: 9px;\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 10px;\n  font: 400 12px/1.3 var(--mono); letter-spacing: .03em;\n  color: var(--ink-2);\n}\n.stageline .dot { width: 7px; height: 7px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: ops-pulse 1.8s var(--ease) infinite; }\n.stageline b { color: var(--accent-text); letter-spacing: .06em; }\n.stageline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n@keyframes ops-pulse {\n  0% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0.5); }\n  70% { box-shadow: 0 0 0 7px rgb(194 109 58 / 0); }\n  100% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0); }\n}\n\n/* ============ 骨架 ============ */\n.body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }\n.scroll { flex: 1; min-height: 0; overflow: auto; }\n.pad { padding: 14px 16px; }\n.stack { display: grid; gap: 12px; }\n\n/* ============ 动效 ============ */\n@keyframes ops-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n.rise { animation: ops-rise var(--dur) var(--ease) both; }\n.rise-1 { animation-delay: 40ms; } .rise-2 { animation-delay: 80ms; }\n.rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 160ms; }\n\n/* 折线自绘：480ms，不用弹跳 */\n.spark path { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 340; stroke-dashoffset: 340; animation: ops-draw 480ms var(--ease) forwards; }\n.spark .fill { fill: rgb(194 109 58 / 0.10); stroke: none; opacity: 0; animation: ops-fade 300ms var(--ease) 260ms forwards; }\n@keyframes ops-draw { to { stroke-dashoffset: 0; } }\n@keyframes ops-fade { to { opacity: 1; } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .01ms !important;\n    /* delay 必须一起归零：递进靠 delay 做，只归零 duration 的话\n       reduced 下卡片仍会按 delay 逐个闪出来。 */\n    animation-delay: 0s !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .01ms !important;\n    transition-delay: 0s !important;\n  }\n}\n\u003c/style>\n\u003cstyle>\n  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }\n  .bar .nav { display: flex; align-items: center; gap: 6px; }\n  .bar .nav .m { font: 700 20px/1 var(--sans); letter-spacing: -.02em; color: var(--ink); }\n  .bar .nav .m small { font: 400 12px/1 var(--mono); letter-spacing: .06em; color: var(--mute); margin-left: 6px; }\n  .bar .sp { flex: 1; }\n  .bar .cnt { font: 400 12px/1 var(--mono); letter-spacing: .05em; color: var(--mute); }\n  .bar .cnt b { color: var(--accent-text); }\n\n  .calwrap { flex: 0 0 auto; padding: 12px 16px 0; }\n  .cal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: inset 0 1px 0 var(--inset-hi), var(--card-shadow); }\n  .calhead { display: grid; grid-template-columns: repeat(7, 1fr); }\n  .calhead span { font: 400 12px/1 var(--mono); letter-spacing: .08em; color: var(--mute); text-align: center; padding: 9px 0 7px; }\n  .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 40px; background: var(--line); gap: 1px; }\n  .cell { background: var(--panel); padding: 4px 5px; display: flex; flex-direction: column; gap: 3px; justify-content: flex-start; overflow: hidden; }\n  .cell.out { background: var(--faint); }\n  .cell .d { font: 400 12px/1.3 var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; }\n  .cell.today .d { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 999px; background: var(--primary-bg); color: #fff; font-weight: 700; }\n  .marks { display: flex; flex-wrap: wrap; gap: 3px; }\n  .stamp { font: 700 12px/1 var(--mono); letter-spacing: .04em; padding: 3px 6px; border-radius: 999px; color: var(--accent-text); background: var(--accent-soft); white-space: nowrap; }\n  .stamp.sky { color: var(--data); background: var(--data-soft); }\n  .stamp.green { color: var(--green); background: var(--green-bg); }\n  .mk { width: 7px; height: 7px; border-radius: 999px; background: var(--accent); }\n  .mk.sky { background: var(--data); }\n  .mk.gray { background: rgb(28 22 18 / 0.18); }\n  .mbar { display: block; width: 100%; height: 6px; border-radius: 999px; background: var(--accent-soft); margin-top: auto; }\n  .mbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ink), var(--accent)); }\n\n  .list { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 16px; }\n  .lt { display: flex; align-items: baseline; justify-content: space-between; padding: 0 0 8px; }\n  .lt h2 { font: 700 14px/1.2 var(--mono); letter-spacing: .06em; color: var(--ink); }\n  .lt .r { font: 400 12px/1 var(--mono); letter-spacing: .05em; color: var(--mute); }\n  .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: inset 0 1px 0 var(--inset-hi), var(--card-shadow); }\n  .row { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line-2); }\n  .row:first-child { border-top: 0; }\n  .row .when { font: 700 14px/1.3 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }\n  .row .when small { display: block; font: 400 12px/1.3 var(--mono); color: var(--mute); }\n  .row .ttl { font-size: 14px; color: var(--ink); line-height: 1.45; min-width: 0; }\n  .row .ttl small { display: block; font: 400 12px/1.5 var(--mono); letter-spacing: .02em; color: var(--mute); margin-top: 2px; }\n  .row .r { display: flex; align-items: center; gap: 6px; flex: none; }\n  .foot { flex: 0 0 auto; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }\n  .view { display: none; }\n  .view.on { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n  \u003cdiv class=\"tabbar\">\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">文件\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">终端\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton cla
