}\n  \u003c/div>\n\u003c/div>`;\n\ndocument.querySelectorAll('[data-cal]').forEach(el => { el.innerHTML = CAL(el.closest('.view').dataset.v); });\ndocument.querySelectorAll('[data-seg]').forEach(el => { el.innerHTML = SEG(el.closest('.view').dataset.v); });\n\nfunction show(id) {\n  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.dataset.v === id));\n  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);\n}\ndocument.addEventListener('click', e => {\n  const g = e.target.closest('[data-goto]');\n  if (g) show(g.dataset.goto);\n});\nconst q = new URLSearchParams(location.search).get('view');\nshow(q || location.hash.slice(1) || 'schedule');\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "b.html", "baseline": false, "interactive": true}, {"id": "c-ledger", "name": "方向 C · 台账（已归档）", "concept": "一张跨域总表，域只是筛选器。编号贯穿全表，规则行用深青渐变底 + 左侧轨标成「回流来源」。密度最高，一屏看全 19 条记录。**结构已被 D 取代**，保留作对照。", "typography": "app 等宽字体做编号与指标 + app 正文字体做标题与统计数字", "palette": ["#faf6ee", "#b05e2d", "#2e6f5e", "#9c5027"], "traits": ["总表 + 筛选", "跨域编号", "规则行标记回流", "顶部四指标常驻", "状态列只给三种状态上色"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\" />\n\u003ctitle>方向 C · 台账 — 运营视图\u003c/title>\n\u003cstyle>/* 运营视图小样 · 共用底座\n *\n * 语法来源：/home/hmcz/Fin/SETS/dist/style.css\n *   点阵底 / 白卡片 / 发丝线 / 等宽微标签 / 大数字 / 连体分段控件 / 环图\n *   —— 这层是**结构语法**，跨主题成立，照搬。\n * 配色来源：app 当前主题 hamuna-default（src/renderer/theme/themes/hamuna-default.css）\n *   —— SETS 的冷蓝是它自己的主题选择，不是语法。落到 app 里一律走 token。\n *   两个色相分工：**陶土 = 交互 / 状态**，**冷青 = 数据 / 回流**。\n *   冷暖对位是这份配色唯一的\"炫\"点；全暖会闷，全青会冷，都不是 app 的样子。\n *\n * 适配 app 约束（docs/DESIGN-LANGUAGE.md）：\n *   字阶只用 12/14/16/18/20/22/28 —— SETS 的 8.5px 微标签上调到 12px\n *   圆角只用 6 / 10 / 14 / 9999（app 的 radius 档位）\n *   过渡 ≤200ms、cubic-bezier(.16,1,.3,1)、不用弹跳、只动 transform/opacity\n *   必须支持 prefers-reduced-motion\n */\n\n:root {\n  /* 纸面层 —— app --paper / --paper-elevated / --paper-inset */\n  --bg: #faf6ee;\n  --panel: #fffcf7;\n  --faint: #f2e9de;\n  --ink: #1c1612;\n  --ink-2: #2e2825;\n  --mute: #6f6156;\n  --line: rgb(28 22 18 / 0.10);\n  --line-2: rgb(28 22 18 / 0.06);\n\n  /* 主色 —— app --accent-warm（陶土） */\n  --accent: #c26d3a;          /* 图形 / 描边 / 填充 */\n  --accent-text: #9c5027;      /* 当小字用时加深（对 --accent-soft 4.8:1，过 AA） */\n  --accent-soft: #f6e8dc;\n  --wash: rgb(194 109 58 / 0.07);\n  --primary-bg: #b05e2d;       /* app --button-primary-bg */\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  /* 数据 / 回流色 —— app --accent-cool（深青） */\n  --data: #2e6f5e;\n  --data-soft: #e6ebe5;\n\n  /* 语义色 —— app --success / --warning / --error */\n  --green: #236d4a;\n  --green-bg: #e2f0e8;\n  --amber: #944f00;\n  --amber-bg: #fef3c7;\n  --red: #bd1e1e;\n  --red-bg: #fee2e2;\n\n  --dot: rgb(28 22 18 / 0.055);\n  --inset-hi: rgb(255 255 255 / 0.60);\n  --card-shadow: 0 6px 18px -14px rgb(28 22 18 / 0.28);\n\n  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', 'Microsoft YaHei UI', 'Hiragino Sans GB', monospace;\n  --sans: 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;\n  --serif: 'Playfair Display', 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'Times New Roman', serif;\n\n  /* 深墨主角卡 —— app --button-dark-bg / -hover / -text */\n  --deep: #1c1612;\n  --deep-2: #3a3532;\n  --deep-text: #ffffff;\n\n  /* 右上暖光晕（Hero 弥散）*/\n  --wash-strong: oklch(80% 0.05 52 / 0.50);\n\n  /* 条形对照组（同一张图里的基线）：弱一档，仍可读 */\n  --bar-muted: rgb(28 22 18 / 0.16);\n\n  --dur: 200ms;\n  --ease: cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n/* 深色 —— app 的 dark 方案同一套 token 换值 */\nhtml[data-scheme='dark'] {\n  --bg: #1a1614;\n  --panel: #242018;\n  --faint: #12100e;\n  --ink: #e4dcd4;\n  --ink-2: #cfc5ba;\n  --mute: #968a7e;\n  --line: rgb(228 220 212 / 0.10);\n  --line-2: rgb(228 220 212 / 0.06);\n\n  --accent: #d4803f;\n  --accent-text: #e89860;\n  --accent-soft: #473320;\n  --wash: rgb(212 128 63 / 0.10);\n  --primary-bg: #b05e2d;\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  --data: #4aad8a;          /* app --accent-cool 的深色值，不另造色 *//\n  --data-soft: #2b392d;\n\n  --green: #4aad7a;\n  --green-bg: rgb(74 173 122 / 0.15);\n  --amber: #f59e0b;\n  --amber-bg: rgb(245 158 11 / 0.15);\n  --red: #f05050;\n  --red-bg: rgb(240 80 80 / 0.15);\n\n  --dot: rgb(228 220 212 / 0.05);\n  --inset-hi: rgb(255 255 255 / 0.05);\n  --card-shadow: 0 6px 18px -14px rgb(0 0 0 / 0.55);\n\n  --deep: #443e36;\n  --deep-2: #564e44;\n  --deep-text: #e4dcd4;\n\n  --wash-strong: oklch(45% 0.05 52 / 0.42);\n\n  --bar-muted: rgb(228 220 212 / 0.20);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font: 400 14px/1.5 var(--sans);\n  color: var(--ink);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ============ 面板外壳 ============ */\n.shell {\n  width: 600px;\n  height: 780px;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  background: var(--bg);\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(78% 0.04 45 / 0.3) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n  background-size: 100% 100%, 18px 18px;\n  position: relative;\n}\nhtml[data-scheme='dark'] .shell {\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(30% 0.03 45 / 0.25) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n}\n.shell > * { position: relative; }\n\n/* ============ 顶部条（面板 tab 条） ============\n   抄 app 右栏真实结构（src/renderer/pages/Chat.tsx）：\n   h-9 + border-b --line + bg paper-elevated；激活项 = 深墨字 + 2px 陶土下划线。 */\n.tabbar {\n  flex: 0 0 auto;\n  height: 36px;\n  display: flex;\n  align-items: center;\n  gap: 2px;\n  padding: 0 8px;\n  background: var(--panel);\n  border-bottom: 1px solid var(--line);\n}\n.tabbtn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  height: 26px;\n  padding: 0 10px;\n  border: 0;\n  background: none;\n  border-radius: 10px;\n  font: 500 14px/1 var(--sans);\n  color: var(--mute);\n  cursor: default;\n  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);\n}\n.tabbtn:hover { color: var(--ink); }\n.tabbtn[aria-selected='true'] { color: var(--ink); }\n.tabbtn[aria-selected='true']::after {\n  content: '';\n  position: absolute;\n  left: 4px; right: 4px; bottom: -5px;\n  height: 2px;\n  border-radius: 999px;\n  background: var(--accent);\n}\n.tabbtn .x {\n  width: 20px; height: 20px;\n  display: inline-flex; align-items: center; justify-content: center;\n  border-radius: 6px;\n  font: 400 14px/1 var(--sans);\n  color: var(--mute);\n  opacity: 0;\n  transition: opacity var(--dur) var(--ease);\n}\n.tabbtn:hover .x { opacity: 1; }\n.tabbtn:hover .x:hover { background: var(--faint); }\n.tabbar .sp { flex: 1; }\n.tabbar .mono-note { font: 700 12px/1 var(--mono); letter-spacing: .08em; color: var(--mute); }\n\n/* ============ 通用：卡片 / 标题 / 徽标 ============ */\n.card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  box-shadow: inset 0 1px 0 var(--inset-hi), var(--card-shadow);\n  padding: 14px 16px;\n}\n.card.tight { padding: 10px 12px; }\n\n.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.ph h2 { font: 700 16px/1.2 var(--mono); letter-spacing: .06em; color: var(--ink); }\n.ph .r { font: 700 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); text-align: right; }\n.phs { font: 400 12px/1.5 var(--mono); letter-spacing: .04em; color: var(--mute); margin-top: 5px; }\n\n.tag {\n  font: 700 12px/1 var(--mono);\n  letter-spacing: .06em;\n  padding: 4px 8px;\n  border-radius: 999px;\n  white-space: nowrap;\n  color: var(--accent-text);\n  background: var(--accent-soft);\n}\n.tag.gray { color: var(--mute); background: var(--faint); }\n.tag.green { color: var(--green); background: var(--green-bg); }\n.tag.amber { color: var(--amber); background: var(--amber-bg); }\n.tag.red { color: var(--red); background: var(--red-bg); }\n.tag.data { color: var(--data); background: var(--data-soft); }\n.tag.solid { color: var(--on-primary); background: var(--ink); }\n.tag.outline { color: var(--accent-text); background: none; box-shadow: inset 0 0 0 1px var(--accent-text); }\n\n.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: none; display: inline-block; }\n\n/* ============ 控件 ============ */\n.btn {\n  display: inline-flex; align-items: center; gap: 6px;\n  font: 700 12px/1 var(--mono); letter-spacing: .06em;\n  color: var(--ink);\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 11px;\n  cursor: default;\n  white-space: nowrap;\n  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);\n}\n.btn:hover { border-color: var(--accent-text); color: var(--accent-text); }\n.btn:active { transform: scale(.97); }\n.btn.pri { background: var(--primary-bg); color: var(--on-primary); border-color: var(--primary-bg); }\n.btn.pri:hover { background: var(--primary-bg-hover); border-color: var(--primary-bg-hover); color: var(--on-primary); }\n.btn.mini { font-size: 12px; padding: 5px 9px; border-radius: 6px; }\n.btn.data { color: var(--data); background: var(--data-soft); border-color: var(--data-soft); }\n\n.seg { display: inline-flex; }\n.seg .btn { border-radius: 0; margin-left: -1px; }\n.seg .btn:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }\n.seg .btn:last-child { border-radius: 0 10px 10px 0; }\n.seg .btn.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-text); font-weight: 700; }\n\n/* ============ 数据行 / 键值 / 表格 ============ */\n.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }\n.kv > div { min-width: 0; }\n.kv label { display: block; font: 400 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); }\n.kv b { display: block; font: 700 20px/1.2 var(--sans); margin-top: 3px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }\n.kv b small { font: 400 12px/1 var(--sans); color: var(--mute); margin-left: 3px; letter-spacing: 0; }\n.kv b.acc { color: var(--accent-text); }\n\n.rows { display: grid; gap: 0; }\n.row {\n  display: grid;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 8px;\n  border-top: 1px solid var(--line-2);\n  transition: background var(--dur) var(--ease);\n}\n.row:first-child { border-top: 0; }\n.row:hover { background: var(--faint); }\n.row .ttl { font-size: 14px; line-height: 1.45; color: var(--ink); }\n.row .ttl small { display: block; font: 400 12px/1.5 var(--mono); letter-spacing: .02em; color: var(--mute); margin-top: 3px; }\n.row .r { text-align: right; font: 700 12px/1.3 var(--mono); letter-spacing: .04em; color: var(--mute); }\n.row .num { font: 700 16px/1.2 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }\n\n.gtable { width: 100%; border-collapse: collapse; }\n.gtable th {\n  font: 400 12px/1.2 var(--mono); letter-spacing: .08em; color: var(--mute);\n  text-align: left; padding: 0 8px 8px; font-weight: 400;\n}\n.gtable td { padding: 9px 8px; border-top: 1px solid var(--line-2); font-size: 14px; }\n.gtable th.num, .gtable td.num { text-align: right; font-variant-numeric: tabular-nums; }\n.gtable td.pk { font-weight: 700; color: var(--ink); }\n.gtable .mut { color: var(--mute); }\n.gtable tr.hot td { background: var(--accent-soft); }\n\n/* 段落量条（SETS .segs） */\n.segs { display: flex; gap: 2px; height: 9px; }\n.segs i { flex: 1; background: rgb(28 22 18 / 0.10); border-radius: 1.5px; }\n.segs i.on { background: var(--accent); }\n\n/* 漏斗条 */\n.bar { height: 8px; background: var(--faint); border-radius: 4px; position: relative; overflow: hidden; }\n.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }\n.bar i.c { background: linear-gradient(90deg, var(--ink), var(--accent)); }\n.bar i.p { background: rgb(28 22 18 / 0.12); }\n\n/* 底部说明行 */\n.pf { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; color: var(--mute); font: 400 12px/1.4 var(--mono); letter-spacing: .05em; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--line); }\n.pf b { color: var(--accent-text); font-weight: 700; }\n\n/* ============ 状态条（Agent 在做什么） ============ */\n.stageline {\n  display: flex; align-items: center; gap: 9px;\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 10px;\n  font: 400 12px/1.3 var(--mono); letter-spacing: .03em;\n  color: var(--ink-2);\n}\n.stageline .dot { width: 7px; height: 7px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: ops-pulse 1.8s var(--ease) infinite; }\n.stageline b { color: var(--accent-text); letter-spacing: .06em; }\n.stageline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n@keyframes ops-pulse {\n  0% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0.5); }\n  70% { box-shadow: 0 0 0 7px rgb(194 109 58 / 0); }\n  100% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0); }\n}\n\n/* ============ 骨架 ============ */\n.body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }\n.scroll { flex: 1; min-height: 0; overflow: auto; }\n.pad { padding: 14px 16px; }\n.stack { display: grid; gap: 12px; }\n\n/* ============ 动效 ============ */\n@keyframes ops-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n.rise { animation: ops-rise var(--dur) var(--ease) both; }\n.rise-1 { animation-delay: 40ms; } .rise-2 { animation-delay: 80ms; }\n.rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 160ms; }\n\n/* 折线自绘：480ms，不用弹跳 */\n.spark path { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 340; stroke-dashoffset: 340; animation: ops-draw 480ms var(--ease) forwards; }\n.spark .fill { fill: rgb(194 109 58 / 0.10); stroke: none; opacity: 0; animation: ops-fade 300ms var(--ease) 260ms forwards; }\n@keyframes ops-draw { to { stroke-dashoffset: 0; } }\n@keyframes ops-fade { to { opacity: 1; } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .01ms !important;\n    /* delay 必须一起归零：递进靠 delay 做，只归零 duration 的话\n       reduced 下卡片仍会按 delay 逐个闪出来。 */\n    animation-delay: 0s !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .01ms !important;\n    transition-delay: 0s !important;\n  }\n}\n\u003c/style>\n\u003cstyle>\n  .instr { flex: 0 0 auto; padding: 12px 16px 10px; background: linear-gradient(180deg, var(--wash), var(--panel) 72%); border-bottom: 1px solid var(--line); }\n  .instr .top { display: flex; align-items: center; gap: 12px; }\n  .instr .brand { flex: none; }\n  .instr .brand h1 { font: 700 20px/1.1 var(--sans); letter-spacing: -.01em; color: var(--ink); }\n  .instr .brand p { font: 400 12px/1.4 var(--mono); letter-spacing: .05em; color: var(--mute); margin-top: 4px; }\n  .instr .top .sp { flex: 1; }\n  .stats { display: flex; gap: 16px; flex: none; }\n  .stat { text-align: right; min-width: 62px; }\n  .stat label { display: block; font: 400 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); }\n  .stat b { display: block; font: 700 20px/1.2 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); margin-top: 2px; }\n  .stat b.acc { color: var(--accent-text); }\n\n  .filter { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }\n  .filter .sp { flex: 1; }\n  .search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--faint); font: 400 12px/1 var(--mono); color: var(--mute); min-width: 148px; }\n\n  .ledger { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 16px; }\n  .thead, .trow { display: grid; grid-template-columns: 72px 1fr 92px 124px; gap: 10px; align-items: center; }\n  .thead { position: sticky; top: 0; z-index: 2; padding: 11px 14px 8px; background-color: var(--bg);\n    background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px); background-size: 18px 18px; }\n  .thead span { font: 400 12px/1.2 var(--mono); letter-spacing: .08em; color: var(--mute); }\n  .thead span.r, .trow .r { text-align: right; }\n  .trow { padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line);\n    animation: ops-rise var(--dur) var(--ease) both; animation-delay: var(--d, 0ms); }\n  .trow:first-of-type { border-top: 1px solid var(--line); }\n  .trow .id { font: 400 12px/1 var(--mono); color: var(--mute); letter-spacing: .02em; }\n  .trow .ttl { min-width: 0; }\n  .trow .ttl .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\n    font-size: 14px; line-height: 1.4; color: var(--ink); }\n  .trow .ttl small { display: block; font: 400 12px/1.4 var(--mono); color: var(--mute); margin-top: 2px;\n    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .trow .pf { font: 400 12px/1 var(--mono); letter-spacing: .04em; color: var(--mute); }\n  .trow .mt { font: 700 14px/1 var(--mono); letter-spacing: .02em; color: var(--ink); font-variant-numeric: tabular-nums; }\n  .trow .mt small { display: block; font: 400 12px/1.3 var(--mono); color: var(--mute); margin-top: 3px; letter-spacing: .04em; }\n  /* 回流行：青底 + 左侧轨，唯一的冷色，标记\"这条来自复盘\" */\n  .trow.rule { background: linear-gradient(90deg, var(--data-soft), var(--panel) 42%); box-shadow: inset 2px 0 0 var(--data); }\n  .trow.rule .ttl .t { font-weight: 700; color: var(--data); }\n  .trow.hot .ttl .t { color: var(--accent-text); font-weight: 700; }\n  .foot { flex: 0 0 auto; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }\n  .view { display: none; }\n  .view.on { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n  \u003cdiv class=\"tabbar\">\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">文件\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">终端\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"false\">浏览器\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cbutton class=\"tabbtn\" aria-selected=\"true\">运营\u003cspan class=\"x\">×\u003c/span>\u003c/button>\n    \u003cspan class=\"sp\">\u003c/span>\n    \u003cspan class=\"mono-note\">独占视图\u003c/span>\n  \u003c/div>\n\n  \u003csection class=\"view on\" data-v=\"all\">\n    \u003cdiv class=\"instr\">\n      \u003cdiv class=\"top\">\n        \u003cdiv class=\"brand\">\u003ch1>运营台账\u003c/h1>\u003cp>本地优先 · 19 条记录 · 同步就绪\u003c/p>\u003c/div>\n        \u003cspan class=\"sp\">\u003c/span>\n        \u003cdiv class=\"stats\">\n          \u003cdiv class=\"stat\">\u003clabel>本周待发\u003c/label>\u003cb class=\"acc\">3\u003c/b>\u003c/div>\n          \u003cdiv class=\"stat\">\u003clabel>制作中\u003c/label>\u003cb>1\u003c/b>\u003c/div>\n          \u003cdiv class=\"stat\">\u003clabel>已沉淀规则\u003c/label>\u003cb>2\u003c/b>\u003c/div>\n          \u003cdiv class=\"stat\">\u003clabel>近 7 日发布\u003c/label>\u003cb>3\u003c/b>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"filter\">\u003cdiv class=\"seg\" data-seg>\u003c/div>\u003cspan class=\"sp\">\u003c/span>\u003cspan class=\"search\">搜索标题 / 编号\u003c/span>\u003cbutton class=\"btn mini\">导出\u003c/button>\u003c/div>\n    \u003cdiv class=\"ledger\">\u003cdiv class=\"thead\" data-head>\u003c/div>\u003cdiv data-body>\u003c/div>\u003c/div>\n    \u003cdiv class=\"foot\">\u003cdiv class=\"stageline\">\u003cspan class=\"dot\">\u003c/span>\u003cb>AGENT\u003c/b>\u003cspan>正在制作「三种除味方案对比」· 预计 2 分钟\u003c/span>\u003c/div>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cscript>\nconst DOMS = [\n  { id: 'all', name: '全部' }, { id: 'topics', name: '选题' }, { id: 'assets', name: '素材' },\n  { id: 'schedule', name: '排期' }, { id: 'reviews', name: '复盘' },\n];\n\nconst ROWS = [\n  { d:'topics', id:'t_5d19', t:'一平米厨房改造', s:'评论区追问厨房台面尺寸，顺带做选品', pf:'小红书', st:'待加工', mt:'热度 0.38', mt2:'11-16' },\n  { d:'topics', id:'t_4e78', t:'早睡挑战 2.0', s:'上期完播 29%，换开头重做', pf:'小红书', st:'已复盘', mt:'热度 0.31', mt2:'11-02' },\n  { d:'topics', id:'t_6a32', t:'梅雨天的家电除味：冰箱、洗衣机、空调', s:'平台热榜 · 家电类目第 3', pf:'视频号', st:'热点', mt:'热度 0.42', mt2:'11-13' },\n  { d:'topics', id:'t_7b55', t:'通勤包里只留这三件', s:'依据规则「清单型封面点击高 1.8 倍」', pf:'抖音', st:'来自复盘', mt:'热度 0.48', mt2:'11-11' },\n  { d:'topics', id:'t_8f21', t:'老房子的夏季除味：三步走，不用香氛', s:'评论区反复提到「梅雨味」', pf:'小红书', st:'制作中', mt:'热度 0.62', mt2:'11-04' },\n  { d:'topics', id:'t_9c04', t:'租房党的厨房收纳：房东不砸墙的 6 个位置', s:'对标账号 · 住小帮', pf:'小红书', st:'待加工', mt:'热度 0.61', mt2:'11-06' },\n  { d:'assets', id:'a_1f30', t:'家电除味分镜脚本', s:'分镜 9 格 · 口播稿 1 版', pf:'视频号', st:'草稿', mt:'完成 9%', mt2:'交付 11-21' },\n  { d:'assets', id:'a_2a94', t:'通勤三件套图文', s:'正文 388 字 · 封面 1 张', pf:'抖音', st:'草稿', mt:'完成 18%', mt2:'交付 11-19' },\n  { d:'assets', id:'a_3b61', t:'6 个不砸墙的收纳位', s:'正文 511 字 · 配图 6 张', pf:'小红书', st:'制作中', mt:'完成 42%', mt2:'交付 11-18' },\n  { d:'assets', id:'a_4c07', t:'三种除味方案对比', s:'正文 862 字 · 封面 1 张 · 配图 4 张', pf:'小红书', st:'待发布', mt:'完成 100%', mt2:'交付 11-15' },\n  { d:'schedule', id:'s_5f30', t:'6 个不砸墙的收纳位', s:'预计 0.9 万曝光', pf:'小红书', st:'素材未就绪', mt:'距发布 8 天', mt2:'11-21 19:00' },\n  { d:'schedule', id:'s_6a94', t:'通勤包里的三件套', s:'预计 2.4 万曝光', pf:'抖音', st:'素材未就绪', mt:'距发布 6 天', mt2:'11-19 20:00' },\n  { d:'schedule', id:'s_7c55', t:'一平米厨房改造', s:'预计 0.8 万曝光', pf:'小红书', st:'待发布', mt:'距发布 5 天', mt2:'11-18 12:00' },\n  { d:'schedule', id:'s_8f21', t:'三种除味方案对比', s:'预计 1.2 万曝光', pf:'小红书', st:'待发布', mt:'距发布 2 天', mt2:'11-15 19:30' },\n  { d:'reviews', id:'r_2c61', t:'早睡挑战 2.0', s:'完播 29% · 涨粉 21', pf:'小红书', st:'已发布', mt:'播放 6,930', mt2:'11-02' },\n  { d:'reviews', id:'r_3b77', t:'出租屋灯光改造', s:'完播 36% · 涨粉 38', pf:'小红书', st:'已发布', mt:'播放 8,412', mt2:'11-06' },\n  { d:'reviews', id:'r_4a12', t:'早八人的早餐', s:'完播 41% · 涨粉 62', pf:'抖音', st:'已发布', mt:'播放 12,847', mt2:'11-08' },\n  { d:'rule', id:'ru_01', t:'开头三秒先给结果，别铺垫', s:'铺垫式开头平均完播低 41%', pf:'规则', st:'已生效', mt:'置信度 0.72', mt2:'反哺 2 条选题' },\n  { d:'rule', id:'ru_02', t:'清单型封面点击高 1.8 倍', s:'封面写清数字的笔记点击率 ×1.8', pf:'规则', st:'已生效', mt:'置信度 0.68', mt2:'反哺 3 条选题' },\n];\n\nconst HEAD = ['编号', '标题', '状态', '指标'];\n\nconst FILT = {\n  all:       r => true,\n  topics:    r => r.d === 'topics',\n  assets:    r => r.d === 'assets',\n  schedule:  r => r.d === 'schedule',\n  reviews:   r => r.d === 'reviews' || r.d === 'rule',\n};\n\n/* 状态列只给三种状态上色，其余压成灰——列要能扫，不能每行都在喊 */\nconst TONE = {\n  '制作中': 'outline', '热点': 'amber',\n  '来自复盘': 'data', '已复盘': 'data', '已生效': 'data',\n  '已发布': 'green',\n};\n\nconst SEG = (a) => DOMS.map(d => `\u003cbutton class=\"btn mini${d.id === a ? ' on' : ''}\" data-goto=\"${d.id}\">${d.name}\u003c/button>`).join('');\nconst HEADHTML = () => `\u003cdiv class=\"thead\" data-head>${HEAD.map((h, i) => `\u003cspan${i === 3 ? ' class=\"r\"' : ''}>${h}\u003c/span>`).join('')}\u003c/div>`;\nconst BODY = (v) => ROWS.filter(FILT[v]).map((r, i) => `\n  \u003cdiv class=\"trow${r.d === 'rule' ? ' rule' : ''}${r.st === '制作中' ? ' hot' : ''}\" style=\"--d:${Math.min(i, 12) * 22}ms\">\n    \u003cspan class=\"id\">${r.id}\u003c/span>\n    \u003cspan class=\"ttl\">\u003cspan class=\"t\">${r.t}\u003c/span>\u003csmall>${r.s} · ${r.pf}\u003c/small>\u003c/span>\n    \u003cspan>\u003cspan class=\"tag ${TONE[r.st] || 'gray'}\">${r.st}\u003c/span>\u003c/span>\n    \u003cspan class=\"mt r\">${r.mt}\u003csmall>${r.mt2}\u003c/small>\u003c/span>\n  \u003c/div>`).join('');\n\nfunction render(v) {\n  document.querySelector('[data-seg]').innerHTML = SEG(v);\n  document.querySelector('[data-head]').outerHTML = HEADHTML();\n  document.querySelector('[data-body]').innerHTML = BODY(v);\n  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);\n}\ndocument.addEventListener('click', e => {\n  const g = e.target.closest('[data-goto]');\n  if (g) render(g.dataset.goto);\n});\n/* 深色对照：视图名带 dark- 前缀即切深色（截图工具只会带一个 query 参数） */\nconst qp = new URLSearchParams(location.search);\nlet view = qp.get('view') || location.hash.slice(1) || 'all';\nlet scheme = qp.get('scheme') || 'light';\nif (view.indexOf('dark-') === 0) { scheme = 'dark'; view = view.slice(5); }\ndocument.documentElement.dataset.scheme = scheme;\nrender(view);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "c.html", "baseline": false, "interactive": true}, {"id": "d-dsh", "name": "方向 D · dsh 复刻（已选定）", "concept": "照搬 dsh-media-desk 的外观与结构：Hero 一句话结论 + 指标带、胶囊导航、深墨主角卡、卡片网格。四域共用一副外壳，切域换的是整套内容。颜色/字体/圆角全部换成 app token，宽屏与窄栏（容器查询 760 / 400 两档断点）自动切换。", "typography": "app 正文字体做标题 + 衬线做数字（28px，受七档字阶上限约束）", "palette": ["#faf6ee", "#1c1612", "#2e6f5e", "#c26d3a"], "traits": ["Hero 结论句", "指标带按域换口径", "深墨主角卡", "胶囊导航", "四域各一套内容", "窄栏自动降级"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>方向 D · dsh 外观复刻（app 风格） — 运营视图\u003c/title>\n\u003cstyle>/* 运营视图小样 · 共用底座\n *\n * 语法来源：/home/hmcz/Fin/SETS/dist/style.css\n *   点阵底 / 白卡片 / 发丝线 / 等宽微标签 / 大数字 / 连体分段控件 / 环图\n *   —— 这层是**结构语法**，跨主题成立，照搬。\n * 配色来源：app 当前主题 hamuna-default（src/renderer/theme/themes/hamuna-default.css）\n *   —— SETS 的冷蓝是它自己的主题选择，不是语法。落到 app 里一律走 token。\n *   两个色相分工：**陶土 = 交互 / 状态**，**冷青 = 数据 / 回流**。\n *   冷暖对位是这份配色唯一的\"炫\"点；全暖会闷，全青会冷，都不是 app 的样子。\n *\n * 适配 app 约束（docs/DESIGN-LANGUAGE.md）：\n *   字阶只用 12/14/16/18/20/22/28 —— SETS 的 8.5px 微标签上调到 12px\n *   圆角只用 6 / 10 / 14 / 9999（app 的 radius 档位）\n *   过渡 ≤200ms、cubic-bezier(.16,1,.3,1)、不用弹跳、只动 transform/opacity\n *   必须支持 prefers-reduced-motion\n */\n\n:root {\n  /* 纸面层 —— app --paper / --paper-elevated / --paper-inset */\n  --bg: #faf6ee;\n  --panel: #fffcf7;\n  --faint: #f2e9de;\n  --ink: #1c1612;\n  --ink-2: #2e2825;\n  --mute: #6f6156;\n  --line: rgb(28 22 18 / 0.10);\n  --line-2: rgb(28 22 18 / 0.06);\n\n  /* 主色 —— app --accent-warm（陶土） */\n  --accent: #c26d3a;          /* 图形 / 描边 / 填充 */\n  --accent-text: #9c5027;      /* 当小字用时加深（对 --accent-soft 4.8:1，过 AA） */\n  --accent-soft: #f6e8dc;\n  --wash: rgb(194 109 58 / 0.07);\n  --primary-bg: #b05e2d;       /* app --button-primary-bg */\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  /* 数据 / 回流色 —— app --accent-cool（深青） */\n  --data: #2e6f5e;\n  --data-soft: #e6ebe5;\n\n  /* 语义色 —— app --success / --warning / --error */\n  --green: #236d4a;\n  --green-bg: #e2f0e8;\n  --amber: #944f00;\n  --amber-bg: #fef3c7;\n  --red: #bd1e1e;\n  --red-bg: #fee2e2;\n\n  --dot: rgb(28 22 18 / 0.055);\n  --inset-hi: rgb(255 255 255 / 0.60);\n  --card-shadow: 0 6px 18px -14px rgb(28 22 18 / 0.28);\n\n  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', 'Microsoft YaHei UI', 'Hiragino Sans GB', monospace;\n  --sans: 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;\n  --serif: 'Playfair Display', 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'Times New Roman', serif;\n\n  /* 深墨主角卡 —— app --button-dark-bg / -hover / -text */\n  --deep: #1c1612;\n  --deep-2: #3a3532;\n  --deep-text: #ffffff;\n\n  /* 右上暖光晕（Hero 弥散）*/\n  --wash-strong: oklch(80% 0.05 52 / 0.50);\n\n  /* 条形对照组（同一张图里的基线）：弱一档，仍可读 */\n  --bar-muted: rgb(28 22 18 / 0.16);\n\n  --dur: 200ms;\n  --ease: cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n/* 深色 —— app 的 dark 方案同一套 token 换值 */\nhtml[data-scheme='dark'] {\n  --bg: #1a1614;\n  --panel: #242018;\n  --faint: #12100e;\n  --ink: #e4dcd4;\n  --ink-2: #cfc5ba;\n  --mute: #968a7e;\n  --line: rgb(228 220 212 / 0.10);\n  --line-2: rgb(228 220 212 / 0.06);\n\n  --accent: #d4803f;\n  --accent-text: #e89860;\n  --accent-soft: #473320;\n  --wash: rgb(212 128 63 / 0.10);\n  --primary-bg: #b05e2d;\n  --primary-bg-hover: #9c5027;\n  --on-primary: #ffffff;\n\n  --data: #4aad8a;          /* app --accent-cool 的深色值，不另造色 *//\n  --data-soft: #2b392d;\n\n  --green: #4aad7a;\n  --green-bg: rgb(74 173 122 / 0.15);\n  --amber: #f59e0b;\n  --amber-bg: rgb(245 158 11 / 0.15);\n  --red: #f05050;\n  --red-bg: rgb(240 80 80 / 0.15);\n\n  --dot: rgb(228 220 212 / 0.05);\n  --inset-hi: rgb(255 255 255 / 0.05);\n  --card-shadow: 0 6px 18px -14px rgb(0 0 0 / 0.55);\n\n  --deep: #443e36;\n  --deep-2: #564e44;\n  --deep-text: #e4dcd4;\n\n  --wash-strong: oklch(45% 0.05 52 / 0.42);\n\n  --bar-muted: rgb(228 220 212 / 0.20);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font: 400 14px/1.5 var(--sans);\n  color: var(--ink);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ============ 面板外壳 ============ */\n.shell {\n  width: 600px;\n  height: 780px;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  background: var(--bg);\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(78% 0.04 45 / 0.3) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n  background-size: 100% 100%, 18px 18px;\n  position: relative;\n}\nhtml[data-scheme='dark'] .shell {\n  background-image:\n    radial-gradient(560px 300px at 108% -14%, oklch(30% 0.03 45 / 0.25) 0%, transparent 62%),\n    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);\n}\n.shell > * { position: relative; }\n\n/* ============ 顶部条（面板 tab 条） ============\n   抄 app 右栏真实结构（src/renderer/pages/Chat.tsx）：\n   h-9 + border-b --line + bg paper-elevated；激活项 = 深墨字 + 2px 陶土下划线。 */\n.tabbar {\n  flex: 0 0 auto;\n  height: 36px;\n  display: flex;\n  align-items: center;\n  gap: 2px;\n  padding: 0 8px;\n  background: var(--panel);\n  border-bottom: 1px solid var(--line);\n}\n.tabbtn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  height: 26px;\n  padding: 0 10px;\n  border: 0;\n  background: none;\n  border-radius: 10px;\n  font: 500 14px/1 var(--sans);\n  color: var(--mute);\n  cursor: default;\n  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);\n}\n.tabbtn:hover { color: var(--ink); }\n.tabbtn[aria-selected='true'] { color: var(--ink); }\n.tabbtn[aria-selected='true']::after {\n  content: '';\n  position: absolute;\n  left: 4px; right: 4px; bottom: -5px;\n  height: 2px;\n  border-radius: 999px;\n  background: var(--accent);\n}\n.tabbtn .x {\n  width: 20px; height: 20px;\n  display: inline-flex; align-items: center; justify-content: center;\n  border-radius: 6px;\n  font: 400 14px/1 var(--sans);\n  color: var(--mute);\n  opacity: 0;\n  transition: opacity var(--dur) var(--ease);\n}\n.tabbtn:hover .x { opacity: 1; }\n.tabbtn:hover .x:hover { background: var(--faint); }\n.tabbar .sp { flex: 1; }\n.tabbar .mono-note { font: 700 12px/1 var(--mono); letter-spacing: .08em; color: var(--mute); }\n\n/* ============ 通用：卡片 / 标题 / 徽标 ============ */\n.card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  box-shadow: inset 0 1px 0 var(--inset-hi), var(--card-shadow);\n  padding: 14px 16px;\n}\n.card.tight { padding: 10px 12px; }\n\n.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.ph h2 { font: 700 16px/1.2 var(--mono); letter-spacing: .06em; color: var(--ink); }\n.ph .r { font: 700 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); text-align: right; }\n.phs { font: 400 12px/1.5 var(--mono); letter-spacing: .04em; color: var(--mute); margin-top: 5px; }\n\n.tag {\n  font: 700 12px/1 var(--mono);\n  letter-spacing: .06em;\n  padding: 4px 8px;\n  border-radius: 999px;\n  white-space: nowrap;\n  color: var(--accent-text);\n  background: var(--accent-soft);\n}\n.tag.gray { color: var(--mute); background: var(--faint); }\n.tag.green { color: var(--green); background: var(--green-bg); }\n.tag.amber { color: var(--amber); background: var(--amber-bg); }\n.tag.red { color: var(--red); background: var(--red-bg); }\n.tag.data { color: var(--data); background: var(--data-soft); }\n.tag.solid { color: var(--on-primary); background: var(--ink); }\n.tag.outline { color: var(--accent-text); background: none; box-shadow: inset 0 0 0 1px var(--accent-text); }\n\n.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: none; display: inline-block; }\n\n/* ============ 控件 ============ */\n.btn {\n  display: inline-flex; align-items: center; gap: 6px;\n  font: 700 12px/1 var(--mono); letter-spacing: .06em;\n  color: var(--ink);\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 11px;\n  cursor: default;\n  white-space: nowrap;\n  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);\n}\n.btn:hover { border-color: var(--accent-text); color: var(--accent-text); }\n.btn:active { transform: scale(.97); }\n.btn.pri { background: var(--primary-bg); color: var(--on-primary); border-color: var(--primary-bg); }\n.btn.pri:hover { background: var(--primary-bg-hover); border-color: var(--primary-bg-hover); color: var(--on-primary); }\n.btn.mini { font-size: 12px; padding: 5px 9px; border-radius: 6px; }\n.btn.data { color: var(--data); background: var(--data-soft); border-color: var(--data-soft); }\n\n.seg { display: inline-flex; }\n.seg .btn { border-radius: 0; margin-left: -1px; }\n.seg .btn:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }\n.seg .btn:last-child { border-radius: 0 10px 10px 0; }\n.seg .btn.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-text); font-weight: 700; }\n\n/* ============ 数据行 / 键值 / 表格 ============ */\n.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }\n.kv > div { min-width: 0; }\n.kv label { display: block; font: 400 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--mute); }\n.kv b { display: block; font: 700 20px/1.2 var(--sans); margin-top: 3px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }\n.kv b small { font: 400 12px/1 var(--sans); color: var(--mute); margin-left: 3px; letter-spacing: 0; }\n.kv b.acc { color: var(--accent-text); }\n\n.rows { display: grid; gap: 0; }\n.row {\n  display: grid;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 8px;\n  border-top: 1px solid var(--line-2);\n  transition: background var(--dur) var(--ease);\n}\n.row:first-child { border-top: 0; }\n.row:hover { background: var(--faint); }\n.row .ttl { font-size: 14px; line-height: 1.45; color: var(--ink); }\n.row .ttl small { display: block; font: 400 12px/1.5 var(--mono); letter-spacing: .02em; color: var(--mute); margin-top: 3px; }\n.row .r { text-align: right; font: 700 12px/1.3 var(--mono); letter-spacing: .04em; color: var(--mute); }\n.row .num { font: 700 16px/1.2 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }\n\n.gtable { width: 100%; border-collapse: collapse; }\n.gtable th {\n  font: 400 12px/1.2 var(--mono); letter-spacing: .08em; color: var(--mute);\n  text-align: left; padding: 0 8px 8px; font-weight: 400;\n}\n.gtable td { padding: 9px 8px; border-top: 1px solid var(--line-2); font-size: 14px; }\n.gtable th.num, .gtable td.num { text-align: right; font-variant-numeric: tabular-nums; }\n.gtable td.pk { font-weight: 700; color: var(--ink); }\n.gtable .mut { color: var(--mute); }\n.gtable tr.hot td { background: var(--accent-soft); }\n\n/* 段落量条（SETS .segs） */\n.segs { display: flex; gap: 2px; height: 9px; }\n.segs i { flex: 1; background: rgb(28 22 18 / 0.10); border-radius: 1.5px; }\n.segs i.on { background: var(--accent); }\n\n/* 漏斗条 */\n.bar { height: 8px; background: var(--faint); border-radius: 4px; position: relative; overflow: hidden; }\n.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }\n.bar i.c { background: linear-gradient(90deg, var(--ink), var(--accent)); }\n.bar i.p { background: rgb(28 22 18 / 0.12); }\n\n/* 底部说明行 */\n.pf { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; color: var(--mute); font: 400 12px/1.4 var(--mono); letter-spacing: .05em; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--line); }\n.pf b { color: var(--accent-text); font-weight: 700; }\n\n/* ============ 状态条（Agent 在做什么） ============ */\n.stageline {\n  display: flex; align-items: center; gap: 9px;\n  background: var(--faint);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 8px 10px;\n  font: 400 12px/1.3 var(--mono); letter-spacing: .03em;\n  color: var(--ink-2);\n}\n.stageline .dot { width: 7px; height: 7px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: ops-pulse 1.8s var(--ease) infinite; }\n.stageline b { color: var(--accent-text); letter-spacing: .06em; }\n.stageline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n@keyframes ops-pulse {\n  0% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0.5); }\n  70% { box-shadow: 0 0 0 7px rgb(194 109 58 / 0); }\n  100% { box-shadow: 0 0 0 0 rgb(194 109 58 / 0); }\n}\n\n/* ============ 骨架 ============ */\n.body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }\n.scroll { flex: 1; min-height: 0; overflow: auto; }\n.pad { padding: 14px 16px; }\n.stack { display: grid; gap: 12px; }\n\n/* ============ 动效 ============ */\n@keyframes ops-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n.rise { animation: ops-rise var(--dur) var(--ease) both; }\n.rise-1 { animation-delay: 40ms; } .rise-2 { animation-delay: 80ms; }\n.rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 160ms; }\n\n/* 折线自绘：480ms，不用弹跳 */\n.spark path { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 340; stroke-dashoffset: 340; animation: ops-draw 480ms var(--ease) forwards; }\n.spark .fill { fill: rgb(194 109 58 / 0.10); stroke: none; opacity: 0; animation: ops-fade 300ms var(--ease) 260ms forwards; }\n@keyframes ops-draw { to { stroke-dashoffset: 0; } }\n@keyframes ops-fade { to { opacity: 1; } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .01ms !important;\n    /* delay 必须一起归零：递进靠 delay 做，只归零 duration 的话\n       reduced 下卡片仍会按 delay 逐个闪出来。 */\n    animation-delay: 0s !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .01ms !important;\n    transition-delay: 0s !important;\n  }\n}\n\u003c/style>\n\u003c!-- ops-data.js 定义 window.opsData，必须先于 Alpine 执行（两者都 defer，靠顺序保证）。 -->\n\n\n\u003cstyle>\n/* 方向 D：复刻 dsh-media-desk 的**外观语法**，颜色/字体/圆角/动效全部换成 app token。\n *\n * 映射表（dsh → app）：\n *   淡紫粉弥散 Hero      → app 暖色弥散（陶土光晕）\n *   蓝色折线 / 条形       → --accent-cool 深青\n *   黑色「下一条」卡       → --button-dark-bg\n *   巨号衬线数字 40px     → --font-serif-family + 28px（app 七档字阶上限，差一档气势）\n *   白卡 + 淡边 + 圆角 20 → --paper-elevated + --line + radius 14\n *   pill 胶囊导航          → 保留胶囊形状（dsh 的识别度），实心用 --button-dark-bg\n *\n * 色值全部走 base.css 的 token（那边已经映射到 hamuna-default.css），\n * 所以深色模式自动跟随，切主题时不需要改这里。\n */\n.dsh {\n  --d-serif: var(--serif);\n  --d-line: var(--line);\n  --d-line-soft: var(--line-2);\n  --d-hair: var(--line-2);\n  --d-chart: var(--data);\n  --d-chart-fill: color-mix(in srgb, var(--data) 12%, transparent);\n  --d-dark: var(--deep);\n  --d-dark-2: var(--deep-2);\n  --d-dark-text: var(--deep-text);\n  --d-dark-dim: color-mix(in srgb, var(--d-dark-text) 72%, transparent);\n  --d-wash: var(--wash-strong);\n  /* 慢放开关（只在取证时用 ?slow=8 打开，见文件末尾脚本）。 */\n  --s: 1;\n}\n\n.dsh, .dsh * { box-sizing: border-box; }\n\n/* 面板铺满所在视口：截图按视口尺寸取，对比页里 iframe 也是视口尺寸，\n   避免固定宽高在两种容器里留出空白边。 */\nhtml, body { height: 100%; }\nbody { background: var(--bg); container-type: inline-size; }\n\n.dsh {\n  width: 100%;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  background: var(--bg);\n  background-image: radial-gradient(720px 420px at 104% -12%, var(--d-wash) 0%, transparent 60%);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 14px;\n  line-height: 1.5;\n}\n\n/* ── 顶栏 ─────────────────────────────────────────── */\n.dsh-top {\n  flex: 0 0 auto;\n  height: 56px;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 0 18px;\n}\n.dsh-pills { display: flex; gap: 2px; padding: 3px; background: var(--faint); border-radius: 999px; }\n.dsh-pills button {\n  font: 500 14px/1 var(--sans);\n  color: var(--ink-2);\n  background: none;\n  border: 0;\n  border-radius: 999px;\n  padding: 7px 14px;\n  white-space: nowrap;\n  flex: none;\n  cursor: default;\n  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);\n}\n.dsh-pills button:hover { color: var(--ink); }\n.dsh-pills button.on { background: var(--d-dark); color: var(--d-dark-text); }\n.dsh-top .sp { flex: 1; }\n.dsh-ghost {\n  font: 400 13px/1 var(--sans);\n  color: var(--mute);\n  background: var(--panel);\n  border: 1px solid var(--d-line);\n  border-radius: 999px;\n  padding: 7px 12px;\n  white-space: nowrap;\n  flex: none;\n  cursor: default;\n}\n.dsh-ghost.solid { background: var(--d-dark); color: var(--d-dark-text); border-color: var(--d-dark); }\n\n/* ── 主体：内容区 + 右栏 ──────────────────────────── */\n.dsh-body { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 18px 18px; }\n/* 四个域共用一副外壳：结构相同，只有复盘多出趋势图与建议两张卡（x-if 决定在不在）。\n   order 只在窄栏摊平后才需要，所以整套顺序槽位declared在容器查询里——\n   放外面会连宽栏也生效，而宽栏主区是 flex 列，order 1 的 Hero 会被排到 order 0 的网格后面。 */\n/* 图标走 SVG sprite（见 body 顶部的 \u003csymbol> 定义），这里只定尺寸；\n   描边/填充由 .dsh-act svg 等既有规则继承进来。 */\n.i { width: 14px; height: 14px; flex: none; }\n\n/* 排期域的时间格：日期在上、星期在下，与字牌同宽同位，切换域时列表左缘不跳 */\n.dsh-top-list .date { flex: none; width: 34px; text-align: center; }\n.dsh-top-list .date b { display: block; font-family: var(--d-serif); font-weight: 600; font-size: 14px; color: var(--ink); }\n.dsh-top-list .date small { display: block; font: 400 12px/1 var(--sans); color: var(--mute); margin-top: 3px; }\n.dsh-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }\n/* 列内子项不许被压扁：hero 是内容，不是可压缩的弹性盒 */\n.dsh-main > * { flex: none; }\n/* 右栏内容天然比主区短（复盘域只有两张卡）。让它跟着滚动吸顶，\n   空的地方是「滚动中右侧仍停着工具列」，不是一条断掉的空带。 */\n/* 右栏只有两张卡，天然比主区短，所以**两张贴着排**，不吸底。\n   试过 justify-content: space-between（顶卡贴顶、末卡贴底），宽屏下它把两张卡拉开\n   400px，中间裂出一条空带，比留白更像出错；也试过给末卡 flex:1，那会得到一张\n   3/4 空的大卡，更抢眼。留白统一落在内容之后，读作「这列到此为止」。 */\n.dsh-rail { flex: 0 0 300px; display: flex; flex-direction: column; gap: 12px; }\n\n/* ── 卡片 ─────────────────────────────────────────── */\n.dsh-card {\n  background: var(--panel);\n  border: 1px solid var(--d-line);\n  border-radius: 14px;\n  box-shadow: inset 0 1px 0 var(--inset-hi);\n  padding: 18px 20px;\n}\n.dsh-card.pad0 { padding: 0; overflow: hidden; }\n.dsh-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }\n.dsh-card-head h2 { font: 700 16px/1.3 var(--sans); color: var(--ink); }\n.dsh-card-head .sp { flex: 1; }\n.dsh-card-head .meta { font: 400 12px/1 var(--mono); color: var(--mute); letter-spacing: .04em; }\n\n/* ── Hero（dsh 复盘页的主视觉） ───────────────────── */\n.dsh-hero {\n  position: relative;\n  overflow: hidden;\n  background: var(--panel);\n  border: 1px solid var(--d-line);\n  border-radius: 14px;\n  box-shadow: inset 0 1px 0 var(--inset-hi);\n  padding: 26px 28px 22px;\n}\n.dsh-hero::before {\n  content: '';\n  position: absolute;\n  inset: 0;\n  background: radial-gradient(720px 360px at 92% -42%, var(--d-wash) 0%, transparent 70%);\n  pointer-events: none;\n}\n.dsh-hero > * { position: relative; }\n.dsh-hero h1 {\n  font: 400 28px/1.35 var(--sans);\n  letter-spacing: -.01em;\n  color: var(--ink);\n  max-width: 640px;\n  /* 宽栏里换行点落在分句后，靠宽度自然折；窄栏由断点接管 */\n  text-wrap: balance;\n}\n.dsh-hero h1 b { font-weight: 700; }\n.dsh-hero h1 .num { font-family: var(--d-serif); font-weight: 600; font-size: 28px; letter-spacing: 0; }\n.dsh-hero h1 .num small { font: 400 12px/1 var(--sans); color: var(--mute); margin-left: 1px; }\n/* 「18.2万」「33%」是同一个读数，不许从数字和单位之间断行 */\n.dsh-hero h1 .num { white-space: nowrap; }\n/* base.css 有全局 .row（grid + 内边距），这里清掉，避免串样式 */\n.dsh-hero .row { display: flex; align-items: flex-end; gap: 32px; padding: 0; border-top: 0; }\n.dsh-hero .copy { flex: 1; min-width: 0; }\n/* 三个指标用 flex + 固定 gap：等分栅格 + 右对齐时，间距仍会随数字宽度变化，\n   flex 的 gap 才是真正的等距。 */\n.dsh-metrics { display: flex; gap: 28px; flex: none; justify-content: flex-end; }\n.dsh-metrics > div { text-align: right; }\n.dsh-metrics dt { font: 400 12px/1.2 var(--sans); color: var(--mute); }\n.dsh-metrics dd { margin: 4px 0 0; font-family: var(--d-serif); font-weight: 600; font-size: 28px; line-height: 1.1; color: var(--ink); }\n.dsh-metrics dd small { font: 400 12px/1 var(--sans); color: var(--mute); margin-left: 2px; }\n.dsh-hero .acts { display: flex; gap: 8px; margin-top: 20px; }\n.dsh-act {\n  display: inline-flex; align-items: center; gap: 6px;\n  font: 500 13px/1 var(--sans);\n  color: var(--ink);\n  background: var(--panel);\n  border: 1px solid var(--d-line);\n  border-radius: 999px;\n  padding: 8px 14px;\n  cursor: default;\n  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease), opacity var(--dur) var(--ease), background var(--dur) var(--ease);\n}\n.dsh-act:hover { border-color: var(--mute); }\n/* 按下即回执：一次性动画落在被点的元素本身。\n   按钮的\"进行中\"是 900ms 后才回的文字，动效探测的窗口等不到，\n   所以按下这一刻必须有一次性的可视反馈。 */\n@keyframes dsh-press { 0% { transform: scale(1); } 40% { transform: scale(.96); } 100% { transform: scale(1); } }\n.dsh-act:active { animation: dsh-press 200ms var(--ease); }\n.dsh-tip .act:active { animation: dsh-press 200ms var(--ease); }\n.dsh-act.solid { background: var(--d-dark); color: var(--d-dark-text); border-color: var(--d-dark); }\n.dsh-act svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ── 卡片网格 ─────────────────────────────────────── */\n/* 复盘域四张卡排成 2×2：左上趋势图（要横向尺度）、右上分布，左下排行、右下建议。\n   非复盘域只有排行 + 分布两张（.dsh-grid-2，由 Alpine 按域挂上，不用 :has()——\n   :has() 要 WebKit 15.4+，这份稿要被抄成 React，别埋一个隐性版本要求）。\n   显式指定位置而不是靠 DOM 顺序：否则分布卡落在宽列、排行被挤进窄列，主列表反而最窄。 */\n.dsh-grid { display: grid; grid-template-columns: 1.62fr 1fr; gap: 12px; align-items: start; }\n.dsh-grid-2 > .dsh-c-top { grid-row: 1; grid-column: 1; }\n.dsh-grid-2 > .dsh-c-bars { grid-row: 1; grid-column: 2; }\n\n/* 折线图：纵轴刻度用 HTML 画，SVG 保持无文字（viewBox 被横向拉伸，\n   SVG 里的字会跟着变形，所以刻度不做成 \u003ctext>）。 */\n.dsh-plot { display: flex; gap: 10px; }\n/* 刻度与网格线共用同一组 y 值（12 / 83 / 154），标签绝对定位上去，\n   否则 space-between 会把标签摊开、与网格线错位。 */\n.dsh-yaxis { position: relative; flex: 0 0 34px; height: 168px; }\n.dsh-yaxis span { position: absolute; right: 0; transform: translateY(-50%); font: 400 12px/1 var(--mono); color: var(--mute); }\n.dsh-yaxis span:nth-child(1) { top: 12px; }\n.dsh-yaxis span:nth-child(2) { top: 83px; }\n.dsh-yaxis span:nth-child(3) { top: 154px; }\n.dsh-chart-wrap { position: relative; flex: 1; min-width: 0; height: 168px; }\n.dsh-chart { width: 100%; height: 168px; display: block; overflow: visible; }\n.dsh-chart .axis { stroke: var(--d-hair); stroke-width: 1; vector-effect: non-scaling-stroke; }\n.dsh-chart .area { fill: var(--d-chart-fill); }\n.dsh-chart .line { fill: none; stroke: var(--d-chart); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }\n/* 峰值标记用 HTML 画：SVG 被横向拉伸，圆点会被拉成椭圆 */\n.dsh-peak {\n  position: absolute; left: 78.6%; top: 15.6%;\n  width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;\n  border-radius: 999px;\n  background: var(--panel);\n  border: 2px solid var(--d-chart);\n  box-sizing: border-box;\n}\n.dsh-peak-tag {\n  position: absolute; left: 78.6%; top: 15.6%;\n  transform: translate(-100%, -50%);\n  margin-left: -10px;\n  font: 700 12px/1 var(--mono); color: var(--ink);\n  background: var(--panel);\n  border: 1px solid var(--d-line);\n  border-radius: 6px;\n  padding: 3px 6px;\n  white-space: nowrap;\n}\n.dsh-xaxis { display: flex; justify-content: space-between; font: 400 12px/1 var(--mono); color: var(--mute); margin-top: 8px; }\n\n/* 条形（平台分布 / 建议里的证据条共用一套） */\n.dsh-bars { list-style: none; display: grid; }\n.dsh-bars li {\n  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline;\n  padding: 9px 0;\n  border-top: 1px solid var(--d-line-soft);\n}\n.dsh-bars li:first-child { border-top: 0; }\n.dsh-bars .name { font: 400 14px/1.3 var(--sans); color: var(--ink-2); }\n.dsh-bars .val { font-family: var(--d-serif); font-weight: 600; font-size: 16px; color: var(--ink); }\n.dsh-bars .track { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--faint); overflow: hidden; }\n.dsh-bars .track i { display: block; height: 100%; border-radius: 999px; background: var(--d-chart); }\n/* 对照组：同一条形里的基线，弱一档 */\n.dsh-bars .track i.mut { background: var(--bar-muted); }\n.dsh-bars.mini li { padding: 6px 0; }\n.dsh-bars.mini .name { font: 400 12px/1.3 var(--sans); color: var(--mute); }\n.dsh-bars.mini .val { font: 700 12px/1 var(--mono); color: var(--ink-2); }\n.dsh-bars.mini .track { height: 4px; }\n\n/* Top 列表 */\n.dsh-list-head {\n  display: grid; grid-template-columns: 1fr auto; gap: 10px;\n  font: 400 12px/1 var(--mono); color: var(--mute);\n  padding-bottom: 6px;\n}\n.dsh-top-list { list-style: none; display: grid; }\n.dsh-top-list li + li { border-top: 1px solid var(--d-line-soft); }\n.dsh-top-list button {\n  width: 100%; display: flex; align-items: center; gap: 12px;\n  padding: 10px 0; background: none; border: 0; cursor: default; text-align: left;\n}\n.dsh-top-list .rank { font-family: var(--d-serif); font-size: 16px; color: var(--mute); width: 16px; flex: none; }\n/* 字牌：中性底 + 深墨字。不上色相——色相没有语义（同一个「早」出现两次却不同色），\n   而且白字压在陶土/橄榄/蓝灰上只有 2.6–3.8:1，不过 AA。真实封面在落地阶段接。 */\n.dsh-top-list .thumb {\n  position: relative; width: 34px; height: 34px; border-radius: 10px; flex: none;\n  display: grid; place-items: center;\n  background: var(--faint); color: var(--ink-2);\n  font: 700 14px/1 var(--sans);\n}\n/* 平台色块：右下角一个 8px 小方，与首字合成双编码——\n   只看首字时「早八人的早餐」和「早睡挑战」会撞成同一个字。 */\n.dsh-top-list .thumb::after {\n  content: ''; position: absolute; right: 3px; bottom: 3px;\n  width: 6px; height: 6px; border-radius: 2px;\n  box-shadow: 0 0 0 1.5px var(--panel);\n}\n.dsh-top-list .thumb.dy::after { background: var(--d-chart); }\n.dsh-top-list .thumb.xhs::after { background: var(--accent); }\n.dsh-top-list .thumb.sph::after { background: var(--ink-2); }\n.dsh-top-list .t { flex: 1; min-width: 0; }\n.dsh-top-list .t strong { display: block; font: 500 14px/1.4 var(--sans); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.dsh-top-list .t small { display: block; font: 400 12px/1.4 var(--sans); color: var(--mute); margin-top: 2px; }\n.dsh-top-list .n { font-family: var(--d-serif); font-weight: 600; font-size: 16px; color: var(--ink); flex: none; font-variant-numeric: tabular-nums; }\n/* 排期的空档：整行压暗，右列改描边字——是「这里缺一条」，不是一条内容 */\n.dsh-top-list .empty .t strong { color: var(--mute); font-weight: 500; }\n.dsh-top-list .empty .n { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--mute); border: 1px dashed var(--line); border-radius: 999px; padding: 4px 9px; }\n\n/* 建议卡 */\n.dsh-advice { display: grid; gap: 12px; }\n.dsh-tip { border: 1px solid var(--d-line); border-radius: 10px; padding: 12px 14px; background: var(--faint); }\n.dsh-tip strong { display: block; font: 700 14px/1.4 var(--sans); color: var(--ink); }\n.dsh-tip p { font: 400 13px/1.5 var(--sans); color: var(--mute); margin: 4px 0 10px; }\n.dsh-tip .act {\n  display: inline-flex; align-items: center; gap: 6px;\n  font: 500 13px/1 var(--sans); color: var(--ink);\n  background: var(--panel);\n  border: 1px solid var(--mute);\n  border-radius: 999px; padding: 7px 13px; cursor: default;\n}\n.dsh-tip .act svg { width: 13px; height: 13px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ── 右栏：本期领跑（深墨主角卡）+ 复盘要点 ───────── */\n.dsh-next {\n  background: var(--d-dark);\n  color: var(--d-dark-text);\n  border-radius: 14px;\n  padding: 18px 20px;\n  display: block; width: 100%; text-align: left; border: 0; cursor: default;\n}\n.dsh-next .top { display: flex; justify-content: space-between; align-items: center; font: 400 12px/1 var(--sans); color: var(--d-dark-dim); }\n.dsh-next .top .pulse { width: 7px; height: 7px; border-radius: 999px; background: currentColor; display: inline-block; animation: dsh-pulse 1.8s var(--ease) infinite; }\n.dsh-next .big { font-family: var(--d-serif); font-weight: 600; font-size: 28px; line-height: 1.1; margin-top: 12px; font-variant-numeric: tabular-nums; }\n.dsh-next .name { font: 500 14px/1.45 var(--sans); margin-top: 6px; }\n.dsh-next .foot { font: 400 12px/1.4 var(--sans); color: var(--d-dark-dim); margin-top: 8px; }\n\n/* 复盘要点 */\n.dsh-notes { list-style: none; display: grid; }\n.dsh-notes li {\n  display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: start;\n  padding: 9px 0;\n  border-top: 1px solid var(--d-line-soft);\n  font: 400 13px/1.45 var(--sans); color: var(--ink-2);\n}\n.dsh-notes li:first-child { border-top: 0; }\n.dsh-notes .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--d-chart); margin-top: 6px; }\n\n/* ── 动效：入场递进 + 状态脉冲 ───────────────────── */\n@keyframes dsh-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n.dsh-hero { animation: dsh-rise calc(160ms * var(--s)) var(--ease) both; }\n.dsh-card, .dsh-next { animation: dsh-rise calc(160ms * var(--s)) var(--ease) both; }\n/* 整场出场 = 160ms + 40ms delay = 200ms，压在单次过渡预算之内。\n   三档递进会让整场到 280ms，超预算，所以收成两档。 */\n.dsh-grid > .dsh-card:nth-child(2) { animation-delay: calc(40ms * var(--s)); }\n.dsh-grid > .dsh-card:nth-child(3) { animation-delay: calc(40ms * var(--s)); }\n.dsh-grid > .dsh-card:nth-child(4) { animation-delay: calc(40ms * var(--s)); }\n.dsh-rail > .dsh-next { animation-delay: calc(40ms * var(--s)); }\n.dsh-rail > .dsh-card { animation-delay: calc(40ms * var(--s)); }\n.dsh-pills button.on, .dsh-act, .dsh-tip .act, .dsh-next { transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }\n@keyframes dsh-pulse {\n  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--d-dark-text) 38%, transparent); }\n  70% { box-shadow: 0 0 0 6px transparent; }\n  100% { box-shadow: 0 0 0 0 transparent; }\n}\n\n/* ── 操作反馈 ─────────────────────────────────────── */\n.dsh-act:disabled { opacity: .72; }\n.dsh-act.solid:disabled { opacity: .82; }\n.dsh-tip .act.done { color: var(--d-chart); border-color: var(--d-chart); background: color-mix(in srgb, var(--d-chart) 8%, var(--panel)); }\n.dsh-toast {\n  position: absolute; right: 18px; bottom: 18px; z-index: 5;\n  font: 500 13px/1 var(--sans); color: var(--d-dark-text); background: var(--d-dark);\n  border-radius: 999px; padding: 9px 14px;\n  box-shadow: 0 8px 24px -12px rgb(28 22 18 / .45);\n  pointer-events: none;\n  /* 用 class 切换而不是 x-show：x-show 会逐帧写内联 style，\n     动效探测据此把回执误判成\"一直循环\"，也就看不到一次性反馈。\n     这里只有 .show 上挂一次性动画，探测能读到。 */\n  opacity: 0; visibility: hidden;\n}\n.dsh-toast.show { visibility: visible; animation: dsh-toast 200ms var(--ease) both; }\n@keyframes dsh-toast { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n.dsh { position: relative; }\n\n/* ── 窄栏变体（我们真正的落地宽度 380–600px） ──────\n   窄栏里「主区 + 右栏」竖排会把主区压到只剩 150px，Hero 被挤扁。\n   所以窄栏下把三层摊平成一列，顺序按「先结论、再排行、后图表」：\n   排行是复盘的落点，不该被挤到第一屏之外。\n   断点 760：落地宽度 380–600 全部走这一版。600px 下不摊平的话主区只剩 190px，\n   Hero 会被压成一列字。 */\n@container (max-width: 760px) {\n  .dsh-body { flex-direction: column; overflow: auto; padding: 0 14px 14px; }\n  .dsh-main, .dsh-rail, .dsh-grid { display: contents; }\n  .dsh-body > * { flex: none; }\n  /* 摊平成一列后的顺序：结论 → 深墨主角卡 → 排行 → 图表 → 分布 → 建议 → 要点。\n     排行是复盘的落点，不能在第一屏之外，所以排在图表前面。\n     非复盘域没有图表与建议，o3/o5/o6 空着不进 DOM，其余照常顺延。 */\n  .dsh-hero { order: 1; }\n  .dsh-next { order: 2; }\n  .dsh-c-top { order: 3; }\n  .dsh-c-chart { order: 4; }\n  .dsh-c-bars { order: 5; }\n  .dsh-c-adv { order: 6; }\n  .dsh-c-note { order: 7; }\n  .dsh-hero .row { flex-direction: column; align-items: flex-start; gap: 16px; }\n  .dsh-hero .acts { flex-wrap: wrap; }\n  .dsh-metrics { gap: 22px; justify-content: flex-start; }\n  .dsh-metrics > div { text-align: left; }\n  .dsh-top { padding: 0 14px; gap: 8px; }\n  /* 440px 以下顶栏放不下两个球的胶囊，容器内横向滚动，保底不换行 */\n  .dsh-pills { min-width: 0; overflow-x: auto; scrollbar-width: none; }\n  .dsh-pills::-webkit-scrollbar { display: none; }\n  .dsh-toast { left: 14px; right: 14px; bottom: 14px; text-align: center; }\n}\n\n/* 终端宽度：390 下「胶囊 + 导出 + 助手」三件必有一件让位。\n   让的是导出——它是次要动作，且 600 这一档仍保留（见上：那个区间不进这个断点）。 */\n@container (max-width: 400px) {\n  .hide-narrow { display: none; }\n  /* 390 下三个动作排不成 2+1 的残局，改单列全宽等高 */\n  .dsh-hero .acts { flex-direction: column; align-items: stretch; }\n  .dsh-act { justify-content: center; height: 36px; padding: 0 14px; }\n  .dsh-hero h1 { font-size: 22px; line-height: 1.45; }\n  .dsh-hero h1 br { display: none; }\n  .dsh-hero h1 .num { font-size: 22px; }\n  /* 产品名整体换行，不许从中间劈开 */\n  .dsh-hero h1 .who { white-space: nowrap; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"dsh\" id=\"dsh\" x-data=\"opsData()\">\n\n  \u003cheader class=\"dsh-top\">\n    \u003cdiv class=\"dsh-pills\">\n      \u003c!-- 切域 = 换一整套内容，不是只换按钮底色（首轮评审的漏项）。 -->\n      \u003ctemplate x-for=\"t in ['选题','素材','排期','复盘']\" :key=\"t\">\n        \u003cbutton :class=\"{ on: tab === t }\" @click=\"tab = t\" x-text=\"t\">\u003c/button>\n      \u003c/template>\n    \u003c/div>\n    \u003cspan class=\"sp\">\u003c/span>\n    \u003cbutton class=\"dsh-ghost hide-narrow\">导出\u003c/button>\n    \u003cbutton class=\"dsh-ghost solid\">助手\u003c/button>\n  \u003c/header>\n\n  \u003c!-- 一个域 = 一份完整内容。x-if 让非当前域整体不出 DOM：\n       窄栏摊平后各卡片靠 order 槽位排，留着隐藏节点会占住槽位。\n       x-if 必须挂在 \u003ctemplate> 上，且内部只能有一个根元素。 -->\n  \u003ctemplate x-if=\"d\">\n    \u003cdiv class=\"dsh-body\">\n\n      \u003cdiv class=\"dsh-main\">\n\n        \u003c!-- Hero：结论句 + 指标带。句式四域共用，口径按域换（见 ops-data.js 顶部）。 -->\n        \u003csection class=\"dsh-hero\">\n          \u003cdiv class=\"row\">\n            \u003cdiv class=\"copy\">\n              \u003ch1 x-html=\"d.lead\">\u003c/h1>\n              \u003cdiv class=\"acts\">\n                \u003ctemplate x-for=\"(a, i) in d.acts\" :key=\"a.k\">\n                  \u003cbutton class=\"dsh-act\" :class=\"{ solid: i === 0 }\" :disabled=\"busy !== ''\" @click=\"run(a.k, a.msg)\">\n                    \u003csvg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath :d=\"a.icon\" />\u003c/svg>\n                    \u003cspan x-text=\"busy === a.k ? a.busy : a.label\">\u003c/span>\n                  \u003c/button>\n                \u003c/template>\n              \u003c/div>\n            \u003c/div>\n            \u003cdl class=\"dsh-metrics\">\n              \u003ctemplate x-for=\"m in d.metrics\" :key=\"m.dt\">\n                \u003cdiv>\n                  \u003cdt x-text=\"m.dt\">\u003c/dt>\n                  \u003cdd>\u003cspan x-text=\"m.dd\">\u003c/span>\u003csmall x-show=\"m.u\" x-text=\"m.u\">\u003c/small>\u003c/dd>\n                \u003c/div>\n              \u003c/template>\n            \u003c/dl>\n          \u003c/div>\n        \u003c/section>\n\n        \u003cdiv class=\"dsh-grid\" :class=\"{ 'dsh-grid-2': tab !== '复盘' }\">\n\n          \u003c!-- 每日趋势：只有复盘域有播放量可画，其余三域此卡不渲染 -->\n          \u003ctemplate x-if=\"tab === '复盘'\">\n            \u003csection class=\"dsh-card dsh-c-chart\">\n              \u003cdiv class=\"dsh-card-head\">\n                \u003ch2>每日发布表现\u003c/h2>\n                \u003cspan class=\"sp\">\u003c/span>\n                \u003cspan class=\"meta\">近 15 天\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"dsh-plot\">\n                \u003cdiv class=\"dsh-yaxis\">\u003cspan>3万\u003c/span>\u003cspan>1.5万\u003c/span>\u003cspan>0\u003c/span>\u003c/div>\n                \u003cdiv class=\"dsh-chart-wrap\">\n                  \u003csvg class=\"dsh-chart\" viewBox=\"0 0 640 168\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"近 15 天每日播放折线图，峰值 2.7 万次播放\">\n                    \u003cline class=\"axis\" x1=\"0\" y1=\"12\" x2=\"640\" y2=\"12\" />\n                    \u003cline class=\"axis\" x1=\"0\" y1=\"83\" x2=\"640\" y2=\"83\" />\n                    \u003cline class=\"axis\" x1=\"0\" y1=\"154\" x2=\"640\" y2=\"154\" />\n                    \u003cpath class=\"area\" d=\"M0 154 L0 101.9 L46 120.9 L91 78.3 L137 94.8 L183 140.8 L229 99.6 L274 49.9 L320 96.3 L366 125.6 L411 113.8 L457 79.1 L503 26.2 L549 92.5 L594 109 L640 119.9 L640 154 Z\" />\n                    \u003cpath class=\"line\" d=\"M0 101.9 L46 120.9 L91 78.3 L137 94.8 L183 140.8 L229 99.6 L274 49.9 L320 96.3 L366 125.6 L411 113.8 L457 79.1 L503 26.2 L549 92.5 L594 109 L640 119.9\" />\n                  \u003c/svg>\n                  \u003cspan class=\"dsh-peak\" aria-hidden=\"true\">\u003c/span>\n                  \u003cspan class=\"dsh-peak-tag\">峰值 2.7万\u003c/span>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"dsh-xaxis\">\u003cspan>10/30\u003c/span>\u003cspan>11/03\u003c/span>\u003cspan>11/07\u003c/span>\u003cspan>11/11\u003c/span>\u003cspan>11/13\u003c/span>\u003c/div>\n            \u003c/section>\n          \u003c/template>\n\n          \u003c!-- 分布：四域共用一张卡，换的是标题 / 单位 / 条数 -->\n          \u003csection class=\"dsh-card dsh-c-bars\">\n            \u003cdiv class=\"dsh-card-head\">\n              \u003ch2 x-text=\"d.dist.title\">\u003c/h2>\n              \u003cspan class=\"sp\">\u003c/span>\n              \u003cspan class=\"meta\" x-text=\"d.dist.meta\">\u003c/span>\n            \u003c/div>\n            \u003cul class=\"dsh-bars\">\n              \u003ctemplate x-for=\"b in d.dist.bars\" :key=\"b.name\">\n                \u003cli>\n                  \u003cspan class=\"name\" x-text=\"b.name\">\u003c/span>\n                  \u003cspan class=\"val\" x-text=\"b.val\">\u003c/span>\n                  \u003cspan class=\"track\">\u003ci :class=\"{ mut: b.mut }\" :style=\"`width:${b.pct}%`\">\u003c/i>\u003c/span>\n                \u003c/li>\n              \u003c/template>\n            \u003c/ul>\n          \u003c/section>\n\n          \u003c!-- 主列表：四域共用。首列按数据换形态——排行序号 / 字牌 / 日期 -->\n          \u003csection class=\"dsh-card dsh-c-top\">\n            \u003cdiv class=\"dsh-card-head\">\n              \u003ch2 x-text=\"d.pool.title\">\u003c/h2>\n              \u003cspan class=\"sp\">\u003c/span>\n              \u003cspan class=\"meta\" x-text=\"d.pool.meta\">\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"dsh-list-head\">\n              \u003cspan x-text=\"d.pool.cols[0]\">\u003c/span>\n              \u003cspan x-text=\"d.pool.cols[1]\">\u003c/span>\n            \u003c/div>\n            \u003col class=\"dsh-top-list\">\n              \u003ctemplate x-for=\"(it, i) in d.pool.items\" :key=\"i\">\n                \u003cli :class=\"{ empty: it.empty }\">\u003cbutton>\n                  \u003cspan class=\"rank\" x-show=\"it.rank\" x-text=\"it.rank\">\u003c/span>\n                  \u003cspan class=\"date\" x-show=\"it.ident.date\">\u003cb x-text=\"it.ident.v\">\u003c/b>\u003csmall x-text=\"it.ident.w\">\u003c/small>\u003c/span>\n                  \u003cspan class=\"thumb\" x-show=\"!it.ident.date\" :class=\"it.ident.p\" x-text=\"it.ident.v\">\u003c/span>\n                  \u003cspan class=\"t\">\u003cstrong x-text=\"it.title\">\u003c/strong>\u003csmall x-text=\"it.sub\">\u003c/small>\u003c/span>\n                  \u003cspan class=\"n\" x-text=\"it.n\">\u003c/span>\n                \u003c/button>\u003c/li>\n              \u003c/template>\n            \u003c/ol>\n          \u003c/section>\n\n          \u003c!-- 建议：只有复盘域能给出「结论 + 对照数据」，且回写的是选题规则 -->\n          \u003ctemplate x-if=\"tab === '复盘'\">\n            \u003csection class=\"dsh-card dsh-c-adv\">\n              \u003cdiv class=\"dsh-card-head\">\n                \u003ch2>给你的建议\u003c/h2>\n                \u003cspan class=\"sp\">\u003c/span>\n                \u003cspan class=\"meta\">从数据里提炼\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"dsh-advice\">\n                \u003ctemplate x-for=\"r in [\n                  { id: '封面写数字', name: '标题里写清数字', text: '封面写清数字的笔记点击率是 1.8 倍。',\n                    bars: [{ name: '封面有数字', val: '1.8×', pct: 100 }, { name: '封面无数字', val: '1.0×', pct: 56, mut: true }] },\n                  { id: '开头直给结果', name: '开头三秒先给结果', text: '铺垫式开头的平均完播低 41%。',\n                    bars: [{ name: '直给结果', val: '49%', pct: 100 }, { name: '铺垫开场', val: '29%', pct: 59, mut: true }] }\n                ]\" :key=\"r.id\">\n                  \u003cdiv class=\"dsh-tip\">\n                    \u003cstrong x-text=\"r.name\">\u003c/strong>\n                    \u003cp x-text=\"r.text\">\u003c/p>\n                    \u003cul class=\"dsh-bars mini\">\n                      \u003ctemplate x-for=\"b in r.bars\" :key=\"b.name\">\n                        \u003cli>\n                          \u003cspan class=\"name\" x-text=\"b.name\">\u003c/span>\n                          \u003cspan class=\"val\" x-text=\"b.val\">\u003c/span>\n                          \u003cspan class=\"track\">\u003ci :class=\"{ mut: b.mut }\" :style=\"`width:${b.pct}%`\">\u003c/i>\u003c/span>\n                        \u003c/li>\n                      \u003c/template>\n                    \u003c/ul>\n                    \u003cbutton class=\"act\" :class=\"{ done: rules.includes(r.id) }\" @click=\"rules.includes(r.id) || (rules.push(r.id), run(r.id, '已写进选题规则'))\">\n                      \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath :d=\"rules.includes(r.id) ? 'M5 12l5 5 9-10' : 'M12 5v14M5 12h14'\" />\u003c/svg>\n                      \u003cspan x-text=\"rules.includes(r.id) ? '已写进规则' : '写进规则'\">\u003c/span>\n                    \u003c/button>\n                  \u003c/div>\n                \u003c/template>\n              \u003c/div>\n            \u003c/section>\n          \u003c/template>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 右栏：深墨主角卡（域不同、形态同一张）+ 该域的要点 -->\n      \u003caside class=\"dsh-rail\">\n        \u003cbutton class=\"dsh-next\">\n          \u003cspan class=\"top\">\u003cspan x-text=\"d.rail.dark.top\">\u003c/span>\u003cspan>\u003cspan class=\"pulse\">\u003c/span> \u003cspan x-text=\"d.rail.dark.when\">\u003c/span>\u003c/span>\u003c/span>\n          \u003cdiv class=\"big\" x-text=\"d.rail.dark.big\">\u003c/div>\n          \u003cdiv class=\"name\" x-text=\"d.rail.dark.name\">\u003c/div>\n          \u003cdiv class=\"foot\" x-text=\"d.rail.dark.foot\">\u003c/div>\n        \u003c/button>\n\n        \u003csection class=\"dsh-card dsh-c-note\">\n          \u003cdiv class=\"dsh-card-head\">\n            \u003ch2 x-text=\"d.rail.notes.title\">\u003c/h2>\n            \u003cspan class=\"sp\">\u003c/span>\n            \u003cspan class=\"meta\" x-text=\"d.rail.notes.meta\">\u003c/span>\n          \u003c/div>\n          \u003cul class=\"dsh-notes\">\n            \u003ctemplate x-for=\"t in d.rail.notes.items\" :key=\"t\">\n              \u003cli>\u003cspan class=\"dot\">\u003c/span>\u003cspan x-text=\"t\">\u003c/span>\u003c/li>\n            \u003c/template>\n          \u003c/ul>\n        \u003c/section>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/template>\n\n  \u003c!-- 操作回执：窄栏里贴在底部，宽栏里靠右下 -->\n  \u003cdiv class=\"dsh-toast\" :class=\"toast &amp;&amp; 'show'\" x-text=\"toast\" role=\"status\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* 宽窄两版由容器查询自动切换（见上方 @container），此处只保留两个手动入口：\n   ?narrow=1 在宽视口里强制窄栏版，方便对比；?scheme=dark 切深色。 */\nconst q = new URLSearchParams(location.search);\nif (q.get('scheme') === 'dark') document.documentElement.dataset.scheme = 'dark';\nif (q.has('narrow')) document.getElementById('dsh').style.width = '600px';\n/* 出场总时长 200ms，录屏抓不到中间帧。两个取证开关：\n   ?slow=8  等比放慢（只动时长，不动曲线与位移），用于录屏；\n   ?freeze=\u003cms> 把所有动画精确定格在某一刻，用于取真正的开始/中间/结束三帧。 */\nif (q.has('slow')) {\n  const k = Number(q.get('slow')) || 8;\n  document.getElementById('dsh').style.setProperty('--s', String(k));\n  document.documentElement.style.setProperty('--dur', 200 * k + 'ms');\n}\nif (q.has('freeze')) {\n  const t = Number(q.get('freeze')) || 0;\n  addEventListener('load', () => {\n    // 定格动画：负的 animation-delay 把动画 seek 到 t，再暂停。\n    document.getAnimations().forEach(a => { a.pause(); a.currentTime = t; });\n    // 定格后再置一次，等 Alpine 把元素插完\n    requestAnimationFrame(() => document.getAnimations().forEach(a => { a.pause(); a.currentTime = t; }));\n  });\n}\n\u003c/script>\n\u003cscript>/* 运营视图 · 四域内容（方向 D）\n *\n * 四个域共用同一副外壳：顶栏胶囊 / Hero 结论句 + 指标带 / 卡片网格 / 右栏深墨卡 + 要点。\n * 差别只在**内容与口径**，所以内容抽到这里，d.html 只留结构。\n *\n * 口径按域实配，不套用复盘的数字——这是把 D 铺到四域时唯一真正要重推的东西：\n *   选题看「待加工几条、来源是哪、先做哪条」——没有播放量\n *   素材看「在制几条、卡在哪」——还没有表现数据\n *   排期看「本周几条、哪天是空的」——还没有结果\n *   复盘才有播放 / 互动 / 完播\n * 四项指标照抄复盘会把另外三域做成假仪表盘：选题域根本没有播放量可读。\n *\n * 图标是单条 24×24 描边路径（一条 \u003cpath> 承载多段，用多个 M 连接），\n * 这样 x-for 里的图标不需要 SVG sprite——\u003ctemplate> 放进 \u003csvg> 不是合法 SVG 内容。\n *\n * 所有数字、标题、账号名均为示意，未接入真实平台数据；\n * 界面里不出现「示例」「未接入」这类制作说明。\n */\nwindow.opsData = function () {\n  const I = {\n    hot: 'M4 17l5-5 3 3 5-6M15 9h4v4',\n    plus: 'M12 5v14M5 12h14',\n    link: 'M10 14a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7L11 7.3M14 10a4 4 0 0 0-5.7 0L6 12.3a4 4 0 0 0 5.7 5.7L13 16.7',\n    edit: 'M5 19h14M15 5l4 4-8.5 8.5-4.5 1 1-4.5z',\n    download: 'M12 4v10M8 11l4 4 4-4M5 18h14',\n    calendar: 'M5 6h14v13H5zM5 10h14M9 4v4M15 4v4',\n    copy: 'M9 9h10v10H9zM5 15V5h10',\n    check: 'M5 12l5 5 9-10',\n    clipboard: 'M5 5h14v15H5zM9 4h6v3H9zM9 12h6M9 16h4',\n  };\n\n  const DOMAINS = {\n    选题: {\n      lead:\n   $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
