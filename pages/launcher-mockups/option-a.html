<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hamuna launcher — option A · paper calm</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ink: #1a1a1a;
  --ink-soft: #2b2b2b;
  --ink-mute: #6f6f6f;
  --ink-faint: #a8a8a8;
  --paper: #fafaf8;
  --paper-pure: #ffffff;
  --hair: #e6e6e2;
  --accent: #d75040;
  --font: 'Helvetica Neue', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }

/* ---------- titlebar · minimal ---------- */
.titlebar {
  height: 36px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  -webkit-app-region: drag;
}
.titlebar .brand {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
}
.titlebar .meta {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.06em;
  -webkit-app-region: no-drag;
}

/* ---------- frame · generous air ---------- */
.frame {
  height: calc(100vh - 36px - 28px);
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 0;
  padding: 0 56px;
}

/* ---------- LEFT · almost empty ---------- */
.left {
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 56px 0;
  border-right: 1px solid var(--hair);
  padding-right: 56px;
}

.hero-block { max-width: 32ch; }
.hero-num {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.2em;
  font-weight: 400;
  margin-bottom: 24px;
}
.hero {
  font-family: var(--font);
  font-weight: 300;
  font-size: 38px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.hero .accent { color: var(--accent); font-weight: 300; }

/* input — looks like a single hairline */
.input {
  width: 100%;
  max-width: 440px;
  background: transparent;
  border: 0; outline: 0;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
  padding: 12px 0;
  border-bottom: 1px solid var(--ink);
  resize: none;
}
.input::placeholder { color: var(--ink-faint); }
.input-tools {
  max-width: 440px;
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px;
}
.input-tools .left-tools { display: flex; gap: 16px; }
.input-tools .left-tools .tool {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.06em;
}
.input-tools .left-tools .tool:hover { color: var(--ink); }
.input-tools .send {
  font-size: 11px;
  color: var(--ink);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 0;
}
.input-tools .send:hover { color: var(--accent); }

/* provider meta line */
.provider-line {
  max-width: 440px;
  margin-top: 28px;
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
  display: flex; gap: 18px;
}
.provider-line .k { color: var(--ink-faint); }
.provider-line .v { color: var(--ink); }

/* ---------- RIGHT · index list ---------- */
.right {
  padding: 56px 0 56px 56px;
  display: flex; flex-direction: column;
  gap: 32px;
}

.list-head {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--hair);
}

.list { display: flex; flex-direction: column; }
.row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: baseline;
  padding: 14px 0;
  border-bottom: 1px solid var(--hair);
  cursor: pointer;
  text-align: left;
  width: 100%;
}
.row .num {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
}
.row .name {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink);
}
.row .when {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
}
.row.current .num { color: var(--accent); }
.row.current .name { color: var(--accent); }

/* ---------- footer · tiny status line ---------- */
.foot {
  height: 28px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  border-top: 1px solid var(--hair);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
}
.foot .r { display: flex; gap: 18px; }

@media (max-width: 760px) {
  .frame {
    grid-template-columns: 1fr;
    padding: 0 24px;
    height: auto;
    min-height: calc(100vh - 36px - 28px);
  }
  body { overflow: auto; }
  .left {
    padding: 32px 0;
    border-right: 0;
    padding-right: 0;
  }
  .right { padding: 24px 0 32px; }
  .hero { font-size: 28px; }
}
</style>
</head>
<body>

<header class="titlebar">
  <span class="brand">hamuna</span>
  <span class="meta">v0.3.185</span>
</header>

<main class="frame">

  <section class="left">
    <div class="hero-block">
      <div class="hero-num">01 / 04</div>
      <h1 class="hero">A desktop that <span class="accent">does the work.</span></h1>
    </div>

    <div>
      <textarea class="input" placeholder="What do you want done?" rows="2"></textarea>
      <div class="input-tools">
        <div class="left-tools">
          <span class="tool">attach</span>
          <span class="tool">image</span>
          <span class="tool">schedule</span>
        </div>
        <button class="send">send ›</button>
      </div>
      <div class="provider-line">
        <span><span class="k">model</span> deepseek-v4-flash-0731</span>
        <span><span class="k">balance</span> ¥42.80</span>
      </div>
    </div>
  </section>

  <aside class="right">

    <div>
      <div class="list-head">Workspaces · 04</div>
      <div class="list">
        <button class="row current">
          <span class="num">01</span>
          <span class="name">~/projects/mino</span>
          <span class="when">2m</span>
        </button>
        <button class="row">
          <span class="num">02</span>
          <span class="name">~/writing/notes</span>
          <span class="when">1d</span>
        </button>
        <button class="row">
          <span class="num">03</span>
          <span class="name">~/work/q3-report</span>
          <span class="when">3d</span>
        </button>
        <button class="row">
          <span class="num">04</span>
          <span class="name">~/archive/old-blog</span>
          <span class="when">31d</span>
        </button>
      </div>
    </div>

    <div>
      <div class="list-head">Scheduled · 02</div>
      <div class="list">
        <button class="row">
          <span class="num">01</span>
          <span class="name">Weekly sales digest</span>
          <span class="when">mon 9:00</span>
        </button>
        <button class="row">
          <span class="num">02</span>
          <span class="name">GitHub issue triage</span>
          <span class="when">every 6h</span>
        </button>
      </div>
    </div>

  </aside>

</main>

<footer class="foot">
  <span>sidecar ready</span>
  <span class="r"><span>⌘k shortcut</span><span>⌘l logs</span></span>
</footer>

</body>
</html>
