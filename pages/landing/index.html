  <style>
    :root, .sw-root {
      --sw-bg: #F4EDE2;
      --sw-ink: #1a1f24;
      --sw-ink-soft: #5a6470;
      --sw-accent: #1F4F44;
    }
    html, body { margin: 0; padding: 0; background: var(--sw-bg); }
    #boot-veil {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--sw-bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      transition: opacity 480ms ease;
    }
    #boot-veil.gone { opacity: 0; pointer-events: none; }
    #boot-veil .mark {
      width: 64px; height: 64px;
      animation: boot-pulse 1.4s ease-in-out infinite;
    }
    #boot-veil .mark img { width: 100%; height: 100%; display: block; object-fit: contain; }
    #boot-veil .progress {
      width: min(360px, 60vw);
      font-family: var(--sw-font-display, system-ui, sans-serif);
      color: var(--sw-ink-soft);
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    #boot-veil .progress__bar {
      height: 3px;
      background: color-mix(in srgb, var(--sw-ink) 12%, transparent);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }
    #boot-veil .progress__fill {
      height: 100%;
      width: 0%;
      background: var(--sw-accent);
      transition: width 240ms ease;
    }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50%      { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>

  <div id="boot-veil" aria-hidden="true">

      <div class="progress__label">加载场景资源 <span class="progress__count">0 / 0</span></div>

  <script src="engine.js?v=4"></script>
  <script>
    const veil = document.getElementById('boot-veil');
    const veilLabel = veil.querySelector('.progress__count');
    const veilFill = veil.querySelector('.progress__fill');
    const dropVeil = () => veil.classList.add('gone');
    // Hard cap: if the network or engine never reports completion, give up after 90s
    // so the page is still usable on broken/very slow links.
    const hardCap = setTimeout(() => { veilLabel.textContent = '加载超时，仍能继续体验'; dropVeil(); }, 90000);

    let totalClips = 0, readyClips = 0, fetchedBytes = 0;
    window.__swProgress = ({ phase, size } = {}) => {
      if (phase === 'fetched') fetchedBytes += (size || 0);
      if (phase === 'ready') {
        readyClips++;
        const pct = totalClips ? (readyClips / totalClips) * 100 : 0;
        veilFill.style.width = pct.toFixed(1) + '%';
        const mb = (fetchedBytes / 1048576).toFixed(1);
        veilLabel.textContent = `${readyClips} / ${totalClips}  ·  ${mb} MB`;
        if (totalClips && readyClips >= totalClips) {
          clearTimeout(hardCap);
          setTimeout(dropVeil, 320);
        }
      }
    };

    const cfg = JSON.parse(document.getElementById('sw-config').textContent);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Heartbeat: nudge the label every 5s while we wait, so the user can tell
    // "loading…" from "stuck". Caps at 3 nudges; the real progress takes over
    // as soon as __swProgress fires.
    let ticks = 0;
    const heartbeatTick = setInterval(() => {
      if (++ticks > 3) { clearInterval(heartbeatTick); return; }
      if (readyClips === 0) veilLabel.textContent = `等待资源 (${ticks * 5}s)…`;
    }, 5000);
    const init = (cfg) => {
      const dives = (cfg.sections || []).filter(s => s.clip);
      const conns = (cfg.connectors || []).filter(Boolean);
      totalClips = dives.length + conns.length;
      veilLabel.textContent = `0 / ${totalClips}`;
      if (reduceMotion) {
        cfg.preloadOnInit = false;
        mountScrollWorld(document.getElementById('world'), cfg);
        veilLabel.textContent = `${totalClips} / ${totalClips}  ·  静态模式`;
        veilFill.style.width = '100%';
        clearTimeout(hardCap);
        clearInterval(heartbeatTick);
        setTimeout(dropVeil, 320);
      } else {
        cfg.preloadOnInit = true;
        cfg.preloadConcurrency = 4;
        mountScrollWorld(document.getElementById('world'), cfg);
        // Once real progress arrives, the heartbeat is no longer needed.
        const stopHeartbeat = () => { clearInterval(heartbeatTick); };
        const origProgress = window.__swProgress;
        window.__swProgress = (e) => { stopHeartbeat(); origProgress(e); window.__swProgress = origProgress; };
      }
    };
    try { init(cfg); } catch (e) {
      console.error('init failed:', e);
      clearTimeout(hardCap);
      veil.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#1a1f24;text-align:center;max-width:560px">配置加载失败。请按 Ctrl+Shift+R (macOS: Cmd+Shift+R) 强制刷新,或清除浏览器缓存后重试。<br><br><code style="font-size:11px;color:#888">' + (e && e.message ? e.message : String(e)) + '</code></div>';
    }
  </script>
